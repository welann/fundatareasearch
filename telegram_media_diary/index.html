<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>读过，也看过｜私人阅览档案</title>
  <meta name="description" content="从 Telegram 原始记录中提取的书、电影、番剧、电视剧与纪录片感悟。">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --ink: #172033;
      --blue: #243fbd;
      --blue-dark: #152776;
      --paper: #f7f8fc;
      --white: #ffffff;
      --mist: #dce4f5;
      --muted: #68708a;
      --red: #ed5448;
      --yellow: #f3c948;
      --cyan: #3cb7c2;
      --violet: #7b64d5;
      --green: #4a9b72;
      --line: #b8c3dc;
      --display: "STKaiti", "Kaiti SC", "KaiTi", serif;
      --body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      --utility: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--body);
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; }
    button, input { font: inherit; }
    button { color: inherit; }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 20;
      padding: 10px 14px;
      background: var(--yellow);
      transform: translateY(-160%);
    }
    .skip-link:focus { transform: translateY(0); }

    .masthead {
      color: var(--white);
      background: var(--blue);
      border-bottom: 8px solid var(--yellow);
      overflow: hidden;
    }

    .topbar {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid rgba(255,255,255,.28);
      font-family: var(--utility);
      font-size: 12px;
      letter-spacing: .07em;
    }

    .topbar a {
      text-decoration: none;
      padding: 8px 0;
    }
    .topbar a:hover { text-decoration: underline; text-underline-offset: 4px; }

    .hero {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 68px 0 50px;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(250px, .55fr);
      gap: clamp(32px, 7vw, 90px);
      align-items: end;
    }

    .kicker {
      margin: 0 0 18px;
      color: var(--yellow);
      font: 600 12px/1 var(--utility);
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font: 400 clamp(64px, 10vw, 136px)/.86 var(--display);
      letter-spacing: -.08em;
    }

    .hero-deck {
      margin: 28px 0 0;
      max-width: 690px;
      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.8;
      color: #e7ebff;
    }

    .archive-stamp {
      border: 2px solid rgba(255,255,255,.82);
      padding: 20px;
      transform: rotate(2deg);
      box-shadow: 8px 8px 0 var(--blue-dark);
    }

    .archive-stamp strong,
    .archive-stamp span { display: block; }
    .archive-stamp strong {
      font: 700 50px/1 var(--utility);
      color: var(--yellow);
    }
    .archive-stamp span {
      margin-top: 8px;
      font: 12px/1.65 var(--utility);
      letter-spacing: .08em;
    }

    .reel-wrap {
      padding: 0 0 58px;
    }
    .reel-label {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto 14px;
      font: 600 12px/1 var(--utility);
      letter-spacing: .12em;
      color: #e7ebff;
    }
    .reel {
      position: relative;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(340px, 43vw);
      gap: 14px;
      overflow-x: auto;
      padding: 34px max(20px, calc((100vw - 1180px) / 2)) 36px;
      background: #0d173f;
      scrollbar-color: var(--yellow) #0d173f;
      scroll-snap-type: x proximity;
    }
    .reel::before,
    .reel::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 13px;
      background: repeating-linear-gradient(90deg, transparent 0 17px, var(--paper) 17px 29px, transparent 29px 42px);
      opacity: .85;
      pointer-events: none;
    }
    .reel::before { top: 7px; }
    .reel::after { bottom: 7px; }

    .frame {
      min-height: 250px;
      padding: 26px 28px 24px;
      color: var(--ink);
      background: var(--white);
      border-top: 8px solid var(--red);
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .frame:nth-child(3n+2) { border-top-color: var(--yellow); }
    .frame:nth-child(3n) { border-top-color: var(--cyan); }
    .frame blockquote {
      margin: 0;
      font: 400 clamp(19px, 2.2vw, 25px)/1.7 var(--display);
    }
    .frame footer {
      margin-top: 22px;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      color: var(--muted);
      font: 11px/1.5 var(--utility);
    }

    main {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 62px 0 90px;
    }

    .ledger {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 42px;
      align-items: start;
      padding-bottom: 62px;
      border-bottom: 1px solid var(--line);
    }
    .ledger h2,
    .archive-heading h2 {
      margin: 0;
      font: 400 clamp(38px, 6vw, 68px)/1 var(--display);
      letter-spacing: -.05em;
    }
    .ledger-copy {
      margin: 20px 0 0;
      max-width: 670px;
      color: #3f4961;
      font-size: 16px;
      line-height: 1.9;
    }

    .facts {
      margin: 0;
      border-top: 2px solid var(--ink);
    }
    .fact {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 16px;
      align-items: baseline;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }
    .fact dt {
      color: var(--muted);
      font: 11px/1.4 var(--utility);
      letter-spacing: .07em;
    }
    .fact dd {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
    }

    .archive-section { padding-top: 62px; }
    .archive-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 30px;
      margin-bottom: 28px;
    }
    .archive-heading p {
      margin: 0;
      color: var(--muted);
      font: 12px/1.6 var(--utility);
      text-align: right;
    }

    .controls {
      position: sticky;
      top: 0;
      z-index: 8;
      margin: 0 0 42px;
      padding: 13px 14px;
      color: var(--white);
      background: rgba(23,32,51,.96);
      border-bottom: 4px solid var(--yellow);
      backdrop-filter: blur(10px);
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0;
    }
    .filter-button,
    .sort-button {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 8px 12px;
      color: #dfe5f3;
      background: transparent;
      border: 1px solid #68738e;
      border-radius: 0;
      cursor: pointer;
      font: 12px/1 var(--utility);
    }
    .filter-button:hover,
    .sort-button:hover { border-color: var(--white); }
    .filter-button[aria-pressed="true"] {
      color: var(--ink);
      background: var(--yellow);
      border-color: var(--yellow);
    }
    .control-spacer { flex: 1; min-width: 10px; }
    .search-wrap {
      flex: 0 0 min(270px, 38vw);
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      min-height: 38px;
      padding: 8px 12px;
      color: var(--white);
      background: #0f1728;
      border: 1px solid #68738e;
      border-radius: 0;
      outline: none;
    }
    .search-wrap input::placeholder { color: #9ca6bc; }
    .search-wrap input:focus { border-color: var(--yellow); }

    .year-group {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 34px;
      margin-bottom: 68px;
    }
    .year-mark {
      position: sticky;
      top: 82px;
      align-self: start;
      padding-top: 10px;
      font: 700 32px/1 var(--utility);
      color: var(--blue);
    }
    .year-mark::after {
      content: "";
      display: block;
      width: 40px;
      height: 7px;
      margin-top: 14px;
      background: var(--red);
    }

    .notes {
      position: relative;
      display: grid;
      gap: 22px;
    }
    .notes::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 14px;
      width: 1px;
      background: var(--line);
    }

    .note {
      --accent: var(--blue);
      position: relative;
      margin-left: 42px;
      padding: 0 0 24px 22px;
      background: var(--white);
      border-left: 7px solid var(--accent);
      box-shadow: 0 1px 0 rgba(23,32,51,.08);
    }
    .note[data-medium="电影"] { --accent: var(--red); }
    .note[data-medium="番剧"] { --accent: var(--violet); }
    .note[data-medium="电视剧"] { --accent: var(--green); }
    .note[data-medium="纪录片"] { --accent: var(--cyan); }
    .note[data-medium="漫画"] { --accent: var(--red); }
    .note[data-medium="阅读随记"] { --accent: var(--yellow); }
    .note::before {
      content: "";
      position: absolute;
      left: -55px;
      top: 26px;
      width: 13px;
      height: 13px;
      background: var(--accent);
      border: 4px solid var(--paper);
      outline: 1px solid var(--line);
    }

    .note-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      padding: 21px 22px 16px 0;
      border-bottom: 1px solid #dfe4ef;
    }
    .note-title {
      margin: 0;
      font-size: clamp(20px, 2.7vw, 29px);
      line-height: 1.25;
      letter-spacing: -.025em;
    }
    .note-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px 12px;
      margin-top: 10px;
      color: var(--muted);
      font: 11px/1.4 var(--utility);
    }
    .medium-label { color: var(--accent); font-weight: 700; }
    .status-label::before { content: "["; }
    .status-label::after { content: "]"; }
    .message-link {
      align-self: start;
      padding: 8px 0;
      color: var(--blue);
      font: 11px/1.4 var(--utility);
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }
    .message-link:hover { color: var(--red); }

    .reflection-wrap {
      position: relative;
      padding: 22px 28px 0 0;
    }
    .reflection {
      margin: 0;
      display: grid;
      gap: 16px;
      font: 400 clamp(18px, 2vw, 22px)/1.85 var(--display);
    }
    .reflection-block {
      margin: 0;
      white-space: pre-line;
    }
    .reflection-quote {
      padding: 16px 18px;
      color: #414a60;
      background: #f0f2f8;
      border-left: 3px solid var(--accent);
      font-size: .86em;
      line-height: 1.78;
    }
    .reflection-quote::before {
      content: "原文摘录";
      display: block;
      margin-bottom: 8px;
      color: var(--accent);
      font: 700 10px/1.4 var(--utility);
      letter-spacing: .1em;
    }
    .reflection.is-collapsed {
      max-height: 12.95em;
      overflow: hidden;
    }
    .reflection.is-collapsed::after {
      content: "";
      position: absolute;
      left: 0;
      right: 28px;
      bottom: 0;
      height: 4em;
      background: linear-gradient(transparent, var(--white));
      pointer-events: none;
    }
    .expand-button {
      margin-top: 17px;
      padding: 7px 0;
      color: var(--blue);
      background: transparent;
      border: 0;
      border-bottom: 1px solid currentColor;
      cursor: pointer;
      font: 11px/1 var(--utility);
    }
    .reference-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 18px;
      font: 11px/1.5 var(--utility);
    }
    .reference-links a {
      color: var(--blue);
      text-underline-offset: 4px;
    }

    .empty {
      display: none;
      padding: 46px;
      text-align: center;
      border: 1px solid var(--line);
      background: var(--white);
    }
    .empty.is-visible { display: block; }

    .page-footer {
      padding: 40px 20px;
      color: #cbd3e8;
      background: var(--ink);
      text-align: center;
      font: 11px/1.8 var(--utility);
    }
    .page-footer a { color: var(--yellow); text-underline-offset: 4px; }

    :focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 3px;
    }

    @media (max-width: 800px) {
      .hero { grid-template-columns: 1fr; padding-top: 48px; }
      .archive-stamp { max-width: 270px; }
      .ledger { grid-template-columns: 1fr; }
      .archive-heading { align-items: start; flex-direction: column; }
      .archive-heading p { text-align: left; }
      .control-row { align-items: stretch; }
      .search-wrap { flex-basis: 190px; }
      .year-group { grid-template-columns: 1fr; gap: 18px; }
      .year-mark { position: static; }
      .year-mark::after { width: 100%; height: 1px; margin-top: 10px; background: var(--line); }
      .reel { grid-auto-columns: minmax(300px, 82vw); }
    }

    @media (max-width: 520px) {
      .topbar { width: min(100% - 28px, 1180px); }
      .topbar span { display: none; }
      .hero, main, .reel-label { width: min(100% - 28px, 1180px); }
      h1 { font-size: 64px; }
      .notes::before { left: 6px; }
      .note { margin-left: 26px; padding-left: 16px; }
      .note::before { left: -35px; }
      .note-head { grid-template-columns: 1fr; gap: 4px; }
      .message-link { justify-self: start; }
      .reflection-wrap { padding-right: 18px; }
      .reflection.is-collapsed::after { right: 18px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .frame, .note { animation: arrive .45s both; animation-delay: calc(var(--order, 0) * 35ms); }
      @keyframes arrive {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }

    @media print {
      .masthead { color: var(--ink); background: var(--white); border-bottom-color: var(--ink); }
      .topbar, .reel-wrap, .controls, .expand-button { display: none !important; }
      .hero { display: block; padding: 30px 0; }
      h1 { font-size: 64px; }
      .hero-deck { color: var(--ink); }
      .archive-stamp { margin-top: 24px; box-shadow: none; border-color: var(--ink); }
      .archive-stamp strong { color: var(--ink); }
      .year-mark { position: static; }
      .note { break-inside: avoid; box-shadow: none; }
      .reflection.is-collapsed { max-height: none; }
      .reflection.is-collapsed::after { display: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#archive">跳到阅览记录</a>

  <header class="masthead">
    <div class="topbar">
      <a href="../index.html">← FUN DATA RESEARCH</a>
      <span id="date-range"></span>
    </div>
    <div class="hero">
      <div>
        <p class="kicker">Reading & viewing diary</p>
        <h1>读过，<br>也看过</h1>
        <p class="hero-deck">不是评分表，也不是推荐榜。这里只保留作品碰到生活时，你当时写下来的那部分。</p>
      </div>
      <div class="archive-stamp" aria-label="档案摘录数量">
        <strong id="entry-count">—</strong>
        <span>条阅览记录<br>纯收藏不计入</span>
      </div>
    </div>
    <div class="reel-wrap">
      <p class="reel-label">SELECTED FRAMES / 横向滑动</p>
      <div class="reel" id="reel" aria-label="精选感悟"></div>
    </div>
  </header>

  <main>
    <section class="ledger" aria-labelledby="method-title">
      <div>
        <h2 id="method-title">先辨认原话，<br>再谈作品。</h2>
        <p class="ledger-copy" id="method-copy"></p>
      </div>
      <dl class="facts" id="facts"></dl>
    </section>

    <section class="archive-section" id="archive" aria-labelledby="archive-title">
      <div class="archive-heading">
        <h2 id="archive-title">阅览切片</h2>
        <p><span id="visible-count">—</span> 条记录<br>默认最新优先</p>
      </div>

      <div class="controls" aria-label="筛选阅览记录">
        <div class="control-row" id="controls">
          <button class="filter-button" type="button" data-medium="全部" aria-pressed="true">全部</button>
          <button class="filter-button" type="button" data-medium="书" aria-pressed="false">书</button>
          <button class="filter-button" type="button" data-medium="电影" aria-pressed="false">电影</button>
          <button class="filter-button" type="button" data-medium="番剧" aria-pressed="false">番剧</button>
          <button class="filter-button" type="button" data-medium="电视剧" aria-pressed="false">电视剧</button>
          <button class="filter-button" type="button" data-medium="纪录片" aria-pressed="false">纪录片</button>
          <button class="filter-button" type="button" data-medium="漫画" aria-pressed="false">漫画</button>
          <button class="filter-button" type="button" data-medium="阅读随记" aria-pressed="false">阅读随记</button>
          <span class="control-spacer"></span>
          <button class="sort-button" id="sort-button" type="button">切到从早到晚</button>
          <label class="search-wrap">
            <span hidden>搜索作品或原话</span>
            <input id="search" type="search" placeholder="搜索作品或原话">
          </label>
        </div>
      </div>

      <div id="timeline" aria-live="polite"></div>
      <div class="empty" id="empty">没有符合当前条件的记录。换一个媒介，或清空搜索词。</div>
    </section>
  </main>

  <footer class="page-footer">
    <p>内容来自 Telegram 导出；页面只做摘录与编排，不替原话补充结论。</p>

正常朋友“我”身上，经历了一些事情之后，“我”主动接触药物，患上乘觉障碍，然后和她处于相同的世界，大概就是这么一回事。","我有些不能理解，因为书里说了有些世界是存在解决乘觉障碍的方法的，只不过因为知识水平的原因无法搬运回这个世界，完全可以继续找方法直到解决这种病嘛，干嘛要自断后路呢？不过又想到他们的家人朋友都是正常的，也可以帮他们解决这个问题，而且书里说了这是一个无限可能的世界，总之就当他们在玩一种新的游戏好了。","评价：完整的故事，可以看看"],"excerpt":"读了《平滑世界和它的敌人》\n\n一个短篇科幻，设定上挺有趣的：每个人的“灵魂”都可以自由穿梭在不同世界的自己身上，选择自己想过的生活，所以每个人的可能性都是无穷的。 但是有些人无法进行穿梭，也就是有“乘觉障碍”，他们的人生没有无限选择，被困在了单独的世界里。\n\n故事发生在一个因故患上乘觉障碍的人和她的正常朋友“我”身上，经历了一些事情之后，“我”主动接触药物，患上乘觉障碍，然后和她处于相同的世界，大概就是这么一回事。\n\n我有些不能理解，因为书里说了有些世界是存在解决乘觉障碍的方法的，只不过因为知识水平的原因无法搬运回这个世界，完全可以继续找方法直到解决这种病嘛，干嘛要自断后路呢？不过又想到他们的家人朋友都是正常的，也可以帮他们解决这个问题，而且书里说了这是一个无限可能的世界，总之就当他们在玩一种新的游戏好了。\n\n评价：完整的故事，可以看看","message_url":"https://t.me/bookshelf_in_storageroom/1516","reference_links":[],"reference_url":""},{"id":1670,"title":"恋人絮语","medium":"书","status":"在读","date":"2023-10-20","year":2023,"date_label":"2023.10.20","blocks":[{"kind":"note","text":"这本书叫「恋人絮语」 读起来懵懵懂懂，前面读过的文字下一段就忘记了，可能是因为我很少读这类书，多读读就好了（总不能谈恋爱之后才能读懂吧"}],"paragraphs":["这本书叫「恋人絮语」 读起来懵懵懂懂，前面读过的文字下一段就忘记了，可能是因为我很少读这类书，多读读就好了（总不能谈恋爱之后才能读懂吧"],"excerpt":"这本书叫「恋人絮语」 读起来懵懵懂懂，前面读过的文字下一段就忘记了，可能是因为我很少读这类书，多读读就好了（总不能谈恋爱之后才能读懂吧","message_url":"https://t.me/bookshelf_in_storageroom/1670","reference_links":[],"reference_url":""},{"id":1677,"title":"恋人絮语","medium":"书","status":"在读","max_paragraphs":3,"date":"2023-10-20","year":2023,"date_label":"2023.10.20","blocks":[{"kind":"note","text":"『恋人絮语』我读起来感觉没什么「内容」，它是作者的一段段思绪，读起来有「是的，我也是这么想的」这种想法"},{"kind":"note","text":"这本书还和『少年维特的烦恼』有关，不过我没读过"},{"kind":"note","text":"适合没事的时候看几段"}],"paragraphs":["『恋人絮语』我读起来感觉没什么「内容」，它是作者的一段段思绪，读起来有「是的，我也是这么想的」这种想法","这本书还和『少年维特的烦恼』有关，不过我没读过","适合没事的时候看几段"],"excerpt":"『恋人絮语』我读起来感觉没什么「内容」，它是作者的一段段思绪，读起来有「是的，我也是这么想的」这种想法\n\n这本书还和『少年维特的烦恼』有关，不过我没读过\n\n适合没事的时候看几段","message_url":"https://t.me/bookshelf_in_storageroom/1677","reference_links":[],"reference_url":""},{"id":1839,"title":"关于阅读耐力","medium":"阅读随记","status":"随记","date":"2023-10-31","year":2023,"date_label":"2023.10.31","blocks":[{"kind":"note","text":"其实我现在只适合看200页左右的故事书，知识类的看的很慢，然后就渐 读者能对这个人要做什么有个推测） 我现在才看了大概七分之一，大概两周能看完，推荐大伙有兴趣的可以看一下（至于克里希那穆提，等我有闲了再看吧x）"}],"paragraphs":["微信读书上看到了「沧浪之水」这本书，于是去读读 老实说这种类型的书我并不喜欢甚至很讨厌，不过这本书写的很流畅，把人物刻画的很好（或者说人物都是自带刻板印象的，读者能对这个人要做什么有个推测） 我现在才看了大概七分之一，大概两周能看完，推荐大伙有兴趣的可以看一下（至于克里希那穆提，等我有闲了再看吧x）"],"excerpt":"微信读书上看到了「沧浪之水」这本书，于是去读读 老实说这种类型的书我并不喜欢甚至很讨厌，不过这本书写的很流畅，把人物刻画的很好（或者说人物都是自带刻板印象的，读者能对这个人要做什么有个推测） 我现在才看了大概七分之一，大概两周能看完，推荐大伙有兴趣的可以看一下（至于克里希那穆提，等我有闲了再看吧x）","message_url":"https://t.me/bookshelf_in_storageroom/1927","reference_links":[],"reference_url":""},{"id":1928,"title":"沧浪之水","medium":"书","status":"随记","max_paragraphs":4,"date":"2023-11-06","year":2023,"date_label":"2023.11.06","blocks":[{"kind":"note","text":"下面这段是主角对于什么是自己的疑问。主角此时还有点“清高”，觉得带着其他目的去接触别人不是“君子”，即便最后的结果是两方都受益的，坚持“论心不论迹”，不管怎么样初心一定要好。"},{"kind":"note","text":"有段时间我也对什么才能保障自己灵魂的纯洁性不受污染而惶恐，我害怕做了一些事情之后我的灵魂会发生不可逆转的变化，即便我的肉体还是原本那个。"},{"kind":"note","text":"走在命运的分叉路口，这时候有外力告诉我右边十几米有一条新路线，我如果去走了的话，那么那条路上的我和十字路口的我还是一个人吗？"},{"kind":"note","text":"当时我的世界观很奇葩（所以不能跟精神病人讲逻辑），我真的在为自己的灵魂有没有被污染而和看不见的精神怪物搏斗（要是我信教的话可能会是一个虔诚级别的信徒？）"},{"kind":"note","text":"回到宿舍我想来想去，决定即使要跟那姑娘试一试感觉如何，也得等毕业了再说。还没开始就欠下一个人情，那怎么行？我没去找人事干事。他遇见我，询问地望我一眼，我模糊地笑一笑，他就再没表情了。半个月后，消息传出来，留下来的是我的一个同学。我感到委屈，可跟谁去说，又怎么说？我体会到哑巴吃黄连的滋味。原则千条万条，利害关系是第一条。实质性问题，都是在这种微妙之处决定的。我的导师问我愿不愿去药检局，我说：“我回省里去。”到底我在北京呆了八年，还是呆出了感情。我安慰自己说：“北京有什么好？最大的好处就是难得进来。”又想着自己如果玩点小聪明，先应了人事干事，以后该怎么样还怎么样，岂不就没了这场委屈？可如果那样，我池大为还是池大为吗？"}],"paragraphs":["下面这段是主角对于什么是自己的疑问。主角此时还有点“清高”，觉得带着其他目的去接触别人不是“君子”，即便最后的结果是两方都受益的，坚持“论心不论迹”，不管怎么样初心一定要好。","有段时间我也对什么才能保障自己灵魂的纯洁性不受污染而惶恐，我害怕做了一些事情之后我的灵魂会发生不可逆转的变化，即便我的肉体还是原本那个。","走在命运的分叉路口，这时候有外力告诉我右边十几米有一条新路线，我如果去走了的话，那么那条路上的我和十字路口的我还是一个人吗？","当时我的世界观很奇葩（所以不能跟精神病人讲逻辑），我真的在为自己的灵魂有没有被污染而和看不见的精神怪物搏斗（要是我信教的话可能会是一个虔诚级别的信徒？）","回到宿舍我想来想去，决定即使要跟那姑娘试一试感觉如何，也得等毕业了再说。还没开始就欠下一个人情，那怎么行？我没去找人事干事。他遇见我，询问地望我一眼，我模糊地笑一笑，他就再没表情了。半个月后，消息传出来，留下来的是我的一个同学。我感到委屈，可跟谁去说，又怎么说？我体会到哑巴吃黄连的滋味。原则千条万条，利害关系是第一条。实质性问题，都是在这种微妙之处决定的。我的导师问我愿不愿去药检局，我说：“我回省里去。”到底我在北京呆了八年，还是呆出了感情。我安慰自己说：“北京有什么好？最大的好处就是难得进来。”又想着自己如果玩点小聪明，先应了人事干事，以后该怎么样还怎么样，岂不就没了这场委屈？可如果那样，我池大为还是池大为吗？"],"excerpt":"下面这段是主角对于什么是自己的疑问。主角此时还有点“清高”，觉得带着其他目的去接触别人不是“君子”，即便最后的结果是两方都受益的，坚持“论心不论迹”，不管怎么样初心一定要好。\n\n有段时间我也对什么才能保障自己灵魂的纯洁性不受污染而惶恐，我害怕做了一些事情之后我的灵魂会发生不可逆转的变化，即便我的肉体还是原本那个。\n\n走在命运的分叉路口，这时候有外力告诉我右边十几米有一条新路线，我如果去走了的话，那么那条路上的我和十字路口的我还是一个人吗？\n\n当时我的世界观很奇葩（所以不能跟精神病人讲逻辑），我真的在为自己的灵魂有没有被污染而和看不见的精神怪物搏斗（要是我信教的话可能会是一个虔诚级别的信徒？）\n\n回到宿舍我想来想去，决定即使要跟那姑娘试一试感觉如何，也得等毕业了再说。还没开始就欠下一个人情，那怎么行？我没去找人事干事。他遇见我，询问地望我一眼，我模糊地笑一笑，他就再没表情了。半个月后，消息传出来，留下来的是我的一个同学。我感到委屈，可跟谁去说，又怎么说？我体会到哑巴吃黄连的滋味。原则千条万条，利害关系是第一条。实质性问题，都是在这种微妙之处决定的。我的导师问我愿不愿去药检局，我说：“我回省里去。”到底我在北京呆了八年，还是呆出了感情。我安慰自己说：“北京有什么好？最大的好处就是难得进来。”又想着自己如果玩点小聪明，先应了人事干事，以后该怎么样还怎么样，岂不就没了这场委屈？可如果那样，我池大为还是池大为吗？","message_url":"https://t.me/bookshelf_in_storageroom/1928","reference_links":[],"reference_url":""},{"id":1982,"title":"机器学习（西瓜书）","medium":"书","status":"搁置","date":"2023-11-11","year":2023,"date_label":"2023.11.11","blocks":[{"kind":"note","text":"说出来有点可耻，西瓜书我买了三四年了，但是现在第二章都没读完..."}],"paragraphs":["说出来有点可耻，西瓜书我买了三四年了，但是现在第二章都没读完..."],"excerpt":"说出来有点可耻，西瓜书我买了三四年了，但是现在第二章都没读完...","message_url":"https://t.me/bookshelf_in_storageroom/1982","reference_links":[{"label":"https://github.com/datawhalechina/pumpkin-book","url":"https://github.com/datawhalechina/pumpkin-book"}],"reference_url":"https://github.com/datawhalechina/pumpkin-book"},{"id":2028,"title":"BLUE GIANT／蓝色巨人","medium":"番剧","status":"看完","featured":true,"max_paragraphs":6,"date":"2023-11-14","year":2023,"date_label":"2023.11.14","blocks":[{"kind":"note","text":"看了『BLUE GIANT（蓝色巨人） 』 也是一部有关乐队追梦的动漫片，时长两个小时"},{"kind":"note","text":"男主是个乐观派，无论什么时候都充满活力的那种，钢琴手技术很好，但是困于没找到自己的“道”，鼓手从零基础一直成长到能够登上顶级舞台，这其中男主的鼓励必不可少（这让我想到了以前看的那部傻*『爆裂鼓手』，在这里再骂一次）"},{"kind":"note","text":"整部片的画面没什么缺点，而且会在进行音乐表演的时候转换成三渲二，细节很丰富，镜头很晃很爽，而且进行了一些艺术化改造，总之很好看就是了"},{"kind":"note","text":"有关剧中的音乐部分，因为男主吹的是萨克斯我之前几乎没怎么听过，所以男主给钢琴手炫技的时候我还以为他要被钢琴手羞辱了，因为我听起来真的感觉很难听（x 不过三人一起演奏时的音乐都很好，配合画面能够感受到那种激情"},{"kind":"note","text":"（后面的演奏舍不得停下来截图，然后看完又懒得回去截了，所以只留下这三张）"},{"kind":"note","text":"总之，推荐观看！"}],"paragraphs":["看了『BLUE GIANT（蓝色巨人） 』 也是一部有关乐队追梦的动漫片，时长两个小时","男主是个乐观派，无论什么时候都充满活力的那种，钢琴手技术很好，但是困于没找到自己的“道”，鼓手从零基础一直成长到能够登上顶级舞台，这其中男主的鼓励必不可少（这让我想到了以前看的那部傻*『爆裂鼓手』，在这里再骂一次）","整部片的画面没什么缺点，而且会在进行音乐表演的时候转换成三渲二，细节很丰富，镜头很晃很爽，而且进行了一些艺术化改造，总之很好看就是了","有关剧中的音乐部分，因为男主吹的是萨克斯我之前几乎没怎么听过，所以男主给钢琴手炫技的时候我还以为他要被钢琴手羞辱了，因为我听起来真的感觉很难听（x 不过三人一起演奏时的音乐都很好，配合画面能够感受到那种激情","（后面的演奏舍不得停下来截图，然后看完又懒得回去截了，所以只留下这三张）","总之，推荐观看！"],"excerpt":"看了『BLUE GIANT（蓝色巨人） 』 也是一部有关乐队追梦的动漫片，时长两个小时\n\n男主是个乐观派，无论什么时候都充满活力的那种，钢琴手技术很好，但是困于没找到自己的“道”，鼓手从零基础一直成长到能够登上顶级舞台，这其中男主的鼓励必不可少（这让我想到了以前看的那部傻*『爆裂鼓手』，在这里再骂一次）\n\n整部片的画面没什么缺点，而且会在进行音乐表演的时候转换成三渲二，细节很丰富，镜头很晃很爽，而且进行了一些艺术化改造，总之很好看就是了\n\n有关剧中的音乐部分，因为男主吹的是萨克斯我之前几乎没怎么听过，所以男主给钢琴手炫技的时候我还以为他要被钢琴手羞辱了，因为我听起来真的感觉很难听（x 不过三人一起演奏时的音乐都很好，配合画面能够感受到那种激情\n\n（后面的演奏舍不得停下来截图，然后看完又懒得回去截了，所以只留下这三张）\n\n总之，推荐观看！","message_url":"https://t.me/bookshelf_in_storageroom/2028","reference_links":[],"reference_url":""},{"id":2512,"title":"Taylor Swift：时代巡回演唱会","medium":"电影","status":"看完","max_paragraphs":2,"date":"2023-12-30","year":2023,"date_label":"2023.12.30","blocks":[{"kind":"note","text":"找了 泰勒斯威夫特 时代巡回演唱会 看 效果好棒 —— 差不多看完了，感觉没啥意思...不是粉丝的话似乎有点折磨..."}],"paragraphs":["找了 泰勒斯威夫特 时代巡回演唱会 看 效果好棒 —— 差不多看完了，感觉没啥意思...不是粉丝的话似乎有点折磨..."],"excerpt":"找了 泰勒斯威夫特 时代巡回演唱会 看 效果好棒 —— 差不多看完了，感觉没啥意思...不是粉丝的话似乎有点折磨...","message_url":"https://t.me/bookshelf_in_storageroom/2512","reference_links":[],"reference_url":""},{"id":2689,"title":"幸福之路","medium":"书","status":"在读","date":"2024-01-18","year":2024,"date_label":"2024.01.18","blocks":[{"kind":"note","text":"来自幸福之路的片段，第四章：无聊与兴奋 可能是天气叠加在做的事情没啥意思导致的焦虑"},{"kind":"quote","text":"我并不想把反对兴奋推到极端，一定量的兴奋是有益的，但几乎与其他所有东西一样，关键在于度。过少会导致病态渴求，过多又会导致热情耗尽。所以，生活幸福的基础是要拥有一定的忍受无聊的能力，这是一个人年轻时的必修课之一。\n\n现代都市人所承受的特殊的无聊，与他们离开了自然生活密切相关。离开自然使生活变得焦灼、枯燥和饥渴，犹如一趟沙漠之旅。听起来近乎荒谬的是：有些能够随意选择生活方式的富人，由于惧怕无聊，反而使自己陷入了另一种更加难以忍受的无聊。幸福生活在很大程度上必定是一种宁静的生活，唯有宁静的气氛才能蕴含真正的幸福。"}],"paragraphs":["来自幸福之路的片段，第四章：无聊与兴奋 可能是天气叠加在做的事情没啥意思导致的焦虑"],"excerpt":"来自幸福之路的片段，第四章：无聊与兴奋 可能是天气叠加在做的事情没啥意思导致的焦虑\n\n我并不想把反对兴奋推到极端，一定量的兴奋是有益的，但几乎与其他所有东西一样，关键在于度。过少会导致病态渴求，过多又会导致热情耗尽。所以，生活幸福的基础是要拥有一定的忍受无聊的能力，这是一个人年轻时的必修课之一。\n\n现代都市人所承受的特殊的无聊，与他们离开了自然生活密切相关。离开自然使生活变得焦灼、枯燥和饥渴，犹如一趟沙漠之旅。听起来近乎荒谬的是：有些能够随意选择生活方式的富人，由于惧怕无聊，反而使自己陷入了另一种更加难以忍受的无聊。幸福生活在很大程度上必定是一种宁静的生活，唯有宁静的气氛才能蕴含真正的幸福。","message_url":"https://t.me/bookshelf_in_storageroom/2689","reference_links":[],"reference_url":""},{"id":2719,"title":"Approaching (Almost) Any Machine Learning Problem","medium":"书","status":"读完","max_paragraphs":6,"date":"2024-01-20","year":2024,"date_label":"2024.01.20","blocks":[{"kind":"note","text":"Approaching (Almost) Any Machine Learning Problem 大概看完了"},{"kind":"note","text":"这本书我认为比较适合机器学习初学者，在学完一些理论后看这个上手解决一些问题 它所谓的解决几乎所有问题，指的是把一些基本的流程告诉你，你可以照着这个流水线去解决问题：处理数据，构造模型，训练，然后就可以拿金牌啦"},{"kind":"note","text":"但是具体的细节它一点也没说，该怎么搭建一个合适的模型？书里只用到了预训练好的模型resnet之类的（虽然很多时候这些玩意确实够用了，但是拿金牌肯定是不够的）"},{"kind":"note","text":"总之相当于一份比较详细的模板吧，给了一份标准的模板，但是应用到每个问题上做的修改还是得你自己慢慢摸索，这本书里不存在什么作弊秘籍"},{"kind":"note","text":"书的最后两章讲的是实际部署中的东西，感觉没啥意思，特别是最后的用docker+flask部署，完全可以替换成抱抱脸的网站+gradio，方便还好用（在我看来）"}],"paragraphs":["Approaching (Almost) Any Machine Learning Problem 大概看完了","这本书我认为比较适合机器学习初学者，在学完一些理论后看这个上手解决一些问题 它所谓的解决几乎所有问题，指的是把一些基本的流程告诉你，你可以照着这个流水线去解决问题：处理数据，构造模型，训练，然后就可以拿金牌啦","但是具体的细节它一点也没说，该怎么搭建一个合适的模型？书里只用到了预训练好的模型resnet之类的（虽然很多时候这些玩意确实够用了，但是拿金牌肯定是不够的）","总之相当于一份比较详细的模板吧，给了一份标准的模板，但是应用到每个问题上做的修改还是得你自己慢慢摸索，这本书里不存在什么作弊秘籍","书的最后两章讲的是实际部署中的东西，感觉没啥意思，特别是最后的用docker+flask部署，完全可以替换成抱抱脸的网站+gradio，方便还好用（在我看来）"],"excerpt":"Approaching (Almost) Any Machine Learning Problem 大概看完了\n\n这本书我认为比较适合机器学习初学者，在学完一些理论后看这个上手解决一些问题 它所谓的解决几乎所有问题，指的是把一些基本的流程告诉你，你可以照着这个流水线去解决问题：处理数据，构造模型，训练，然后就可以拿金牌啦\n\n但是具体的细节它一点也没说，该怎么搭建一个合适的模型？书里只用到了预训练好的模型resnet之类的（虽然很多时候这些玩意确实够用了，但是拿金牌肯定是不够的）\n\n总之相当于一份比较详细的模板吧，给了一份标准的模板，但是应用到每个问题上做的修改还是得你自己慢慢摸索，这本书里不存在什么作弊秘籍\n\n书的最后两章讲的是实际部署中的东西，感觉没啥意思，特别是最后的用docker+flask部署，完全可以替换成抱抱脸的网站+gradio，方便还好用（在我看来）","message_url":"https://t.me/bookshelf_in_storageroom/2719","reference_links":[],"reference_url":""},{"id":2840,"title":"人道主义吸血鬼征自杀志愿者","medium":"电影","status":"看完","max_paragraphs":5,"date":"2024-02-02","year":2024,"date_label":"2024.02.02","blocks":[{"kind":"note","text":"在看 人道主义吸血鬼在寻找自杀自愿者 具体的剧情还没了解不过从画面上看小时候的女主好可爱 这女主要是当个虚拟主播能有一大帮人心甘情愿的给她血喝"},{"kind":"note","text":"看完了！ 作为一个半小时的电影质量还不错，剧情有点小缺憾然后就没啥了 推荐感兴趣的看看 这部剧主要讲的其实是男主和女主推翻旧吸血鬼体制，在新的生产关系里，联合人类创造共赢的事情"},{"kind":"note","text":"来源："}],"paragraphs":["在看 人道主义吸血鬼在寻找自杀自愿者 具体的剧情还没了解不过从画面上看小时候的女主好可爱 这女主要是当个虚拟主播能有一大帮人心甘情愿的给她血喝","看完了！ 作为一个半小时的电影质量还不错，剧情有点小缺憾然后就没啥了 推荐感兴趣的看看 这部剧主要讲的其实是男主和女主推翻旧吸血鬼体制，在新的生产关系里，联合人类创造共赢的事情","来源："],"excerpt":"在看 人道主义吸血鬼在寻找自杀自愿者 具体的剧情还没了解不过从画面上看小时候的女主好可爱 这女主要是当个虚拟主播能有一大帮人心甘情愿的给她血喝\n\n看完了！ 作为一个半小时的电影质量还不错，剧情有点小缺憾然后就没啥了 推荐感兴趣的看看 这部剧主要讲的其实是男主和女主推翻旧吸血鬼体制，在新的生产关系里，联合人类创造共赢的事情\n\n来源：","message_url":"https://t.me/bookshelf_in_storageroom/2840","reference_links":[{"label":"https://weibo.com/6028015551/4982637165019279","url":"https://weibo.com/6028015551/4982637165019279"}],"reference_url":"https://weibo.com/6028015551/4982637165019279"},{"id":3016,"title":"小市民系列：春季限定草莓挞事件","medium":"书","status":"读完","max_paragraphs":6,"date":"2024-02-17","year":2024,"date_label":"2024.02.17","blocks":[{"kind":"note","text":"今天读完了一本小说《小市民系列：春季限定草莓挞事件》 这本书的作者另一部出名的作品是《冰菓》，我也是看到这个系列要出番剧的预告才买回来看的"},{"kind":"note","text":"这本书的腰封宣传语是“继“冰菓”系列之后 又一青春校园推理力作”，但是书中推理的部分，给我的感觉就是："},{"kind":"note","text":"现在需要找到四个数字让它们的和为1，而已经有两个数字是确定的，1和2，还有两个空怎么解决呢？就算是全填零也不对啊 对了，数学上还有负数这一概念，我们填上一个0和一个-2就能解决问题了"},{"kind":"note","text":"就是这种感觉"},{"kind":"note","text":"至于男女主之间的情感，因为整个系列有好几本，这本属于第一本，所以没有什么很明显的场面，两个人也都认为他们并没有在谈恋爱，而是一种“同盟，互相掩护，各取所需，互惠互利”的关系"},{"kind":"note","text":"和网文比最大优点在于故事的完整性吧（相比网文一本完整订阅几十块的，还算便宜），总之可以读，但是等番剧出来直接看会比较好 如果有空了我会把剩下的几本读读"}],"paragraphs":["今天读完了一本小说《小市民系列：春季限定草莓挞事件》 这本书的作者另一部出名的作品是《冰菓》，我也是看到这个系列要出番剧的预告才买回来看的","这本书的腰封宣传语是“继“冰菓”系列之后 又一青春校园推理力作”，但是书中推理的部分，给我的感觉就是：","现在需要找到四个数字让它们的和为1，而已经有两个数字是确定的，1和2，还有两个空怎么解决呢？就算是全填零也不对啊 对了，数学上还有负数这一概念，我们填上一个0和一个-2就能解决问题了","就是这种感觉","至于男女主之间的情感，因为整个系列有好几本，这本属于第一本，所以没有什么很明显的场面，两个人也都认为他们并没有在谈恋爱，而是一种“同盟，互相掩护，各取所需，互惠互利”的关系","和网文比最大优点在于故事的完整性吧（相比网文一本完整订阅几十块的，还算便宜），总之可以读，但是等番剧出来直接看会比较好 如果有空了我会把剩下的几本读读"],"excerpt":"今天读完了一本小说《小市民系列：春季限定草莓挞事件》 这本书的作者另一部出名的作品是《冰菓》，我也是看到这个系列要出番剧的预告才买回来看的\n\n这本书的腰封宣传语是“继“冰菓”系列之后 又一青春校园推理力作”，但是书中推理的部分，给我的感觉就是：\n\n现在需要找到四个数字让它们的和为1，而已经有两个数字是确定的，1和2，还有两个空怎么解决呢？就算是全填零也不对啊 对了，数学上还有负数这一概念，我们填上一个0和一个-2就能解决问题了\n\n就是这种感觉\n\n至于男女主之间的情感，因为整个系列有好几本，这本属于第一本，所以没有什么很明显的场面，两个人也都认为他们并没有在谈恋爱，而是一种“同盟，互相掩护，各取所需，互惠互利”的关系\n\n和网文比最大优点在于故事的完整性吧（相比网文一本完整订阅几十块的，还算便宜），总之可以读，但是等番剧出来直接看会比较好 如果有空了我会把剩下的几本读读","message_url":"https://t.me/bookshelf_in_storageroom/3016","reference_links":[],"reference_url":""},{"id":3104,"title":"通往夏天的隧道，再见的出口","medium":"书","status":"读完","featured":true,"max_paragraphs":5,"date":"2024-02-25","year":2024,"date_label":"2024.02.25","blocks":[{"kind":"note","text":"这两天在火车上读完了这本书：《通往夏天的隧道，再见的出口》"},{"kind":"note","text":"这本书给我的感觉比上一本小说强很多，女主从东京转学到小地方遇到男主，天降系开局 两个人因为某个事件开始有了联系，从同班的陌生人变成了守护同一个秘密的朋友，然后自然而然的过渡到恋人，书中倒是没有两个人直球告白的场面（话说我一直觉得告白好尴尬，可能是因为我还没有喜欢的人吧x），两情相悦真好啊真好啊真好啊☺️"},{"kind":"note","text":"这本书还有个剧版改编，我还没看，因为火车上的时间其实并没有我想象的那么多，这次火车上的旅途还算可以，如果同卧铺的人没打呼噜就更好了"},{"kind":"note","text":"在看书的时候我似乎还有点什么想说的，但是现在忘掉了，既然能忘掉那估计不是什么重要的事情吧"},{"kind":"note","text":"我现在呆在宿舍里，尽管开着空调但是还是又湿又冷 我也想握住某个人的手，拥抱她，感受她身体的温度（要是这样能让我暖起来就好了） 这在现实里怕是无法完成了，希望梦里可以看到她"}],"paragraphs":["这两天在火车上读完了这本书：《通往夏天的隧道，再见的出口》","这本书给我的感觉比上一本小说强很多，女主从东京转学到小地方遇到男主，天降系开局 两个人因为某个事件开始有了联系，从同班的陌生人变成了守护同一个秘密的朋友，然后自然而然的过渡到恋人，书中倒是没有两个人直球告白的场面（话说我一直觉得告白好尴尬，可能是因为我还没有喜欢的人吧x），两情相悦真好啊真好啊真好啊☺️","这本书还有个剧版改编，我还没看，因为火车上的时间其实并没有我想象的那么多，这次火车上的旅途还算可以，如果同卧铺的人没打呼噜就更好了","在看书的时候我似乎还有点什么想说的，但是现在忘掉了，既然能忘掉那估计不是什么重要的事情吧","我现在呆在宿舍里，尽管开着空调但是还是又湿又冷 我也想握住某个人的手，拥抱她，感受她身体的温度（要是这样能让我暖起来就好了） 这在现实里怕是无法完成了，希望梦里可以看到她"],"excerpt":"这两天在火车上读完了这本书：《通往夏天的隧道，再见的出口》\n\n这本书给我的感觉比上一本小说强很多，女主从东京转学到小地方遇到男主，天降系开局 两个人因为某个事件开始有了联系，从同班的陌生人变成了守护同一个秘密的朋友，然后自然而然的过渡到恋人，书中倒是没有两个人直球告白的场面（话说我一直觉得告白好尴尬，可能是因为我还没有喜欢的人吧x），两情相悦真好啊真好啊真好啊☺️\n\n这本书还有个剧版改编，我还没看，因为火车上的时间其实并没有我想象的那么多，这次火车上的旅途还算可以，如果同卧铺的人没打呼噜就更好了\n\n在看书的时候我似乎还有点什么想说的，但是现在忘掉了，既然能忘掉那估计不是什么重要的事情吧\n\n我现在呆在宿舍里，尽管开着空调但是还是又湿又冷 我也想握住某个人的手，拥抱她，感受她身体的温度（要是这样能让我暖起来就好了） 这在现实里怕是无法完成了，希望梦里可以看到她","message_url":"https://t.me/bookshelf_in_storageroom/3104","reference_links":[],"reference_url":""},{"id":3167,"title":"三小时快学期权","medium":"书","status":"在读","date":"2024-03-02","year":2024,"date_label":"2024.03.02","blocks":[{"kind":"note","text":"最近我在看一本关于期权的书：『3小时快学期权』"},{"kind":"note","text":"短小精悍，基本上可以算是科普类书籍，推荐感兴趣的读一下"},{"kind":"note","text":"就是下面这本"}],"paragraphs":["最近我在看一本关于期权的书：『3小时快学期权』","短小精悍，基本上可以算是科普类书籍，推荐感兴趣的读一下","就是下面这本"],"excerpt":"最近我在看一本关于期权的书：『3小时快学期权』\n\n短小精悍，基本上可以算是科普类书籍，推荐感兴趣的读一下\n\n就是下面这本","message_url":"https://t.me/bookshelf_in_storageroom/3167","reference_links":[{"label":"https://t.me/bookshelf_in_storageroom/2927","url":"https://t.me/bookshelf_in_storageroom/2927"}],"reference_url":"https://t.me/bookshelf_in_storageroom/2927"},{"id":3237,"title":"三小时快学期权","medium":"书","status":"读完","max_paragraphs":4,"date":"2024-03-10","year":2024,"date_label":"2024.03.10","blocks":[{"kind":"note","text":"《三小时快学期权》看的差不多了，虽然名字是三个小时，但是我花了两个上午（不知道干啥的思政课）以及一些其他的时间"},{"kind":"note","text":"这本书算是讲期权如何“交易”的，以及一些简单的策略以及其后果 举了一些例子让读者更容易理解这些策略是如何获利的 它没有讲期权是如何定价的，最复杂的数学内容也就是加减乘除 总的来说算是一本科普书"},{"kind":"note","text":"书中多次强调的是“对未来的预期”，似乎作者默认使用期权的人都对市场有着自己的理解 对于期权交易者来说，对市场判断越精准越能获利，所有人都知道未来的某一天btc会站上10w，但是没法用这种判断获利"},{"kind":"note","text":"很不幸的是我对市场一点理解也没有，看这本书啥也没学到"}],"paragraphs":["《三小时快学期权》看的差不多了，虽然名字是三个小时，但是我花了两个上午（不知道干啥的思政课）以及一些其他的时间","这本书算是讲期权如何“交易”的，以及一些简单的策略以及其后果 举了一些例子让读者更容易理解这些策略是如何获利的 它没有讲期权是如何定价的，最复杂的数学内容也就是加减乘除 总的来说算是一本科普书","书中多次强调的是“对未来的预期”，似乎作者默认使用期权的人都对市场有着自己的理解 对于期权交易者来说，对市场判断越精准越能获利，所有人都知道未来的某一天btc会站上10w，但是没法用这种判断获利","很不幸的是我对市场一点理解也没有，看这本书啥也没学到"],"excerpt":"《三小时快学期权》看的差不多了，虽然名字是三个小时，但是我花了两个上午（不知道干啥的思政课）以及一些其他的时间\n\n这本书算是讲期权如何“交易”的，以及一些简单的策略以及其后果 举了一些例子让读者更容易理解这些策略是如何获利的 它没有讲期权是如何定价的，最复杂的数学内容也就是加减乘除 总的来说算是一本科普书\n\n书中多次强调的是“对未来的预期”，似乎作者默认使用期权的人都对市场有着自己的理解 对于期权交易者来说，对市场判断越精准越能获利，所有人都知道未来的某一天btc会站上10w，但是没法用这种判断获利\n\n很不幸的是我对市场一点理解也没有，看这本书啥也没学到","message_url":"https://t.me/bookshelf_in_storageroom/3237","reference_links":[],"reference_url":""},{"id":3302,"title":"幸福之路","medium":"书","status":"读完","max_paragraphs":4,"date":"2024-03-17","year":2024,"date_label":"2024.03.17","blocks":[{"kind":"note","text":"这个星期把上学期没看完的 《幸福之路》 看完了 因为书里面是按照每章一个主题进行写作的，所以续上进度没什么困难"},{"kind":"note","text":"这本书是罗素在1930年代写的书，从名字可以看出来它的主题是什么，这本书给我的感觉是很真诚，没有故弄玄虚，所有的观点都用易懂的话进行了解释，即便作为心灵鸡汤来说，也是上好的汤"},{"kind":"note","text":"非常建议大家读读，只有一百来页"},{"kind":"note","text":"书里罗素说："},{"kind":"quote","text":"我的⽬标是消除那些⽂明社会中⼤多数⼈感受着的⽇复⼀⽇的⽣活烦恼，它们没有明确诱因，仿佛⽆处可逃，愈发难以忍受。我认为，这些不幸福很⼤程度上归咎于错误的世界观、错误的伦理观、错误的⽣活习惯，它们毁掉了⼈们原本可能有的天然的兴致和胃⼝，⽽⼀切幸福，⽆论⼈或动物，皆基于此。观念与习惯都是个⼈可以掌控之事，我想就它们提些改进建议，佐以寻常运⽓，幸福或便可得。"},{"kind":"note","text":"这段话至今仍然有效，并且几乎一百年后仅仅是从报纸上的文字变成了网络空间中的文字+视频"},{"kind":"quote","text":"幸福的本质在于我们能够从⼼所欲地⽣活，⽽不是听命于我们的邻居，甚或我们的亲戚的想法和愿望。对隔壁邻居的恐惧肯定是⽐以前少多了，但新的恐惧⼜出现了，就是害怕报纸说话。这⼏乎和中世纪猎杀⼥巫⼀样可怕。如果报纸找了⼀个可能本没什么危害的替罪⽺，结果可能更可怕。幸好，⼤多数⼈因为⾃⼰是⽆名之辈⽽逃脱了这样的命运，但随着⼤众传播⼿段⽇益完善，这种新的社会迫害⽅式的危险性也与⽇俱增。这是⼀件⾮常严肃的事情，决不可以以受害者的不屑计较不了了之，⽆论⼈们怎样看待新闻⾃由这个重要原则，我认为还是要制定出⽐现⾏的诽谤罪更明确的规定，禁⽌⼀切令⽆辜者难以忍受的⾏为，即使他们说过或做过什么，也不得恶意公开让他们不能⻅⼈。不过，根除这种恶⾏的⾸要⽅法是提升公众的宽容度，提升宽容度的最佳⽅法则是增加能够享受真正的幸福的⼈，因为这种⼈不会把⾃⼰的主要乐趣建⽴在制造同胞痛苦的基础上。"},{"kind":"note","text":"下面是我的一些摘抄"}],"paragraphs":["这个星期把上学期没看完的 《幸福之路》 看完了 因为书里面是按照每章一个主题进行写作的，所以续上进度没什么困难","这本书是罗素在1930年代写的书，从名字可以看出来它的主题是什么，这本书给我的感觉是很真诚，没有故弄玄虚，所有的观点都用易懂的话进行了解释，即便作为心灵鸡汤来说，也是上好的汤","非常建议大家读读，只有一百来页","书里罗素说：","这段话至今仍然有效，并且几乎一百年后仅仅是从报纸上的文字变成了网络空间中的文字+视频","下面是我的一些摘抄"],"excerpt":"这个星期把上学期没看完的 《幸福之路》 看完了 因为书里面是按照每章一个主题进行写作的，所以续上进度没什么困难\n\n这本书是罗素在1930年代写的书，从名字可以看出来它的主题是什么，这本书给我的感觉是很真诚，没有故弄玄虚，所有的观点都用易懂的话进行了解释，即便作为心灵鸡汤来说，也是上好的汤\n\n非常建议大家读读，只有一百来页\n\n书里罗素说：\n\n我的⽬标是消除那些⽂明社会中⼤多数⼈感受着的⽇复⼀⽇的⽣活烦恼，它们没有明确诱因，仿佛⽆处可逃，愈发难以忍受。我认为，这些不幸福很⼤程度上归咎于错误的世界观、错误的伦理观、错误的⽣活习惯，它们毁掉了⼈们原本可能有的天然的兴致和胃⼝，⽽⼀切幸福，⽆论⼈或动物，皆基于此。观念与习惯都是个⼈可以掌控之事，我想就它们提些改进建议，佐以寻常运⽓，幸福或便可得。\n\n这段话至今仍然有效，并且几乎一百年后仅仅是从报纸上的文字变成了网络空间中的文字+视频\n\n幸福的本质在于我们能够从⼼所欲地⽣活，⽽不是听命于我们的邻居，甚或我们的亲戚的想法和愿望。对隔壁邻居的恐惧肯定是⽐以前少多了，但新的恐惧⼜出现了，就是害怕报纸说话。这⼏乎和中世纪猎杀⼥巫⼀样可怕。如果报纸找了⼀个可能本没什么危害的替罪⽺，结果可能更可怕。幸好，⼤多数⼈因为⾃⼰是⽆名之辈⽽逃脱了这样的命运，但随着⼤众传播⼿段⽇益完善，这种新的社会迫害⽅式的危险性也与⽇俱增。这是⼀件⾮常严肃的事情，决不可以以受害者的不屑计较不了了之，⽆论⼈们怎样看待新闻⾃由这个重要原则，我认为还是要制定出⽐现⾏的诽谤罪更明确的规定，禁⽌⼀切令⽆辜者难以忍受的⾏为，即使他们说过或做过什么，也不得恶意公开让他们不能⻅⼈。不过，根除这种恶⾏的⾸要⽅法是提升公众的宽容度，提升宽容度的最佳⽅法则是增加能够享受真正的幸福的⼈，因为这种⼈不会把⾃⼰的主要乐趣建⽴在制造同胞痛苦的基础上。\n\n下面是我的一些摘抄","message_url":"https://t.me/bookshelf_in_storageroom/3302","reference_links":[{"label":"https://book.douban.com/subject/35302634/","url":"https://book.douban.com/subject/35302634/"},{"label":"https://telegra.ph/幸福之路-03-17","url":"https://telegra.ph/幸福之路-03-17"}],"reference_url":"https://book.douban.com/subject/35302634/"},{"id":3638,"title":"扩散模型从原理到实战","medium":"书","status":"读完","max_paragraphs":6,"date":"2024-04-29","year":2024,"date_label":"2024.04.29","blocks":[{"kind":"note","text":"读完了《扩散模型从原理到实战》 这本书的副标题其实应该改成：hugging face 系列库的使用"},{"kind":"note","text":"这本书主要有两个部分：扩散模型的基本概念，以及相关实战 代码片段很简洁，看了都懂，还行"},{"kind":"note","text":"可看作科普书，全文中没有讲解任何理论推导过程，只是告诉你使用hugging face库里的这个模块就可以了"},{"kind":"note","text":"虽然看起来这个库确实挺好用，但是这本书面向的应该是做产品的，而不是做研究的"},{"kind":"note","text":"一般般，不推荐做研究的读，纯路人对扩散模型感兴趣的可以读读"}],"paragraphs":["读完了《扩散模型从原理到实战》 这本书的副标题其实应该改成：hugging face 系列库的使用","这本书主要有两个部分：扩散模型的基本概念，以及相关实战 代码片段很简洁，看了都懂，还行","可看作科普书，全文中没有讲解任何理论推导过程，只是告诉你使用hugging face库里的这个模块就可以了","虽然看起来这个库确实挺好用，但是这本书面向的应该是做产品的，而不是做研究的","一般般，不推荐做研究的读，纯路人对扩散模型感兴趣的可以读读"],"excerpt":"读完了《扩散模型从原理到实战》 这本书的副标题其实应该改成：hugging face 系列库的使用\n\n这本书主要有两个部分：扩散模型的基本概念，以及相关实战 代码片段很简洁，看了都懂，还行\n\n可看作科普书，全文中没有讲解任何理论推导过程，只是告诉你使用hugging face库里的这个模块就可以了\n\n虽然看起来这个库确实挺好用，但是这本书面向的应该是做产品的，而不是做研究的\n\n一般般，不推荐做研究的读，纯路人对扩散模型感兴趣的可以读读","message_url":"https://t.me/bookshelf_in_storageroom/3638","reference_links":[{"label":"https://book.douban.com/subject/36482946/","url":"https://book.douban.com/subject/36482946/"}],"reference_url":"https://book.douban.com/subject/36482946/"},{"id":3786,"title":"狂热分子","medium":"书","status":"读完","max_paragraphs":3,"date":"2024-05-13","year":2024,"date_label":"2024.05.13","blocks":[{"kind":"note","text":"翻完了这本书《狂热分子》，因为不是很感兴趣所以跳了一些内容"},{"kind":"note","text":"这本书写的很好，它里面没有任何的黑话，比那些全文都是由xx主义/绝对精神/大他者这种词写成的书好一万倍"},{"kind":"quote","text":"这本书主要探讨群众运动的一些共有特征，重点是陷入狂热的乌合之众的人格。\n埃里克·霍弗（EricHoffer, 1902-1983）的一生十分传奇，7岁失明，15岁复明，父母早逝，靠自学成就学问。长年从事码头搬运工作，1964年成为加州伯克利大学高级研究员后，仍未离开码头，其许多观念都是在码头工作中形成，因此他也被称为“码头工人哲学家”。"},{"kind":"note","text":"这里面有很多金句，比如："},{"kind":"quote","text":"与穷人一起的生活经验，使他认为弗洛伊德的精神压抑之说，在他们穷人世界中是不存在的，他说：「我们这里的人只有金钱的烦恼，没有精神病，要是他们有精神病的话，那是一种金钱可以治好的病。\n\n一个人自己的事要是值得管，他通常都会去管自己的事。如果自己的事不值得管，他就会丢下自己那些没意义的事，转而去管别人家的事。  这神人喜欢搬弄是非、打听试探、越俎代庖，同时对国家和种族事务表现出炽烈兴趣。在逃离「自我」的同时，我们不是会依偎着邻人朋友的肩，就是会掐着他们的咽喉。\n\n凡是从早到晚都要为最起码生活操劳的人，不会有时间、心情去悲愤或造梦。中国民众不易造反的原因之一，就在于他们得花很大力气才赚得到一点点维生之资。他们为生活而激烈挣扎，而这挣扎所发挥的是「一种静态而非动态的影响力」。\n\n社会大气候是否已成熟得让群众运动萌芽，最可靠的指标莫过于是否有一股浓厚的烦闷气氛弥漫。几乎所有有关群众运动发生前一段时期的叙述，都会提到普遍的厌烦情绪。\n\n恨意总是潜藏着钦佩。这一点，部分反映在我们喜欢模仿我们所恨的对象。每一个群众运动都会按照它选定的魔鬼的形象来塑造自己。\n\n我们这个时代的所有「忠实信徒」——不管是共产主义者、纳粹党员、法西斯分子、日本人还是天主教徒——都异口同声指责西方民主国家的颓废堕落。他们论点的核心是说民主制度会让人变得太过软弱、太爱享乐、太自私，不愿意为国家、上帝或任何神圣伟业赴死。他们说，缺乏赴死精神正是民主国家已经腐烂到核心的表征。民主国家业已老朽、腐败和衰败，断不是行将分土封王、信仰弥坚、雄风凛凛的忠实信徒集团的对手。"},{"kind":"note","text":"这些东西到现在也不过时，而且很适合结合当前的社会氛围看，就像《1984》那样，有的人拿它当小说，有的人拿它当行动指南"},{"kind":"note","text":"我觉得，熟练复读书里的话就能在鉴证圈独当一面了x"}],"paragraphs":["翻完了这本书《狂热分子》，因为不是很感兴趣所以跳了一些内容","这本书写的很好，它里面没有任何的黑话，比那些全文都是由xx主义/绝对精神/大他者这种词写成的书好一万倍","这里面有很多金句，比如：","这些东西到现在也不过时，而且很适合结合当前的社会氛围看，就像《1984》那样，有的人拿它当小说，有的人拿它当行动指南","我觉得，熟练复读书里的话就能在鉴证圈独当一面了x"],"excerpt":"翻完了这本书《狂热分子》，因为不是很感兴趣所以跳了一些内容\n\n这本书写的很好，它里面没有任何的黑话，比那些全文都是由xx主义/绝对精神/大他者这种词写成的书好一万倍\n\n这本书主要探讨群众运动的一些共有特征，重点是陷入狂热的乌合之众的人格。\n埃里克·霍弗（EricHoffer, 1902-1983）的一生十分传奇，7岁失明，15岁复明，父母早逝，靠自学成就学问。长年从事码头搬运工作，1964年成为加州伯克利大学高级研究员后，仍未离开码头，其许多观念都是在码头工作中形成，因此他也被称为“码头工人哲学家”。\n\n这里面有很多金句，比如：\n\n与穷人一起的生活经验，使他认为弗洛伊德的精神压抑之说，在他们穷人世界中是不存在的，他说：「我们这里的人只有金钱的烦恼，没有精神病，要是他们有精神病的话，那是一种金钱可以治好的病。\n\n一个人自己的事要是值得管，他通常都会去管自己的事。如果自己的事不值得管，他就会丢下自己那些没意义的事，转而去管别人家的事。  这神人喜欢搬弄是非、打听试探、越俎代庖，同时对国家和种族事务表现出炽烈兴趣。在逃离「自我」的同时，我们不是会依偎着邻人朋友的肩，就是会掐着他们的咽喉。\n\n凡是从早到晚都要为最起码生活操劳的人，不会有时间、心情去悲愤或造梦。中国民众不易造反的原因之一，就在于他们得花很大力气才赚得到一点点维生之资。他们为生活而激烈挣扎，而这挣扎所发挥的是「一种静态而非动态的影响力」。\n\n社会大气候是否已成熟得让群众运动萌芽，最可靠的指标莫过于是否有一股浓厚的烦闷气氛弥漫。几乎所有有关群众运动发生前一段时期的叙述，都会提到普遍的厌烦情绪。\n\n恨意总是潜藏着钦佩。这一点，部分反映在我们喜欢模仿我们所恨的对象。每一个群众运动都会按照它选定的魔鬼的形象来塑造自己。\n\n我们这个时代的所有「忠实信徒」——不管是共产主义者、纳粹党员、法西斯分子、日本人还是天主教徒——都异口同声指责西方民主国家的颓废堕落。他们论点的核心是说民主制度会让人变得太过软弱、太爱享乐、太自私，不愿意为国家、上帝或任何神圣伟业赴死。他们说，缺乏赴死精神正是民主国家已经腐烂到核心的表征。民主国家业已老朽、腐败和衰败，断不是行将分土封王、信仰弥坚、雄风凛凛的忠实信徒集团的对手。\n\n这些东西到现在也不过时，而且很适合结合当前的社会氛围看，就像《1984》那样，有的人拿它当小说，有的人拿它当行动指南\n\n我觉得，熟练复读书里的话就能在鉴证圈独当一面了x","message_url":"https://t.me/bookshelf_in_storageroom/3786","reference_links":[],"reference_url":""},{"id":4264,"title":"仿造品和绚丽多彩的灰","medium":"书","status":"读完","max_paragraphs":5,"date":"2024-07-01","year":2024,"date_label":"2024.07.01","blocks":[{"kind":"note","text":"看完了小说《仿造品和绚丽多彩的灰》 算是半个坏结局（？"},{"kind":"note","text":"这本书的内容可以用我今天看到的一个模板来概括："},{"kind":"quote","text":"1. 先设计一个美少女\n2. (非必选)最好身材苗条娇弱一些，头发偏亮色系\n2. 然后说她是一个机器人/仿生人/人造人/克隆人\n3. 接着设计她一开始三无懵懂，心智未熟\n4. 故事中全程为了人类大人，任劳任怨\n5. 最后终于获得了口口咯(心)\n6. 此刻懂得悲欢她，又不得不和人类大人分开而落泪。"},{"kind":"note","text":"非人美少女，在经历了这么多事情之后终于理解了什么是爱，然后因为使命完成所以不得不离开地球 模板很老套，所以能不能看得下去主要和作者的笔力有关，我觉得这本书还能看得下去"},{"kind":"note","text":"不过书里面有个角色是舔狗，不同时期喜欢的两个人都喜欢女主，这种情节感觉不太行"},{"kind":"quote","text":"我不能回应你的心意。\n没关系。我还是喜欢你。"}],"paragraphs":["看完了小说《仿造品和绚丽多彩的灰》 算是半个坏结局（？","这本书的内容可以用我今天看到的一个模板来概括：","非人美少女，在经历了这么多事情之后终于理解了什么是爱，然后因为使命完成所以不得不离开地球 模板很老套，所以能不能看得下去主要和作者的笔力有关，我觉得这本书还能看得下去","不过书里面有个角色是舔狗，不同时期喜欢的两个人都喜欢女主，这种情节感觉不太行"],"excerpt":"看完了小说《仿造品和绚丽多彩的灰》 算是半个坏结局（？\n\n这本书的内容可以用我今天看到的一个模板来概括：\n\n1. 先设计一个美少女\n2. (非必选)最好身材苗条娇弱一些，头发偏亮色系\n2. 然后说她是一个机器人/仿生人/人造人/克隆人\n3. 接着设计她一开始三无懵懂，心智未熟\n4. 故事中全程为了人类大人，任劳任怨\n5. 最后终于获得了口口咯(心)\n6. 此刻懂得悲欢她，又不得不和人类大人分开而落泪。\n\n非人美少女，在经历了这么多事情之后终于理解了什么是爱，然后因为使命完成所以不得不离开地球 模板很老套，所以能不能看得下去主要和作者的笔力有关，我觉得这本书还能看得下去\n\n不过书里面有个角色是舔狗，不同时期喜欢的两个人都喜欢女主，这种情节感觉不太行\n\n我不能回应你的心意。\n没关系。我还是喜欢你。","message_url":"https://t.me/bookshelf_in_storageroom/4264","reference_links":[],"reference_url":""},{"id":4285,"title":"一部没能读下去的书","medium":"阅读随记","status":"弃读","date":"2024-07-03","year":2024,"date_label":"2024.07.03","blocks":[{"kind":"note","text":"感觉看不下去"}],"paragraphs":["感觉看不下去"],"excerpt":"感觉看不下去","message_url":"https://t.me/bookshelf_in_storageroom/4285","reference_links":[],"reference_url":""},{"id":4409,"title":"概率导论","medium":"书","status":"在读","date":"2024-07-14","year":2024,"date_label":"2024.07.14","blocks":[{"kind":"note","text":"我有信心在短时间内看完的原因："},{"kind":"note","text":"第一章是基础知识的讲解，讲了三门问题，全概率公式和贝叶斯准则 以及排列组合的计算公式"},{"kind":"note","text":"第二三四章也属于基础内容，我看看能不能尽快完成（"}],"paragraphs":["我有信心在短时间内看完的原因：","第一章是基础知识的讲解，讲了三门问题，全概率公式和贝叶斯准则 以及排列组合的计算公式","第二三四章也属于基础内容，我看看能不能尽快完成（"],"excerpt":"我有信心在短时间内看完的原因：\n\n第一章是基础知识的讲解，讲了三门问题，全概率公式和贝叶斯准则 以及排列组合的计算公式\n\n第二三四章也属于基础内容，我看看能不能尽快完成（","message_url":"https://t.me/bookshelf_in_storageroom/4409","reference_links":[],"reference_url":""},{"id":4482,"title":"概率导论","medium":"书","status":"在读","date":"2024-07-21","year":2024,"date_label":"2024.07.21","blocks":[{"kind":"note","text":"看完了第二章离散随机变量"},{"kind":"note","text":"这一章介绍了几个特殊的概率分布：伯努利、二项、几何、泊松 引入了期望、均值和方差的概念，还有独立性 计算了联合分布以及条件分布和"},{"kind":"note","text":"讲到条件分布的时候，有个特殊的例子：两个信封的悖论"}],"paragraphs":["看完了第二章离散随机变量","这一章介绍了几个特殊的概率分布：伯努利、二项、几何、泊松 引入了期望、均值和方差的概念，还有独立性 计算了联合分布以及条件分布和","讲到条件分布的时候，有个特殊的例子：两个信封的悖论"],"excerpt":"看完了第二章离散随机变量\n\n这一章介绍了几个特殊的概率分布：伯努利、二项、几何、泊松 引入了期望、均值和方差的概念，还有独立性 计算了联合分布以及条件分布和\n\n讲到条件分布的时候，有个特殊的例子：两个信封的悖论","message_url":"https://t.me/bookshelf_in_storageroom/4482","reference_links":[],"reference_url":""},{"id":4493,"title":"局外人","medium":"书","status":"读完","max_paragraphs":2,"date":"2024-07-22","year":2024,"date_label":"2024.07.22","blocks":[{"kind":"note","text":"这两天看完了书『局外人』，大概一百页"},{"kind":"note","text":"我能读懂的东西不多，书里前半部分写了点男女关系，比如：她想知道我到底爱不爱她，或许那时候就类似“我和你妈同时落水，你会去救谁”的问题了"},{"kind":"note","text":"还有舔狗的自述："},{"kind":"quote","text":"他给了她足够的生活费，甚至还帮她付了房租，给她一天二十法郎买吃的。“三百法郎房租，六百法郎的伙食费，时不时买几双丝袜，加起来也有一千法郎了。而且她没有工作。她认为理所当然，还说光靠我接济的钱根本活不下去。我就问她：‘为什么不找个半天的兼职做做？那样就能减轻我的一些小笔开支。这个月我给你置办了一套新衣服，我每天给你二十法郎，帮你交了房租，而你呢？你跟朋友喝下午茶。你给他们又送咖啡又送糖。我就负责给你掏钱。我一直待你够不错的了，你却对我很差劲。’但她还是不出去工作，总说她搞不定，种种这般让我觉得自己受了骗。”"},{"kind":"note","text":"男女关系在这一百年里没什么变化也是挺有趣的"},{"kind":"quote","text":"入狱的头些天里，最难过的一关是我还有自由人的想法。比如我总是沉溺于去沙滩游泳的幻想。想象着脚下轻柔的细浪，水漫过全身的感觉，我在想象中体会到的释放感，反过来残忍地映衬出这四面墙围成的空间多么逼仄。但这种想法只持续了几个月。后来就是彻彻底底的囚徒思维了。我期待着每天去院子里放风，或是有律师来访。其余的时光我都安排得很合理。我常常想，就算被勒令生活在枯树干里，除了看头顶的云彩就无事可做，想必我也能渐渐适应的。我将期待着鸟的飞临和流云的际会，就像在这儿期待着律师那条古怪的领带，就像在另一个时空里，我盼望挨到星期六能紧紧搂住玛丽的身体。不过，仔细想想，我并没有生活在一棵枯树里。比我更糟的人多的是。对了，妈妈经常重复一个观点，人最终会适应一切。"},{"kind":"note","text":"我在山里已经呆了五六年了，没体验过什么是现代大都市，虽然每次上学都会经过南京或者上海，但是仅限于车站/机场旁边。尽管这里以旅游出名，我也从来没去过那些特别著名的地方，就连市区都很少去（因为到那里需要花费半小时到一小时，这在我家那里已经够到购物中心并且开吃了）"},{"kind":"note","text":"疫情三年或许是让我适应这种生活的首要原因，我适应了这种生活、面对城市生活反而会有点恐惧，但是我终归是需要面对大城市，需要独自生活 自上个月起就打算每周都出山一次，出去吃点东西，但是到现在也没主动去过，或许我应该放下日常任务，什么都不管地出去玩一天，但是我又不知道有什么可玩的，特别是在这种天气下"},{"kind":"quote","text":"乡间细微的声响悄悄地潜了进来，夜晚的气味、泥土和咸味的空气让我感到凉爽。这酣睡的夏夜里，美妙的平静像潮汐般朝我涌来。就在天刚破晓时，我听见汽笛的鸣响，它宣告着一场旅途，去往一个与我的此刻再无关联的世界。这么久以来，我第一次想到了妈妈。现在，我似乎能理解为什么她生命殆尽之时还找了一个“未婚夫”，为什么她要从头来过。那边也差不多，也是一样的，在生命渐凋的养老院周围，夜色就像一场忧郁的安息。死亡近在咫尺，妈妈一定感到了解脱，并且为重生做好了准备。无人——无人有权替她哀哭。我亦如此，我已准备重新再活一遍。仿佛那阵狂怒洗净了我的苦痛，也抽空了我的希望。凝视着遍布星光、充满象征意味的夜空，我前所未有地敞开了自己，将自己交付于宇宙那温柔的冷漠。我感觉它就如我一般，像是一位兄弟，让我感到过去是幸福的，现在也是幸福的。为了耗尽一切，为了减轻几分孤独，我所期待的唯有执行死刑的那天，蜂拥而至的人群对我致以憎恶的嚎叫。"}],"paragraphs":["这两天看完了书『局外人』，大概一百页","我能读懂的东西不多，书里前半部分写了点男女关系，比如：她想知道我到底爱不爱她，或许那时候就类似“我和你妈同时落水，你会去救谁”的问题了","还有舔狗的自述：","男女关系在这一百年里没什么变化也是挺有趣的","我在山里已经呆了五六年了，没体验过什么是现代大都市，虽然每次上学都会经过南京或者上海，但是仅限于车站/机场旁边。尽管这里以旅游出名，我也从来没去过那些特别著名的地方，就连市区都很少去（因为到那里需要花费半小时到一小时，这在我家那里已经够到购物中心并且开吃了）","疫情三年或许是让我适应这种生活的首要原因，我适应了这种生活、面对城市生活反而会有点恐惧，但是我终归是需要面对大城市，需要独自生活 自上个月起就打算每周都出山一次，出去吃点东西，但是到现在也没主动去过，或许我应该放下日常任务，什么都不管地出去玩一天，但是我又不知道有什么可玩的，特别是在这种天气下"],"excerpt":"这两天看完了书『局外人』，大概一百页\n\n我能读懂的东西不多，书里前半部分写了点男女关系，比如：她想知道我到底爱不爱她，或许那时候就类似“我和你妈同时落水，你会去救谁”的问题了\n\n还有舔狗的自述：\n\n他给了她足够的生活费，甚至还帮她付了房租，给她一天二十法郎买吃的。“三百法郎房租，六百法郎的伙食费，时不时买几双丝袜，加起来也有一千法郎了。而且她没有工作。她认为理所当然，还说光靠我接济的钱根本活不下去。我就问她：‘为什么不找个半天的兼职做做？那样就能减轻我的一些小笔开支。这个月我给你置办了一套新衣服，我每天给你二十法郎，帮你交了房租，而你呢？你跟朋友喝下午茶。你给他们又送咖啡又送糖。我就负责给你掏钱。我一直待你够不错的了，你却对我很差劲。’但她还是不出去工作，总说她搞不定，种种这般让我觉得自己受了骗。”\n\n男女关系在这一百年里没什么变化也是挺有趣的\n\n入狱的头些天里，最难过的一关是我还有自由人的想法。比如我总是沉溺于去沙滩游泳的幻想。想象着脚下轻柔的细浪，水漫过全身的感觉，我在想象中体会到的释放感，反过来残忍地映衬出这四面墙围成的空间多么逼仄。但这种想法只持续了几个月。后来就是彻彻底底的囚徒思维了。我期待着每天去院子里放风，或是有律师来访。其余的时光我都安排得很合理。我常常想，就算被勒令生活在枯树干里，除了看头顶的云彩就无事可做，想必我也能渐渐适应的。我将期待着鸟的飞临和流云的际会，就像在这儿期待着律师那条古怪的领带，就像在另一个时空里，我盼望挨到星期六能紧紧搂住玛丽的身体。不过，仔细想想，我并没有生活在一棵枯树里。比我更糟的人多的是。对了，妈妈经常重复一个观点，人最终会适应一切。\n\n我在山里已经呆了五六年了，没体验过什么是现代大都市，虽然每次上学都会经过南京或者上海，但是仅限于车站/机场旁边。尽管这里以旅游出名，我也从来没去过那些特别著名的地方，就连市区都很少去（因为到那里需要花费半小时到一小时，这在我家那里已经够到购物中心并且开吃了）\n\n疫情三年或许是让我适应这种生活的首要原因，我适应了这种生活、面对城市生活反而会有点恐惧，但是我终归是需要面对大城市，需要独自生活 自上个月起就打算每周都出山一次，出去吃点东西，但是到现在也没主动去过，或许我应该放下日常任务，什么都不管地出去玩一天，但是我又不知道有什么可玩的，特别是在这种天气下\n\n乡间细微的声响悄悄地潜了进来，夜晚的气味、泥土和咸味的空气让我感到凉爽。这酣睡的夏夜里，美妙的平静像潮汐般朝我涌来。就在天刚破晓时，我听见汽笛的鸣响，它宣告着一场旅途，去往一个与我的此刻再无关联的世界。这么久以来，我第一次想到了妈妈。现在，我似乎能理解为什么她生命殆尽之时还找了一个“未婚夫”，为什么她要从头来过。那边也差不多，也是一样的，在生命渐凋的养老院周围，夜色就像一场忧郁的安息。死亡近在咫尺，妈妈一定感到了解脱，并且为重生做好了准备。无人——无人有权替她哀哭。我亦如此，我已准备重新再活一遍。仿佛那阵狂怒洗净了我的苦痛，也抽空了我的希望。凝视着遍布星光、充满象征意味的夜空，我前所未有地敞开了自己，将自己交付于宇宙那温柔的冷漠。我感觉它就如我一般，像是一位兄弟，让我感到过去是幸福的，现在也是幸福的。为了耗尽一切，为了减轻几分孤独，我所期待的唯有执行死刑的那天，蜂拥而至的人群对我致以憎恶的嚎叫。","message_url":"https://t.me/bookshelf_in_storageroom/4493","reference_links":[],"reference_url":""},{"id":4502,"title":"败北女主太多了！","medium":"书","status":"在读","max_paragraphs":3,"date":"2024-07-23","year":2024,"date_label":"2024.07.23","blocks":[{"kind":"note","text":"开始看『败北女主太多了！』"},{"kind":"note","text":"第一幕就是三角恋（应该是这个词吧？），一个女的爱男的，男的爱另一个女的，或许叫肉夹馍/汉堡恋会更形象？"},{"kind":"note","text":"日本作家是不是对这种关系有特殊喜爱啊，读的小说里怎么都有这种情节"}],"paragraphs":["开始看『败北女主太多了！』","第一幕就是三角恋（应该是这个词吧？），一个女的爱男的，男的爱另一个女的，或许叫肉夹馍/汉堡恋会更形象？","日本作家是不是对这种关系有特殊喜爱啊，读的小说里怎么都有这种情节"],"excerpt":"开始看『败北女主太多了！』\n\n第一幕就是三角恋（应该是这个词吧？），一个女的爱男的，男的爱另一个女的，或许叫肉夹馍/汉堡恋会更形象？\n\n日本作家是不是对这种关系有特殊喜爱啊，读的小说里怎么都有这种情节","message_url":"https://t.me/bookshelf_in_storageroom/4502","reference_links":[],"reference_url":""},{"id":4512,"title":"败北女主太多了！","medium":"书","status":"在读","max_paragraphs":5,"date":"2024-07-24","year":2024,"date_label":"2024.07.24","blocks":[{"kind":"note","text":"继续看这本书"},{"kind":"note","text":"这个男主是魅魔吗？他简直活在一个所有女性都被他催眠的世界里"},{"kind":"note","text":"作者写的也有问题 身边的女性对男主态度都这样了还觉得自己挺孤单，那些情节，当读者是弱智吗？完全为了搞笑而搞笑"},{"kind":"note","text":"就算是文化差异的话，属实有点过头了吧"},{"kind":"note","text":"不过已经出了番剧，或许看那个会更好一点"}],"paragraphs":["继续看这本书","这个男主是魅魔吗？他简直活在一个所有女性都被他催眠的世界里","作者写的也有问题 身边的女性对男主态度都这样了还觉得自己挺孤单，那些情节，当读者是弱智吗？完全为了搞笑而搞笑","就算是文化差异的话，属实有点过头了吧","不过已经出了番剧，或许看那个会更好一点"],"excerpt":"继续看这本书\n\n这个男主是魅魔吗？他简直活在一个所有女性都被他催眠的世界里\n\n作者写的也有问题 身边的女性对男主态度都这样了还觉得自己挺孤单，那些情节，当读者是弱智吗？完全为了搞笑而搞笑\n\n就算是文化差异的话，属实有点过头了吧\n\n不过已经出了番剧，或许看那个会更好一点","message_url":"https://t.me/bookshelf_in_storageroom/4512","reference_links":[],"reference_url":""},{"id":4528,"title":"我的幸福婚约","medium":"书","status":"弃读","date":"2024-07-26","year":2024,"date_label":"2024.07.26","blocks":[{"kind":"note","text":"在看『我的幸福婚约』"},{"kind":"note","text":"故事以「不得不」开头，女主过着凄惨的生活：狠毒的继母，蛮横的继妹，冷漠的父亲和被欺负的她 被从家里丢出来，并被指认给以刁难未婚妻出名的大家族继承人，而且他很有实力"},{"kind":"note","text":"女主不得不接受这个婚约，要不然她就活不下去了，男主为啥要接我还没看到，但是换了那么多个未婚妻还在继续，应该也是另有隐情"},{"kind":"note","text":"两人的关系以一个个「误会」开始，因为初次接触，两人又都是内心温柔的人，在脑补的情况下两个人的关系开始升温"},{"kind":"note","text":"整本书应该是以女主的视角进行叙述，盲猜接下来的情节是：三十年河东三十年河西，莫欺少女穷，这斋森家，我看到此为止吧！"}],"paragraphs":["在看『我的幸福婚约』","故事以「不得不」开头，女主过着凄惨的生活：狠毒的继母，蛮横的继妹，冷漠的父亲和被欺负的她 被从家里丢出来，并被指认给以刁难未婚妻出名的大家族继承人，而且他很有实力","女主不得不接受这个婚约，要不然她就活不下去了，男主为啥要接我还没看到，但是换了那么多个未婚妻还在继续，应该也是另有隐情","两人的关系以一个个「误会」开始，因为初次接触，两人又都是内心温柔的人，在脑补的情况下两个人的关系开始升温","整本书应该是以女主的视角进行叙述，盲猜接下来的情节是：三十年河东三十年河西，莫欺少女穷，这斋森家，我看到此为止吧！"],"excerpt":"在看『我的幸福婚约』\n\n故事以「不得不」开头，女主过着凄惨的生活：狠毒的继母，蛮横的继妹，冷漠的父亲和被欺负的她 被从家里丢出来，并被指认给以刁难未婚妻出名的大家族继承人，而且他很有实力\n\n女主不得不接受这个婚约，要不然她就活不下去了，男主为啥要接我还没看到，但是换了那么多个未婚妻还在继续，应该也是另有隐情\n\n两人的关系以一个个「误会」开始，因为初次接触，两人又都是内心温柔的人，在脑补的情况下两个人的关系开始升温\n\n整本书应该是以女主的视角进行叙述，盲猜接下来的情节是：三十年河东三十年河西，莫欺少女穷，这斋森家，我看到此为止吧！","message_url":"https://t.me/bookshelf_in_storageroom/4528","reference_links":[],"reference_url":""},{"id":4550,"title":"概率导论","medium":"书","status":"在读","date":"2024-07-28","year":2024,"date_label":"2024.07.28","blocks":[{"kind":"note","text":"今天勉强看完了第三章的内容 这一章主要是讲随机变量的东西，PDF/CDF，以及贝叶斯准则的使用 用贝叶斯把未知的量用已知的量进行表示，在变分推断里面也有相关技巧，我总是想不起来"}],"paragraphs":["今天勉强看完了第三章的内容 这一章主要是讲随机变量的东西，PDF/CDF，以及贝叶斯准则的使用 用贝叶斯把未知的量用已知的量进行表示，在变分推断里面也有相关技巧，我总是想不起来"],"excerpt":"今天勉强看完了第三章的内容 这一章主要是讲随机变量的东西，PDF/CDF，以及贝叶斯准则的使用 用贝叶斯把未知的量用已知的量进行表示，在变分推断里面也有相关技巧，我总是想不起来","message_url":"https://t.me/bookshelf_in_storageroom/4550","reference_links":[],"reference_url":""},{"id":4552,"title":"软瘾","medium":"书","status":"在读","max_paragraphs":4,"date":"2024-07-29","year":2024,"date_label":"2024.07.29","blocks":[{"kind":"note","text":"在看『软瘾』，主要内容就如副标题所说「终结那些窃取你时间、夺走你生活的强迫性习惯」"},{"kind":"note","text":"这本书的英文版是二十年前出现的，而作者的实践是三十年前开始的"},{"kind":"note","text":"读的时候我突然想到，对于「找到自我目标、自我实现」或者说更大范围上的「精神修行、灵修」领域，从三十年前到现在有什么发展呢？"},{"kind":"note","text":"这个领域关注精神，又比宗教更自由，应该很容易创新吧？但是我看了这本书的前言，还是「要认识真正的你自己，你现在看到的不是真实的你，勇敢面对真实的自己」这种观点（我只是看了前言，剩下的还没看）"}],"paragraphs":["在看『软瘾』，主要内容就如副标题所说「终结那些窃取你时间、夺走你生活的强迫性习惯」","这本书的英文版是二十年前出现的，而作者的实践是三十年前开始的","读的时候我突然想到，对于「找到自我目标、自我实现」或者说更大范围上的「精神修行、灵修」领域，从三十年前到现在有什么发展呢？","这个领域关注精神，又比宗教更自由，应该很容易创新吧？但是我看了这本书的前言，还是「要认识真正的你自己，你现在看到的不是真实的你，勇敢面对真实的自己」这种观点（我只是看了前言，剩下的还没看）"],"excerpt":"在看『软瘾』，主要内容就如副标题所说「终结那些窃取你时间、夺走你生活的强迫性习惯」\n\n这本书的英文版是二十年前出现的，而作者的实践是三十年前开始的\n\n读的时候我突然想到，对于「找到自我目标、自我实现」或者说更大范围上的「精神修行、灵修」领域，从三十年前到现在有什么发展呢？\n\n这个领域关注精神，又比宗教更自由，应该很容易创新吧？但是我看了这本书的前言，还是「要认识真正的你自己，你现在看到的不是真实的你，勇敢面对真实的自己」这种观点（我只是看了前言，剩下的还没看）","message_url":"https://t.me/bookshelf_in_storageroom/4552","reference_links":[],"reference_url":""},{"id":4561,"title":"软瘾","medium":"书","status":"随记","featured":true,"max_paragraphs":6,"date":"2024-07-30","year":2024,"date_label":"2024.07.30","blocks":[{"kind":"note","text":"继续看『软瘾』"},{"kind":"note","text":"这本书的大段文字都是在讲一个东西，甚至都是一个概念反复的用不同的话说出来"},{"kind":"note","text":"但是这对我的阅读很有帮助，因为我老是分心，陷入自己的想法中，这样即便是几句话没注意到也不紧要"},{"kind":"note","text":"我现在的问题在于：我的能力无法完成我的欲望，主要是我的欲望的问题"},{"kind":"note","text":"我的欲望几乎全部都来自于互联网，互联网的推送给了我不切实际的幻想：我也能像TA们那样完成某个成就"},{"kind":"note","text":"但是在现实和互联网直接有个巨大的障碍物，一个能够完成的欲望应当是基于现实而产生的，完全从互联网上生成的欲望和意淫没什么区别"},{"kind":"note","text":"互联网起的作用大概是告诉我「有人这么做成功了」，一个远处的灯塔"}],"paragraphs":["继续看『软瘾』","这本书的大段文字都是在讲一个东西，甚至都是一个概念反复的用不同的话说出来","但是这对我的阅读很有帮助，因为我老是分心，陷入自己的想法中，这样即便是几句话没注意到也不紧要","我现在的问题在于：我的能力无法完成我的欲望，主要是我的欲望的问题","我的欲望几乎全部都来自于互联网，互联网的推送给了我不切实际的幻想：我也能像TA们那样完成某个成就","但是在现实和互联网直接有个巨大的障碍物，一个能够完成的欲望应当是基于现实而产生的，完全从互联网上生成的欲望和意淫没什么区别","互联网起的作用大概是告诉我「有人这么做成功了」，一个远处的灯塔"],"excerpt":"继续看『软瘾』\n\n这本书的大段文字都是在讲一个东西，甚至都是一个概念反复的用不同的话说出来\n\n但是这对我的阅读很有帮助，因为我老是分心，陷入自己的想法中，这样即便是几句话没注意到也不紧要\n\n我现在的问题在于：我的能力无法完成我的欲望，主要是我的欲望的问题\n\n我的欲望几乎全部都来自于互联网，互联网的推送给了我不切实际的幻想：我也能像TA们那样完成某个成就\n\n但是在现实和互联网直接有个巨大的障碍物，一个能够完成的欲望应当是基于现实而产生的，完全从互联网上生成的欲望和意淫没什么区别\n\n互联网起的作用大概是告诉我「有人这么做成功了」，一个远处的灯塔","message_url":"https://t.me/bookshelf_in_storageroom/4561","reference_links":[],"reference_url":""},{"id":4568,"title":"软瘾","medium":"书","status":"在读","date":"2024-07-31","year":2024,"date_label":"2024.07.31","blocks":[{"kind":"note","text":"继续看『软瘾』"},{"kind":"note","text":"这一章写了一个概念：核心决定"},{"kind":"note","text":"简单来说，就是和自己做一个承诺，一个自己真心认可的，可行的梦想（比如我想用心于生活）"},{"kind":"note","text":"它实际上就相当于一个判断句，附加在生活中所做的每个决定之前："},{"kind":"note","text":"好烦，玩会游戏吧 等等，这有利于我用心于生活吗？"},{"kind":"note","text":"半夜又想吃点东西了 等等，我真的需要食物吗？"},{"kind":"note","text":"我以前也搞过类似的实践，在初期确实很有效，但是时间一长我就会忘记这个判断，另外效果也会劣化"}],"paragraphs":["继续看『软瘾』","这一章写了一个概念：核心决定","简单来说，就是和自己做一个承诺，一个自己真心认可的，可行的梦想（比如我想用心于生活）","它实际上就相当于一个判断句，附加在生活中所做的每个决定之前：","好烦，玩会游戏吧 等等，这有利于我用心于生活吗？","半夜又想吃点东西了 等等，我真的需要食物吗？","我以前也搞过类似的实践，在初期确实很有效，但是时间一长我就会忘记这个判断，另外效果也会劣化"],"excerpt":"继续看『软瘾』\n\n这一章写了一个概念：核心决定\n\n简单来说，就是和自己做一个承诺，一个自己真心认可的，可行的梦想（比如我想用心于生活）\n\n它实际上就相当于一个判断句，附加在生活中所做的每个决定之前：\n\n好烦，玩会游戏吧 等等，这有利于我用心于生活吗？\n\n半夜又想吃点东西了 等等，我真的需要食物吗？\n\n我以前也搞过类似的实践，在初期确实很有效，但是时间一长我就会忘记这个判断，另外效果也会劣化","message_url":"https://t.me/bookshelf_in_storageroom/4568","reference_links":[],"reference_url":""},{"id":4584,"title":"软瘾","medium":"书","status":"在读","date":"2024-08-03","year":2024,"date_label":"2024.08.03","blocks":[{"kind":"note","text":"继续看『软瘾』"},{"kind":"note","text":"这一章讲了软瘾的具体特征：一项行为的动机和功能决定了它是否是软瘾 一个具体的特征就是做这件事情的时候是否会心不在焉"},{"kind":"note","text":"还有一些其他的特征比如试图掩盖它，不愿意展示在别人面前；逃避自己的真实感受，用某样东西去麻痹自己"},{"kind":"note","text":"对于逃避真实感受这个，玩游戏对我来说应该就属于这种，「大家在放松娱乐的时候都在玩游戏，所以我想放松娱乐的时候也应该玩游戏」，在玩游戏这个过程中实际上想要的放松反而没有实现 我玩的最久的游戏应该是守望先锋和泰拉瑞亚，这两个我已经很久很久没有重新下载回来了"},{"kind":"note","text":"对于鉴别自己的某项行为是否算是软瘾，书里讲的方法是问自己「我在干什么？这是我想要做的事情吗？在这种事情上花了多长时间？」"},{"kind":"note","text":"就是问自己行动的动机是什么"}],"paragraphs":["继续看『软瘾』","这一章讲了软瘾的具体特征：一项行为的动机和功能决定了它是否是软瘾 一个具体的特征就是做这件事情的时候是否会心不在焉","还有一些其他的特征比如试图掩盖它，不愿意展示在别人面前；逃避自己的真实感受，用某样东西去麻痹自己","对于逃避真实感受这个，玩游戏对我来说应该就属于这种，「大家在放松娱乐的时候都在玩游戏，所以我想放松娱乐的时候也应该玩游戏」，在玩游戏这个过程中实际上想要的放松反而没有实现 我玩的最久的游戏应该是守望先锋和泰拉瑞亚，这两个我已经很久很久没有重新下载回来了","对于鉴别自己的某项行为是否算是软瘾，书里讲的方法是问自己「我在干什么？这是我想要做的事情吗？在这种事情上花了多长时间？」","就是问自己行动的动机是什么"],"excerpt":"继续看『软瘾』\n\n这一章讲了软瘾的具体特征：一项行为的动机和功能决定了它是否是软瘾 一个具体的特征就是做这件事情的时候是否会心不在焉\n\n还有一些其他的特征比如试图掩盖它，不愿意展示在别人面前；逃避自己的真实感受，用某样东西去麻痹自己\n\n对于逃避真实感受这个，玩游戏对我来说应该就属于这种，「大家在放松娱乐的时候都在玩游戏，所以我想放松娱乐的时候也应该玩游戏」，在玩游戏这个过程中实际上想要的放松反而没有实现 我玩的最久的游戏应该是守望先锋和泰拉瑞亚，这两个我已经很久很久没有重新下载回来了\n\n对于鉴别自己的某项行为是否算是软瘾，书里讲的方法是问自己「我在干什么？这是我想要做的事情吗？在这种事情上花了多长时间？」\n\n就是问自己行动的动机是什么","message_url":"https://t.me/bookshelf_in_storageroom/4584","reference_links":[],"reference_url":""},{"id":4636,"title":"软瘾","medium":"书","status":"随记","max_paragraphs":6,"date":"2024-08-08","year":2024,"date_label":"2024.08.08","blocks":[{"kind":"note","text":"继续看『软瘾』"},{"kind":"note","text":"第四章讲的是思维中存在的偏颇想法"},{"kind":"note","text":"在我看来作者主要写的是「思维惯性」以及「由脑补产生的荒谬的因果关系」"},{"kind":"note","text":"「思维惯性」指的是人总是基于以前的经验来决定接下来该怎么办，即便这个经验是错误的 它会把真相放在注意力盲点处，让人下意识就忽略真正的解法"},{"kind":"note","text":"并且，这些惯性想法即便是摆在人面前，他也会冒出：「虽然.... 但是我有不得不坚持它的理由」 这种狡辩，为它辩护（或者说为自己辩护，假设亲口承认这种思维是错误的，那么岂不是说明自己做了很多错事？所以要想解决它还得对自己真诚）"},{"kind":"note","text":"「由脑补产生的荒谬的因果关系」指的是「因为我在抽卡前没洗手，所以这次一个金都没抽到」「早餐喝1L水对身体好」「她不喜欢我，因为我留了长头发」这种，它本身更像是一种迷信行为，是愚昧的表现"},{"kind":"note","text":"关于脑补，我有个亲身经历，因为荒谬的脑补：「我不能让别人碰到我，否则我的成绩会越来越差」，导致我精神出现了问题，在高中三年越来越严重，最后出现了幻觉 而且我清楚的知道它的内在逻辑是荒谬的，但是我还是很害怕触犯它设下的禁忌，后来逃离了高中环境才缓解，当然最后的成绩也不好，痛苦白受了 （现在一想这种逻辑其实就是对高考的恐惧）"},{"kind":"note","text":"作者最后说对偏颇想法的解决办法是：用幽默和同情心来调节它，也就是与自我和解（？ 直面自己的真实想法（感觉这本书一直在让人直面内心）"}],"paragraphs":["继续看『软瘾』","第四章讲的是思维中存在的偏颇想法","在我看来作者主要写的是「思维惯性」以及「由脑补产生的荒谬的因果关系」","「思维惯性」指的是人总是基于以前的经验来决定接下来该怎么办，即便这个经验是错误的 它会把真相放在注意力盲点处，让人下意识就忽略真正的解法","并且，这些惯性想法即便是摆在人面前，他也会冒出：「虽然.... 但是我有不得不坚持它的理由」 这种狡辩，为它辩护（或者说为自己辩护，假设亲口承认这种思维是错误的，那么岂不是说明自己做了很多错事？所以要想解决它还得对自己真诚）","「由脑补产生的荒谬的因果关系」指的是「因为我在抽卡前没洗手，所以这次一个金都没抽到」「早餐喝1L水对身体好」「她不喜欢我，因为我留了长头发」这种，它本身更像是一种迷信行为，是愚昧的表现","关于脑补，我有个亲身经历，因为荒谬的脑补：「我不能让别人碰到我，否则我的成绩会越来越差」，导致我精神出现了问题，在高中三年越来越严重，最后出现了幻觉 而且我清楚的知道它的内在逻辑是荒谬的，但是我还是很害怕触犯它设下的禁忌，后来逃离了高中环境才缓解，当然最后的成绩也不好，痛苦白受了 （现在一想这种逻辑其实就是对高考的恐惧）","作者最后说对偏颇想法的解决办法是：用幽默和同情心来调节它，也就是与自我和解（？ 直面自己的真实想法（感觉这本书一直在让人直面内心）"],"excerpt":"继续看『软瘾』\n\n第四章讲的是思维中存在的偏颇想法\n\n在我看来作者主要写的是「思维惯性」以及「由脑补产生的荒谬的因果关系」\n\n「思维惯性」指的是人总是基于以前的经验来决定接下来该怎么办，即便这个经验是错误的 它会把真相放在注意力盲点处，让人下意识就忽略真正的解法\n\n并且，这些惯性想法即便是摆在人面前，他也会冒出：「虽然.... 但是我有不得不坚持它的理由」 这种狡辩，为它辩护（或者说为自己辩护，假设亲口承认这种思维是错误的，那么岂不是说明自己做了很多错事？所以要想解决它还得对自己真诚）\n\n「由脑补产生的荒谬的因果关系」指的是「因为我在抽卡前没洗手，所以这次一个金都没抽到」「早餐喝1L水对身体好」「她不喜欢我，因为我留了长头发」这种，它本身更像是一种迷信行为，是愚昧的表现\n\n关于脑补，我有个亲身经历，因为荒谬的脑补：「我不能让别人碰到我，否则我的成绩会越来越差」，导致我精神出现了问题，在高中三年越来越严重，最后出现了幻觉 而且我清楚的知道它的内在逻辑是荒谬的，但是我还是很害怕触犯它设下的禁忌，后来逃离了高中环境才缓解，当然最后的成绩也不好，痛苦白受了 （现在一想这种逻辑其实就是对高考的恐惧）\n\n作者最后说对偏颇想法的解决办法是：用幽默和同情心来调节它，也就是与自我和解（？ 直面自己的真实想法（感觉这本书一直在让人直面内心）","message_url":"https://t.me/bookshelf_in_storageroom/4636","reference_links":[],"reference_url":""},{"id":4671,"title":"概率导论","medium":"书","status":"在读","date":"2024-08-11","year":2024,"date_label":"2024.08.11","blocks":[{"kind":"note","text":"读完了第四章，从这章开始就出现了好多没学过的内容（虽然只有五小章）"},{"kind":"note","text":"这里面的重点主要是多个随机变量之间的关系，以及由条件期望和条件方差推导出的重期望法则和全方差法则"},{"kind":"note","text":"矩母函数就和一阶矩二阶矩这些有关，它有很多优点，之前应该没学过，也不知道有哪些具体的应用"},{"kind":"note","text":"大概就是这些，希望接下来还是一周一章节的速度读完"}],"paragraphs":["读完了第四章，从这章开始就出现了好多没学过的内容（虽然只有五小章）","这里面的重点主要是多个随机变量之间的关系，以及由条件期望和条件方差推导出的重期望法则和全方差法则","矩母函数就和一阶矩二阶矩这些有关，它有很多优点，之前应该没学过，也不知道有哪些具体的应用","大概就是这些，希望接下来还是一周一章节的速度读完"],"excerpt":"读完了第四章，从这章开始就出现了好多没学过的内容（虽然只有五小章）\n\n这里面的重点主要是多个随机变量之间的关系，以及由条件期望和条件方差推导出的重期望法则和全方差法则\n\n矩母函数就和一阶矩二阶矩这些有关，它有很多优点，之前应该没学过，也不知道有哪些具体的应用\n\n大概就是这些，希望接下来还是一周一章节的速度读完","message_url":"https://t.me/bookshelf_in_storageroom/4671","reference_links":[],"reference_url":""},{"id":4724,"title":"软瘾","medium":"书","status":"随记","max_paragraphs":6,"date":"2024-08-16","year":2024,"date_label":"2024.08.16","blocks":[{"kind":"note","text":"继续读『软瘾』"},{"kind":"note","text":"读的时候我在听『时之歌』这个系列的歌，听说16岁时听的歌决定了你未来的音乐品味，时之歌的质量感觉确实如此"},{"kind":"note","text":"这部分讲的是构建自己的愿景，也就是对未来圆满生活的想象"},{"kind":"note","text":"虽然作者说构建这个愿景并不难，两分钟就足够了，但是我还是没办法想象什么是对我来说的「圆满的生活」"},{"kind":"note","text":"我想到了那张老师让学生在黑板上写下自己对未来想象的图，在别人都写要当科学家/医生/护士的时候，有个人在黑板上写了：我想平静地过完这一生，这个梦想听起来就能感觉太沉重了"},{"kind":"note","text":"继续读下去的时候，脑袋里浮现出『刀剑神域』中桐人和亚丝娜不在前线战斗，而是在某一层度假的场面，以及桐人守护亚丝娜在草地上小憩的场面"},{"kind":"note","text":"这种生活似乎就是我想要的生活，但是我和我爱的人（且爱我的人）在过上这种生活的话，我会厌倦吗？我不知道，这种生活离我太远了"},{"kind":"note","text":"我还有另一个幻想：有人能突然闯进我的生活，用无穷的热情点燃我的心，「我喜欢你，跟我走吧!」，当然还有一些附加想象，比如是某个富家女/超能力，再掺杂一些青春幻想小说里的元素之类的"},{"kind":"note","text":"那么我为什么能配得上她呢？「因为我一直在努力变得优秀，一直在朝她靠近」总之就是很小说情节一样的幻想（至于为什么不幻想我也是个富二代，大概因为我真没机会当富二代吧💔）"},{"kind":"note","text":"用这个当动力应该没啥问题"}],"paragraphs":["继续读『软瘾』","读的时候我在听『时之歌』这个系列的歌，听说16岁时听的歌决定了你未来的音乐品味，时之歌的质量感觉确实如此","这部分讲的是构建自己的愿景，也就是对未来圆满生活的想象","虽然作者说构建这个愿景并不难，两分钟就足够了，但是我还是没办法想象什么是对我来说的「圆满的生活」","我想到了那张老师让学生在黑板上写下自己对未来想象的图，在别人都写要当科学家/医生/护士的时候，有个人在黑板上写了：我想平静地过完这一生，这个梦想听起来就能感觉太沉重了","继续读下去的时候，脑袋里浮现出『刀剑神域』中桐人和亚丝娜不在前线战斗，而是在某一层度假的场面，以及桐人守护亚丝娜在草地上小憩的场面","这种生活似乎就是我想要的生活，但是我和我爱的人（且爱我的人）在过上这种生活的话，我会厌倦吗？我不知道，这种生活离我太远了","我还有另一个幻想：有人能突然闯进我的生活，用无穷的热情点燃我的心，「我喜欢你，跟我走吧!」，当然还有一些附加想象，比如是某个富家女/超能力，再掺杂一些青春幻想小说里的元素之类的","那么我为什么能配得上她呢？「因为我一直在努力变得优秀，一直在朝她靠近」总之就是很小说情节一样的幻想（至于为什么不幻想我也是个富二代，大概因为我真没机会当富二代吧💔）","用这个当动力应该没啥问题"],"excerpt":"继续读『软瘾』\n\n读的时候我在听『时之歌』这个系列的歌，听说16岁时听的歌决定了你未来的音乐品味，时之歌的质量感觉确实如此\n\n这部分讲的是构建自己的愿景，也就是对未来圆满生活的想象\n\n虽然作者说构建这个愿景并不难，两分钟就足够了，但是我还是没办法想象什么是对我来说的「圆满的生活」\n\n我想到了那张老师让学生在黑板上写下自己对未来想象的图，在别人都写要当科学家/医生/护士的时候，有个人在黑板上写了：我想平静地过完这一生，这个梦想听起来就能感觉太沉重了\n\n继续读下去的时候，脑袋里浮现出『刀剑神域』中桐人和亚丝娜不在前线战斗，而是在某一层度假的场面，以及桐人守护亚丝娜在草地上小憩的场面\n\n这种生活似乎就是我想要的生活，但是我和我爱的人（且爱我的人）在过上这种生活的话，我会厌倦吗？我不知道，这种生活离我太远了\n\n我还有另一个幻想：有人能突然闯进我的生活，用无穷的热情点燃我的心，「我喜欢你，跟我走吧!」，当然还有一些附加想象，比如是某个富家女/超能力，再掺杂一些青春幻想小说里的元素之类的\n\n那么我为什么能配得上她呢？「因为我一直在努力变得优秀，一直在朝她靠近」总之就是很小说情节一样的幻想（至于为什么不幻想我也是个富二代，大概因为我真没机会当富二代吧💔）\n\n用这个当动力应该没啥问题","message_url":"https://t.me/bookshelf_in_storageroom/4724","reference_links":[],"reference_url":""},{"id":4737,"title":"企鹅公路","medium":"番剧","status":"看完","max_paragraphs":6,"date":"2024-08-18","year":2024,"date_label":"2024.08.18","blocks":[{"kind":"note","text":"看完了这个，昨天因为时间安排出了意外就没看"},{"kind":"note","text":"说到企鹅，我想起了另一个喜欢企鹅的角色"},{"kind":"note","text":"首先，有温柔大姐姐! 画面也很精致，很鲜艳的色调，总之我爱看"},{"kind":"note","text":"再次加深了日本人是对三明治恋情（TA喜欢ta，但ta喜欢另一个TA）有特殊癖好这一刻板印象"},{"kind":"note","text":"主角是大姐姐和小男孩（小大人类型），从小孩子口中可以说一些成年人说出来就会很油腻的话：「要生气的时候，想想乳房就好了，这样就能非常平静了」「我也不是一直在想，每天只有三十分钟左右」"},{"kind":"note","text":"里面也有一些我不喜欢的情节，比如喜欢捉弄（霸凌？）别人的三人小团体，虽然最后改邪归正了 还发现了自己对于做出超格举动未成年人的戾气，幸好我是最后一代了（也有可能作者就是想让观众反感的）"},{"kind":"note","text":"最后，在分别时定下一辈子的约定，感觉这个约定好沉重，略微伤感"}],"paragraphs":["看完了这个，昨天因为时间安排出了意外就没看","说到企鹅，我想起了另一个喜欢企鹅的角色","首先，有温柔大姐姐! 画面也很精致，很鲜艳的色调，总之我爱看","再次加深了日本人是对三明治恋情（TA喜欢ta，但ta喜欢另一个TA）有特殊癖好这一刻板印象","主角是大姐姐和小男孩（小大人类型），从小孩子口中可以说一些成年人说出来就会很油腻的话：「要生气的时候，想想乳房就好了，这样就能非常平静了」「我也不是一直在想，每天只有三十分钟左右」","里面也有一些我不喜欢的情节，比如喜欢捉弄（霸凌？）别人的三人小团体，虽然最后改邪归正了 还发现了自己对于做出超格举动未成年人的戾气，幸好我是最后一代了（也有可能作者就是想让观众反感的）","最后，在分别时定下一辈子的约定，感觉这个约定好沉重，略微伤感"],"excerpt":"看完了这个，昨天因为时间安排出了意外就没看\n\n说到企鹅，我想起了另一个喜欢企鹅的角色\n\n首先，有温柔大姐姐! 画面也很精致，很鲜艳的色调，总之我爱看\n\n再次加深了日本人是对三明治恋情（TA喜欢ta，但ta喜欢另一个TA）有特殊癖好这一刻板印象\n\n主角是大姐姐和小男孩（小大人类型），从小孩子口中可以说一些成年人说出来就会很油腻的话：「要生气的时候，想想乳房就好了，这样就能非常平静了」「我也不是一直在想，每天只有三十分钟左右」\n\n里面也有一些我不喜欢的情节，比如喜欢捉弄（霸凌？）别人的三人小团体，虽然最后改邪归正了 还发现了自己对于做出超格举动未成年人的戾气，幸好我是最后一代了（也有可能作者就是想让观众反感的）\n\n最后，在分别时定下一辈子的约定，感觉这个约定好沉重，略微伤感","message_url":"https://t.me/bookshelf_in_storageroom/4737","reference_links":[],"reference_url":""},{"id":4844,"title":"Understanding Deep Learning","medium":"书","status":"在读","date":"2024-08-25","year":2024,"date_label":"2024.08.25","blocks":[{"kind":"note","text":"我在看这本书，写的很详细"},{"kind":"note","text":"配套的源代码："}],"paragraphs":["我在看这本书，写的很详细","配套的源代码："],"excerpt":"我在看这本书，写的很详细\n\n配套的源代码：","message_url":"https://t.me/bookshelf_in_storageroom/4844","reference_links":[{"lab 『平面国』"},{"kind":"note","text":"这本书的点子放在现在比较一般，但是考虑到作者是在一百四十年前写的，就只能说作者的想象力有点过于丰富了"},{"kind":"note","text":"这本书也不是单纯的科幻小说，它披着科幻的皮，讨论的是社会问题，有关女性，统治阶级，社会制度等等，放在今天也不过时（如果在现代有人写这样的小说，我毫不怀疑这会成为网络键政新梗）"},{"kind":"note","text":"总之有空的话可以看一下，也不长"}],"paragraphs":["我在读『平面国』","这本书的点子放在现在比较一般，但是考虑到作者是在一百四十年前写的，就只能说作者的想象力有点过于丰富了","这本书也不是单纯的科幻小说，它披着科幻的皮，讨论的是社会问题，有关女性，统治阶级，社会制度等等，放在今天也不过时（如果在现代有人写这样的小说，我毫不怀疑这会成为网络键政新梗）","总之有空的话可以看一下，也不长"],"excerpt":"我在读『平面国』\n\n这本书的点子放在现在比较一般，但是考虑到作者是在一百四十年前写的，就只能说作者的想象力有点过于丰富了\n\n这本书也不是单纯的科幻小说，它披着科幻的皮，讨论的是社会问题，有关女性，统治阶级，社会制度等等，放在今天也不过时（如果在现代有人写这样的小说，我毫不怀疑这会成为网络键政新梗）\n\n总之有空的话可以看一下，也不长","message_url":"https://t.me/bookshelf_in_storageroom/5429","reference_links":[],"reference_url":""},{"id":5938,"title":"我还能看到多少次满月升起","medium":"书","status":"弃读","max_paragraphs":3,"date":"2024-11-27","year":2024,"date_label":"2024.11.27","blocks":[{"kind":"note","text":"没看完『我还能看到多少次满月升起』"},{"kind":"note","text":"这是坂本龙一回顾自己一生经历而写的书，我对坂本龙一没有任何了解，只是被网络推荐过他的音乐 书里有很多人名/电影名/音乐家/音乐等等，我几乎完全没听过，所以看这本书感觉很无聊"},{"kind":"note","text":"看了几章后就直接跳到最后的后记部分，随便翻翻就结束了这次阅读"}],"paragraphs":["没看完『我还能看到多少次满月升起』","这是坂本龙一回顾自己一生经历而写的书，我对坂本龙一没有任何了解，只是被网络推荐过他的音乐 书里有很多人名/电影名/音乐家/音乐等等，我几乎完全没听过，所以看这本书感觉很无聊","看了几章后就直接跳到最后的后记部分，随便翻翻就结束了这次阅读"],"excerpt":"没看完『我还能看到多少次满月升起』\n\n这是坂本龙一回顾自己一生经历而写的书，我对坂本龙一没有任何了解，只是被网络推荐过他的音乐 书里有很多人名/电影名/音乐家/音乐等等，我几乎完全没听过，所以看这本书感觉很无聊\n\n看了几章后就直接跳到最后的后记部分，随便翻翻就结束了这次阅读","message_url":"https://t.me/bookshelf_in_storageroom/5938","reference_links":[],"reference_url":""},{"id":6051,"title":"东京八平米","medium":"书","status":"在读","max_paragraphs":4,"date":"2024-12-08","year":2024,"date_label":"2024.12.08","blocks":[{"kind":"note","text":"继续看『东京八平米』"},{"kind":"note","text":"看的过程中越发觉得自己是个乡下土狗："},{"kind":"note","text":"没去过电影院，没去过酒吧，也不知道哪里有各种展览，喝的东西只知道各种奶茶店，咖啡只知道瑞幸/幸运咖"},{"kind":"note","text":"我能想象的娱乐大概只有出山吃东西？ 但是去吃什么也是个难题..."},{"kind":"note","text":"大城市里的生活对我来说只听说过，从没真正接触过"}],"paragraphs":["继续看『东京八平米』","看的过程中越发觉得自己是个乡下土狗：","没去过电影院，没去过酒吧，也不知道哪里有各种展览，喝的东西只知道各种奶茶店，咖啡只知道瑞幸/幸运咖","我能想象的娱乐大概只有出山吃东西？ 但是去吃什么也是个难题...","大城市里的生活对我来说只听说过，从没真正接触过"],"excerpt":"继续看『东京八平米』\n\n看的过程中越发觉得自己是个乡下土狗：\n\n没去过电影院，没去过酒吧，也不知道哪里有各种展览，喝的东西只知道各种奶茶店，咖啡只知道瑞幸/幸运咖\n\n我能想象的娱乐大概只有出山吃东西？ 但是去吃什么也是个难题...\n\n大城市里的生活对我来说只听说过，从没真正接触过","message_url":"https://t.me/bookshelf_in_storageroom/6051","reference_links":[],"reference_url":""},{"id":6201,"title":"东京八平米","medium":"书","status":"随记","max_paragraphs":5,"date":"2024-12-24","year":2024,"date_label":"2024.12.24","blocks":[{"kind":"note","text":"继续看『东京八平米』"},{"kind":"note","text":"我也时常有这种想法：我没有参加那样的活动，或者没有走那条生活的方向，会不会是做错了？"},{"kind":"note","text":"我只有一些决定是知道我确实是对的，剩下的都是未可知的状态"},{"kind":"quote","text":"人生到底有没有“以上”或“以下”，这需要另外讨论，但岸君那句话让当时的我深有同感。“突然开始想‘未来干什么都可以，但无论如何也不想当上班族’。”￼这种想法确实中二，但我之前是有过的。每天同一时间出门，挤电车到公司，变成一个组织当中的螺丝钉，这样的人生有没有意思？我虽然还是热爱骑摩托车养猫的日子，但当我看见大三突然开始化妆去参加“就业活动”的同学们，目睹他们拿到录用通知书欢天喜地并被周围的人祝福时，我心底有一个模糊的问号：自己是不是错过了某件很珍贵的事情？我还想到我的家人，上着班养活一家人、每年带全家人旅游几次、盖了两栋房子、送两个女儿上学费昂贵的私立大学的父亲，我进入社会之后才明白他的厉害。我很清楚，父亲做过的这一切，我花一辈子都做不到。而我父亲就是一个所谓的普通人，每天早上挤在电车里的上班族之一。"}],"paragraphs":["继续看『东京八平米』","我也时常有这种想法：我没有参加那样的活动，或者没有走那条生活的方向，会不会是做错了？","我只有一些决定是知道我确实是对的，剩下的都是未可知的状态"],"excerpt":"继续看『东京八平米』\n\n我也时常有这种想法：我没有参加那样的活动，或者没有走那条生活的方向，会不会是做错了？\n\n我只有一些决定是知道我确实是对的，剩下的都是未可知的状态\n\n人生到底有没有“以上”或“以下”，这需要另外讨论，但岸君那句话让当时的我深有同感。“突然开始想‘未来干什么都可以，但无论如何也不想当上班族’。”￼这种想法确实中二，但我之前是有过的。每天同一时间出门，挤电车到公司，变成一个组织当中的螺丝钉，这样的人生有没有意思？我虽然还是热爱骑摩托车养猫的日子，但当我看见大三突然开始化妆去参加“就业活动”的同学们，目睹他们拿到录用通知书欢天喜地并被周围的人祝福时，我心底有一个模糊的问号：自己是不是错过了某件很珍贵的事情？我还想到我的家人，上着班养活一家人、每年带全家人旅游几次、盖了两栋房子、送两个女儿上学费昂贵的私立大学的父亲，我进入社会之后才明白他的厉害。我很清楚，父亲做过的这一切，我花一辈子都做不到。而我父亲就是一个所谓的普通人，每天早上挤在电车里的上班族之一。","message_url":"https://t.me/bookshelf_in_storageroom/6201","reference_links":[],"reference_url":""},{"id":6254,"title":"外面是夏天","medium":"书","status":"在读","max_paragraphs":5,"date":"2024-12-29","year":2024,"date_label":"2024.12.29","blocks":[{"kind":"note","text":"在看书『外面是夏天』，韩国人写的 七个短篇小说，讲的是城市生活发生的事情，因为国情类似，所以当成中国的也不是不行（书里讲的都是一些伤感的事情，失独/父母双亡/上岸第一剑之类的）"},{"kind":"note","text":"我想起了一句口号：「城市让生活更美好」，但是城市化到现在，真的更美好了吗？或许该改成：「发展让生活更美好」"},{"kind":"note","text":"当前的社会里，有太多能让人的生活坠入深渊的因素了，偏偏社会保障又没用，那就只能尝试用自己的方式避免"},{"kind":"note","text":"受限于眼界，每个人的处理方式又不一样，今天看到的网易拍的关于县中学生的视频里面就是这样，家长们/学校用战术上的勤奋掩盖战略上的懒惰 —— 感觉作者的作品有些模版化，几个短篇虽然讲的是不同的故事，但是给我的感觉都很相似"}],"paragraphs":["在看书『外面是夏天』，韩国人写的 七个短篇小说，讲的是城市生活发生的事情，因为国情类似，所以当成中国的也不是不行（书里讲的都是一些伤感的事情，失独/父母双亡/上岸第一剑之类的）","我想起了一句口号：「城市让生活更美好」，但是城市化到现在，真的更美好了吗？或许该改成：「发展让生活更美好」","当前的社会里，有太多能让人的生活坠入深渊的因素了，偏偏社会保障又没用，那就只能尝试用自己的方式避免","受限于眼界，每个人的处理方式又不一样，今天看到的网易拍的关于县中学生的视频里面就是这样，家长们/学校用战术上的勤奋掩盖战略上的懒惰 —— 感觉作者的作品有些模版化，几个短篇虽然讲的是不同的故事，但是给我的感觉都很相似"],"excerpt":"在看书『外面是夏天』，韩国人写的 七个短篇小说，讲的是城市生活发生的事情，因为国情类似，所以当成中国的也不是不行（书里讲的都是一些伤感的事情，失独/父母双亡/上岸第一剑之类的）\n\n我想起了一句口号：「城市让生活更美好」，但是城市化到现在，真的更美好了吗？或许该改成：「发展让生活更美好」\n\n当前的社会里，有太多能让人的生活坠入深渊的因素了，偏偏社会保障又没用，那就只能尝试用自己的方式避免\n\n受限于眼界，每个人的处理方式又不一样，今天看到的网易拍的关于县中学生的视频里面就是这样，家长们/学校用战术上的勤奋掩盖战略上的懒惰 —— 感觉作者的作品有些模版化，几个短篇虽然讲的是不同的故事，但是给我的感觉都很相似","message_url":"https://t.me/bookshelf_in_storageroom/6254","reference_links":[],"reference_url":""},{"id":6576,"title":"死侍与金刚狼","medium":"电影","status":"看完","date":"2025-01-25","year":2025,"date_label":"2025.01.25","blocks":[{"kind":"note","text":"看完了，没啥感觉（至少没有浪费时间的感觉 因为不怎么关注这个系列的东西好多梗都没理解，就这样吧"}],"paragraphs":["看完了，没啥感觉（至少没有浪费时间的感觉 因为不怎么关注这个系列的东西好多梗都没理解，就这样吧"],"excerpt":"看完了，没啥感觉（至少没有浪费时间的感觉 因为不怎么关注这个系列的东西好多梗都没理解，就这样吧","message_url":"https://t.me/bookshelf_in_storageroom/6576","reference_links":[{"label":"https://movie.douban.com/subject/26957900/","url":"https://movie.douban.com/subject/26957900/"}],"reference_url":"https://movie.douban.com/subject/26957900/"},{"id":6580,"title":"机器人之梦","medium":"电影","status":"看完","max_paragraphs":2,"date":"2025-01-26","year":2025,"date_label":"2025.01.26","blocks":[{"kind":"note","text":"搬一段影评："},{"kind":"quote","text":"太好看了！太好看了！太好看了！一句台词也没有！我感动的泪流满面。一直焦急等待着他们重逢没想到真的见面的时候选择了避而不见 一起不在同一个地方跳舞的时刻眼泪哗哗的流。一段关系的结束一段关系的开始我心中始终会给你留个位置，纯粹版换乘恋爱。再遇见新人时机器人已经懂得了牵手不能太用力，小狗也懂得了机器人进水会坏掉。上一段做错的在新的人身上不会再重复。好会拍啊好喜欢 不用语言的陪伴 不在身边的想念 重逢之后的放下 呜呜呜呜呜呜呜。 还有很多很有意思的桥段，雪人用头打保龄球，雪人喝饮料会变色，章鱼打鼓，机器人教小鸟飞翔，好喜欢这样的动画，心软的一塌糊涂。"},{"kind":"n 决策』\n\n一开始提出了一种常见的认识错误：好的决策不一定带来好的结果，以结果为导向会让人走向错误\n\n回想起我在期权上的经历，确实如此 我当时所做的决策似乎并没有那么糟糕，市场暴跌后反弹是常见的现象，我只是进场时间太早了而已","message_url":"https://t.me/bookshelf_in_storageroom/6794","reference_links":[],"reference_url":""},{"id":6878,"title":"对赌：信息不足时如何做出高明决策","medium":"书","status":"在读","date":"2025-02-24","year":2025,"date_label":"2025.02.24","blocks":[{"kind":"note","text":"继续看对赌 越看越觉得这就是一本成功学读物，信息含量很低，有点不想读了"}],"paragraphs":["继续看对赌 越看越觉得这就是一本成功学读物，信息含量很低，有点不想读了"],"excerpt":"继续看对赌 越看越觉得这就是一本成功学读物，信息含量很低，有点不想读了","message_url":"https://t.me/bookshelf_in_storageroom/6878","reference_links":[],"reference_url":""},{"id":7603,"title":"涛声依旧：中国社会年报 2000 年版","medium":"书","status":"在读","max_paragraphs":5,"date":"2025-04-30","year":2025,"date_label":"2025.04.30","blocks":[{"kind":"note","text":"我在看 『涛声依旧 中国社会年报 2000年版』 这是一个系列的书，但是我找到最新的似乎只到了2014年"},{"kind":"note","text":"书里面的用语很「有年代感」，而且里面讲的很多内容都可以用在现在，只要把里面的数据换成今天的就行"},{"kind":"note","text":"似乎什么都没有变 时代的发展把蛋糕做大了，矛盾一直被缓和而不是被处理，那么接下来发展速度变慢的情况下，还会重演过去的混乱吗？最近几起恶性伤人事件可能就是答案"},{"kind":"note","text":"冒出来个想法：把这些文章里面的数据换成现在的数据，然后发到知乎上会怎么样？"}],"paragraphs":["我在看 『涛声依旧 中国社会年报 2000年版』 这是一个系列的书，但是我找到最新的似乎只到了2014年","书里面的用语很「有年代感」，而且里面讲的很多内容都可以用在现在，只要把里面的数据换成今天的就行","似乎什么都没有变 时代的发展把蛋糕做大了，矛盾一直被缓和而不是被处理，那么接下来发展速度变慢的情况下，还会重演过去的混乱吗？最近几起恶性伤人事件可能就是答案","冒出来个想法：把这些文章里面的数据换成现在的数据，然后发到知乎上会怎么样？"],"excerpt":"我在看 『涛声依旧 中国社会年报 2000年版』 这是一个系列的书，但是我找到最新的似乎只到了2014年\n\n书里面的用语很「有年代感」，而且里面讲的很多内容都可以用在现在，只要把里面的数据换成今天的就行\n\n似乎什么都没有变 时代的发展把蛋糕做大了，矛盾一直被缓和而不是被处理，那么接下来发展速度变慢的情况下，还会重演过去的混乱吗？最近几起恶性伤人事件可能就是答案\n\n冒出来个想法：把这些文章里面的数据换成现在的数据，然后发到知乎上会怎么样？","message_url":"https://t.me/bookshelf_in_storageroom/7603","reference_links":[],"reference_url":""},{"id":7769,"title":"跃动青春","medium":"番剧","status":"在看","date":"2025-05-16","year":2025,"date_label":"2025.05.16","blocks":[{"kind":"note","text":"今晚上在看「跃动青春」"},{"kind":"note","text":"看到这个的时候突然想到这是不是国内制作组埋的小彩蛋？（这个角色就是那种很茶的性格）"}],"paragraphs":["今晚上在看「跃动青春」","看到这个的时候突然想到这是不是国内制作组埋的小彩蛋？（这个角色就是那种很茶的性格）"],"excerpt":"今晚上在看「跃动青春」\n\n看到这个的时候 和结尾，中间的部分没看）\n\n可能我不适合读轻小说，我觉得写得很啰嗦（似乎之前也看到文章写了这个观点，还说是由什么原因造成的）\n\n然后情感什么的也没感受到，所以大概翻了下就不看了","message_url":"https://t.me/bookshelf_in_storageroom/8875","reference_links":[],"reference_url":""},{"id":8921,"title":"啊，赤褐色的女巫！","medium":"书","status":"读完","date":"2025-08-21","year":2025,"date_label":"2025.08.21","blocks":[{"kind":"note","text":"看了短篇小说：「啊，赤褐色的女巫！」 作者是菲茨杰拉德，刚刚搜到「了不起的盖茨比」也是他的作品"},{"kind":"note","text":"相对于我平常看的文章，这里的文字看起来就很高级：卡罗琳却是灵巧而光彩夺目的，她的头发是一层亮晶晶的赤褐色波浪，她的容颜会让你想起接吻，你以为这种容貌属于你的初恋。"},{"kind":"quote","text":"突然，她微笑了一下——还是过去那样的微笑，就像复活节及其花朵那么妩媚，比往日更加温柔了。但是，不知怎的，没有九年前在书店见到的那第一次微笑的光彩和无限的期望了。这微笑虽然更为刚强，但失去了幻想，有些悲凉。"},{"kind":"note","text":"白月光本人到场都不如心中的白月光啊"},{"kind":"note","text":"以后还得多读些高质量的作品，看完后不会有时间被浪费的感觉"}],"paragraphs":["看了短篇小说：「啊，赤褐色的女巫！」 作者是菲茨杰拉德，刚刚搜到「了不起的盖茨比」也是他的作品","相对于我平常看的文章，这里的文字看起来就很高级：卡罗琳却是灵巧而光彩夺目的，她的头发是一层亮晶晶的赤褐色波浪，她的容颜会让你想起接吻，你以为这种容貌属于你的初恋。","白月光本人到场都不如心中的白月光啊","以后还得多读些高质量的作品，看完后不会有时间被浪费的感觉"],"excerpt":"看了短篇小说：「啊，赤褐色的女巫！」 作者是菲茨杰拉德，刚刚搜到「了不起的盖茨比」也是他的作品\n\n相对于我平常看的文章，这里的文字看起来就很高级：卡罗琳却是灵巧而光彩夺目的，她的头发是一层亮晶晶的赤褐色波浪，她的容颜会让你想起接吻，你以为这种容貌属于你的初恋。\n\n突然，她微笑了一下——还是过去那样的微笑，就像复活节及其花朵那么妩媚，比往日更加温柔了。但是，不知怎的，没有九年前在书店见到的那第一次微笑的光彩和无限的期望了。这微笑虽然更为刚强，但失去了幻想，有些悲凉。\n\n白月光本人到场都不如心中的白月光啊\n\n以后还得多读些高质量的作品，看完后不会有时间被浪费的感觉","message_url":"https://t.me/bookshelf_in_storageroom/8921","reference_links":[],"reference_url":""},{"id":9213,"title":"夜晚的潜水艇","medium":"书","status":"在读","max_paragraphs":3,"date":"2025-09-21","year":2025,"date_label":"2025.09.21","blocks":[{"kind":"note","text":"在飞机上看了个短篇小说：夜晚的潜水艇"},{"kind":"note","text":"故事很棒，我以前也是这么想象力丰富，想象中的情节会自行演化，每天睡觉前都在幻想，然后不知道什么时候就睡过去了"},{"kind":"note","text":"后来就不行了，我的想象能力在下降，我只能进入想象很短时间，情节也变得很刻板"}],"paragraphs":["在飞机上看了个短篇小说：夜晚的潜水艇","故事很棒，我以前也是这么想象力丰富，想象中的情节会自行演化，每天睡觉前都在幻想，然后不知道什么时候就睡过去了","后来就不行了，我的想象能力在下降，我只能进入想象很短时间，情节也变得很刻板"],"excerpt":"在飞机上看了个短篇小说：夜晚的潜水艇\n\n故事很棒，我以前也是这么想象力丰富，想象中的情节会自行演化，每天睡觉前都在幻想，然后不知道什么时候就睡过去了\n\n后来就不行了，我的想象能力在下降，我只能进入想象很短时间，情节也变得很刻板","message_url":"https://t.me/bookshelf_in_storageroom/9213","reference_links" 所有产品都当成次品，这样才能避免损失 第四章讲的是樱桃（优品）为了不让市场崩溃，会发出特殊的「信号」让买家知道它是优品，值得购买，这里作者用了劳动力市场来解释：为什么明知道学位不是唯一证明能力的方式，但是企业大多会选择以此为门槛，这是双方在一步步建立信任 广告和无条件退款都是在证明自身的可信程度"},{"kind":"note","text":"第五章讲的是拍卖，我遇到需要拍卖的场景很少，用到方法是荷兰拍，也就是减价拍卖 小说中经常用到的是增价拍卖，我只在京东官方卖仅退货商品时用到过，这个章节也讲到了电商平台的拍卖机制 书里讲到一个比较有趣的数据：拍卖后的价格相对于固定价格卖会有折价，它解释是讨价还价的成本比较高，这样变相筛出了对价格敏感的人群（超市里牛奶1元优惠券就是为了这部分人设立的）"},{"kind":"note","text":"第六章讲的是平台，日常在互联网冲浪时经常能看到认为计划经济比市场经济更优的观点，并且在他们的论述中计划经济其实就是有个老大哥安排你每天吃啥用啥，市场经济就是广场上一堆人在以物换物，仅仅将是否有「管控」作为二者的区分点是完全不可行的，不管是什么经济都需要有一股力量维护规则"},{"kind":"note","text":"平台在做大了之后很容易就变质，它会试图用手中权力获取更大的利益，我想这就是区块链的魅力：所有的规则都明明白白的用代码写清，但是这还不够，代码没办法硬编码所有的情况，所以一个好的产品还得有一个好的团队，而不是写完代码送上链后就完事了"},{"kind":"note","text":"第七章讲的是价格不存在的市场中，该如何进行资源的分配？比如器官捐献/入学资格这些 文中用舞会上寻找舞伴来介绍延迟接受算法 在这种情况下，算法需要兼顾公平和效率，因为资源是不足的，优质的舞伴是每个人的追求，所以根据不同的任务，算法要进行对应的改造 不管怎么改，总是会有人不满，算法的目标就是要尽可能减少这些不满"}],"paragraphs":["读完了「柠檬、拍卖和互联网算法」，质量一般般，不推荐，翻译也很差","第三章讲的是柠檬（次品）的存在会让信息不对称的市场崩溃，因为买家的最优解就是把所有产品都当成次品，这样才能避免损失 第四章讲的是樱桃（优品）为了不让市场崩溃，会发出特殊的「信号」让买家知道它是优品，值得购买，这里作者用了劳动力市场来解释：为什么明知道学位不是唯一证明能力的方式，但是企业大多会选择以此为门槛，这是双方在一步步建立信任 广告和无条件退款都是在证明自身的可信程度","第五章讲的是拍卖，我遇到需要拍卖的场景很少，用到方法是荷兰拍，也就是减价拍卖 小说中经常用到的是增价拍卖，我只在京东官方卖仅退货商品时用到过，这个章节也讲到了电商平台的拍卖机制 书里讲到一个比较有趣的数据：拍卖后的价格相对于固定价格卖会有折价，它解释是讨价还价的成本比较高，这样变相筛出了对价格敏感的人群（超市里牛奶1元优惠券就是为了这部分人设立的）","第六章讲的是平台，日常在互联网冲浪时经常能看到认为计划经济比市场经济更优的观点，并且在他们的论述中计划经济其实就是有个老大哥安排你每天吃啥用啥，市场经济就是广场上一堆人在以物换物，仅仅将是否有「管控」作为二者的区分点是完全不可行的，不管是什么经济都需要有一股力量维护规则","平台在做大了之后很容易就变质，它会试图用手中权力获取更大的利益，我想这就是区块链的魅力：所有的规则都明明白白的用代码写清，但是这还不够，代码没办法硬编码所有的情况，所以一个好的产品还得有一个好的团队，而不是写完代码送上链后就完事了","第七章讲的是价格不存在的市场中，该如何进行资源的分配？比如器官捐献/入学资格这些 文中用舞会上寻找舞伴来介绍延迟接受算法 在这种情况下，算法需要兼顾公平和效率，因为资源是不足的，优质的舞伴是每个人的追求，所以根据不同的任务，算法要进行对应的改造 不管怎么改，总是会有人不满，算法的目标就是要尽可能减少这些不满"],"excerpt":"读完了「柠檬、拍卖和互联网算法」，质量一般般，不推荐，翻译也很差\n\n第三章讲的是柠檬（次品）的存在会让信息不对称的市场崩溃，因为买家的最优解就是把所有产品都当成次品，这样才能避免损失 第四章讲的是樱桃（优品）为了不让市场崩溃，会发出特殊的「信号」让买家知道它是优品，值得购买，这里作者用了劳动力市场来解释：为什么明知道学位不是唯一证明能力的方式，但是企业大多会选择以此为门槛，这是双方在一步步建立信任 广告和无条件退款都是在证明自身的可信程度\n\n第五章讲的是拍卖，我遇到需要拍卖的场景很少，用到方法是荷兰拍，也就是减价拍卖 小说中经常用到的是增价拍卖，我只在京东官方卖仅退货商品时用到过，这个章节也讲到了电商平台的拍卖机制 书里讲到一个比较有趣的数据：拍卖后的价格相对于固定价格卖会有折价，它解释是讨价还价的成本比较高，这样变相筛出了对价格敏感的人群（超市里牛奶1元优惠券就是为了这部分人设立的）\n\n第六章讲的是平台，日常在互联网冲浪时经常能看到认为计划经济比市场经济更优的观点，并且在他们的论述中计划经济其实就是有个老大哥安排你每天吃啥用啥，市场经济就是广场上一堆人在以物换物，仅仅将是否有「管控」作为二者的区分点是完全不可行的，不管是什么经济都需要有一股力量维护规则\n\n平台在做大了之后很容易就变质，它会试图用手中权力获取更大的利益，我想这就是区块链的魅力：所有的规则都明明白白的用代码写清，但是这还不够，代码没办法硬编码所有的情况，所以一个好的产品还得有一个好的团队，而不是写完代码送上链后就完事了\n\n第七章讲的是价格不存在的市场中，该如何进行资源的分配？比如器官捐献/入学资格这些 文中用舞会上寻找舞伴来介绍延迟接受算法 在这种情况下，算法需要兼顾公平和效率，因为资源是不足的，优质的舞伴是每个人的追求，所以根据不同的任务，算法要进行对应的改造 不管怎么改，总是会有人不满，算法的目标就是要尽可能减少这些不满","message_url":"https://t.me/bookshelf_in_storageroom/9516","reference_links":[],"reference_url":""},{"id":9603,"title":"故事模板：第三个选项","medium":"阅读随记","status":"随记","date":"2025-10-29","year":2025,"date_label":"2025.10.29","blocks":[{"kind":"note","text":"一个故事模版：主人公因为各种原因需要经历考验（这种考验一般都会持续寻找参与者），主人公从是或不是两个选项外找到了第三个选项"},{"kind":"note","text":"此时他可以拿到奖励，但是他决定把奖励留给接下来的参与者，并写个小纸条或者用其他传达信息的方法告诉后来人：很高兴你和我选择了同样的选项"},{"kind":"note","text":"在故事的最后，这个考验会把上一个人留下的留言告诉主人公，正好和他要留给下一个人的信息相呼应"}],"paragraphs":["一个故事模版：主人公因为各种原因需要经历考验（这种考验一般都会持续寻找参与者），主人公从是或不是两个选项外找到了第三个选项","此时他可以拿到奖励，但是他决定把奖励留给接下来的参与者，并写个小纸条或者用其他传达信息的方法告诉后来人：很高兴你和我选择了同样的选项","在故事的最后，这个考验会把上一个人留下的留言告诉主人公，正好和他要留给下一个人的信息相呼应"],"excerpt":"一个故事模版：主人公因为各种原因需要经历考验（这种考验一般都会持续寻找参与者），主人公从是或不是两个选项外找到了第三个选项\n\n此时他可以拿到奖励，但是他决定把奖励留给接下来的参与者，并写个小纸条或者用其他传达信息的方法告诉后来人：很高兴你和我选择了同样的选项\n\n在故事的最后，这个考验会把上一个人留下的留言告诉主人公，正好和他要留给下一个人的信息相呼应","message_url":"https://t.me/bookshelf_in_storageroom/9603","reference_links":[],"reference_url":""},{"id":9645,"title":"故事模板：彼此的隐瞒","medium":"阅读随记","status":"随记","date":"2025-10-31","year":2025,"date_label":"2025.10.31","blocks":[{"kind":"note","text":"一个故事模版："},{"kind":"note","text":"主人公需要欺骗对他来说很重要的人，他有不得不这么做的理由，并且这个欺骗已经持续了很长时间 此时他欺骗的对象遇到了突发情况，主人公决定不再欺骗，告诉对方事实的真相 但是当主人公袒露一切后，才知道对方其实早就知道了真实情况 两个人一直在欺骗对方，假装生活正常 故事的最后二人都感谢对方能够为自己想这么多"}],"paragraphs":["一个故事模版：","主人公需要欺骗对他来说很重要的人，他有不得不这么做的理由，并且这个欺骗已经持续了很长时间 此时他欺骗的对象遇到了突发情况，主人公决定不再欺骗，告诉对方事实的真相 但是当主人公袒露一切后，才知道对方其实早就知道了真实情况 两个人一直在欺骗对方，假装生活正常 故事的最后二人都感谢对方能够为自己想这么多"],"excerpt":"一个故事模版：\n\n主人公需要欺骗对他来说很重要的人，他有不得不这么做的理由，并且这个欺骗已经持续了很长时间 此时他欺骗的对象遇到了突发情况，主人公决定不再欺骗，告诉对方事实的真相 但是当主人公袒露一切后，才知道对方其实早就知道了真实情况 两个人一直在欺骗对方，假装生活正常 故事的最后二人都感谢对方能够为自己想这么多","message_url":"https://t.me/bookshelf_in_storageroom/9645","reference_links":[],"reference_url":""},{"id":9667,"title":"以日为鉴","medium":"书","status":"读完","max_paragraphs":5,"date":"2025-11-03","year":2025,"date_label":"2025.11.03","blocks":[{"kind":"note","text":"断断续续读完了「以日为鉴」 讲了日本从泡沫到崩溃到复苏这个过程中的一些重大事件 结合中国当前的情况，竟能如此相像 旧的观念在崩塌，新的观念还没有得到认可"},{"kind":"note","text":"书里说的出路是出海 我觉得还有另一条路：私人定制化服务 有钱人愿意付溢价购买服务，只要某个领域的有钱人很多，那么长久下来也能赚到很多的钱 （比如手工/bjd娃娃/涂装之类的"}],"paragraphs":["断断续续读完了「以日为鉴」 讲了日本从泡沫到崩溃到复苏这个过程中的一些重大事件 结合中国当前的情况，竟能如此相像 旧的观念在崩塌，新的观念还没有得到认可","书里说的出路是出海 我觉得还有另一条路：私人定制化服务 有钱人愿意付溢价购买服务，只要某个领域的有钱人很多，那么长久下来也能赚到很多的钱 （比如手工/bjd娃娃/涂装之类的"],"excerpt":"断断续续读完了「以日为鉴」 讲了日本从泡沫到崩溃到复苏这个过程中的一些重大事件 结合中国当前的情况，竟能如此相像 旧的观念在崩塌，新的观念还没有得到认可\n\n书里说的出路是出海 我觉得还有另一条路：私人定制化服务 有钱人愿意付溢价购买服务，只要某个领域的有钱人很多，那么长久下来也能赚到很多的钱 （比如手工/bjd娃娃/涂装之类的","message_url":"https://t.me/bookshelf_in_storageroom/9667","reference_links":[],"reference_url":""},{"id":9767,"title":"无声告白","medium":"书","status":"在读","featured":true,"max_paragraphs":6,"date":"2025-11-13","year":2025,"date_label":"2025.11.13","blocks":[{"kind":"note","text":"「无声告白」看到后半部分，我才意识到讲的就是老中父母和他们忍受衡水模式的子女们（可能在江苏上学更贴合实际一些）的故事，只不过故事发生在美国，又混合了种族歧视、同性恋等更复杂的社会背景"},{"kind":"note","text":"故事里的父亲问题很大，出轨，自卑，他害怕子女重复自己人生的阴影，却又没有真正的能力和方法去保护他们。母亲的问题同样严重——她把自己的愿望、恐惧、理想投射到大女儿身上，误以为那就是大女儿的真实渴望。 父母的教育方向，一个是要合群，一个是要出众 大女儿无法同时兼顾这两个方向，只能不断撒谎来填补父母做的美梦"},{"kind":"note","text":"子女们知道这个家的氛围有问题，但是无法逃离，只好相互依偎着取暖 而当其中一个人被「允许」离开，剩下的家庭成员就会承受更沉重的压力 心理重负也随之层层堆叠：大女儿比母亲更早知道父亲的出轨；她知道邻居家的儿子对自己的哥哥怀有情愫 一切隐秘、未言的情绪像潮水一样，推着她走向某种蜕变，但她倒在了最后一步 如果在那个晚上，她不是选择跳入湖中游泳，而是绕湖跑一圈，她就不会死。她会在阳光之下，把父母的幻梦彻底戳破，她会以一种更真实的方式活下去"},{"kind":"note","text":"—— 另外一个比较幽默的事情是，在小红书上刷到一个评论问可不可以给她的女儿推荐这本书（练习英文或者就是多读书？）"}],"paragraphs":["「无声告白」看到后半部分，我才意识到讲的就是老中父母和他们忍受衡水模式的子女们（可能在江苏上学更贴合实际一些）的故事，只不过故事发生在美国，又混合了种族歧视、同性恋等更复杂的社会背景","故事里的父亲问题很大，出轨，自卑，他害怕子女重复自己人生的阴影，却又没有真正的能力和方法去保护他们。母亲的问题同样严重——她把自己的愿望、恐惧、理想投射到大女儿身上，误以为那就是大女儿的真实渴望。 父母的教育方向，一个是要合群，一个是要出众 大女儿无法同时兼顾这两个方向，只能不断撒谎来填补父母做的美梦","子女们知道这个家的氛围有问题，但是无法逃离，只好相互依偎着取暖 而当其中一个人被「允许」离开，剩下的家庭成员就会承受更沉重的压力 心理重负也随之层层堆叠：大女儿比母亲更早知道父亲的出轨；她知道邻居家的儿子对自己的哥哥怀有情愫 一切隐秘、未言的情绪像潮水一样，推着她走向某种蜕变，但她倒在了最后一步 如果在那个晚上，她不是选择跳入湖中游泳，而是绕湖跑一圈，她就不会死。她会在阳光之下，把父母的幻梦彻底戳破，她会以一种更真实的方式活下去","—— 另外一个比较幽默的事情是，在小红书上刷到一个评论问可不可以给她的女儿推荐这本书（练习英文或者就是多读书？）"],"excerpt":"「无声告白」看到后半部分，我才意识到讲的就是老中父母和他们忍受衡水模式的子女们（可能在江苏上学更贴合实际一些）的故事，只不过故事发生在美国，又混合了种族歧视、同性恋等更复杂的社会背景\n\n故事里的父亲问题很大，出轨，自卑，他害怕子女重复自己人生的阴影，却又没有真正的能力和方法去保护他们。母亲的问题同样严重——她把自己的愿望、恐惧、理想投射到大女儿身上，误以为那就是大女儿的真实渴望。 父母的教育方向，一个是要合群，一个是要出众 大女儿无法同时兼顾这两个方向，只能不断撒谎来填补父母做的美梦\n\n子女们知道这个家的氛围有问题，但是无法逃离，只好相互依偎着取暖 而当其中一个人被「允许」离开，剩下的家庭成员就会承受更沉重的压力 心理重负也随之层层堆叠：大女儿比母亲更早知道父亲的出轨；她知道邻居家的儿子对自己的哥哥怀有情愫 一切隐秘、未言的情绪像潮水一样，推着她走向某种蜕变，但她倒在了最后一步 如果在那个晚上，她不是选择跳入湖中游泳，而是绕湖跑一圈，她就不会死。她会在阳光之下，把父母的幻梦彻底戳破，她会以一种更真实的方式活下去\n\n—— 另外一个比较幽默的事情是，在小红书上刷到一个评论问可不可以给她的女儿推荐这本书（练习英文或者就是多读书？）","message_url":"https://t.me/bookshelf_in_storageroom/9767","reference_links":[],"reference_url":""},{"id":9912,"title":"一个人的好天气","medium":"书","status":"读完","date":"2025-11-25","year":2025,"date_label":"2025.11.25","blocks":[{"kind":"note","text":"看完了 「一个人的好天气」 一般般吧，不喜欢主人公的行为，没事的时候可以看看"}],"paragraphs":["看完了 「一个人的好天气」 一般般吧，不喜欢主人公的行为，没事的时候可以看看"],"excerpt":"看完了 「一个人的好天气」 一般般吧，不喜欢主人公的行为，没事的时候可以看看","message_url":"https://t.me/bookshelf_in_storageroom/9912","reference_links":[],"reference_url":""},{"id":10018,"title":"窄门","medium":"书","status":"读完","max_paragraphs":6,"date":"2025-12-02","year":2025,"date_label":"2025.12.02","blocks":[{"kind":"note","text":"读完了「窄门」 真没意思，男女主都太奇葩了 女主读经走火入魔，放到现在多多少少也能拿来当个反邪教的案例 男主软弱无力，不懂得止损，主动当狗 不推荐，纯浪费时间"},{"kind":"note","text":"— 上面是把他们当成「人」来看的 假如把他们看成作者的「想法/没法直说的思想」，他们表现出来的就更纯粹一些 可以说他们对爱情真诚执着，也可以说是一根筋 不喜欢这种想法，遇到这种人我都绕着走"}],"paragraphs":["读完了「窄门」 真没意思，男女主都太奇葩了 女主读经走火入魔，放到现在多多少少也能拿来当个反邪教的案例 男主软弱无力，不懂得止损，主动当狗 不推荐，纯浪费时间","— 上面是把他们当成「人」来看的 假如把他们看成作者的「想法/没法直说的思想」，他们表现出来的就更纯粹一些 可以说他们对爱情真诚执着，也可以说是一根筋 不喜欢这种想法，遇到这种人我都绕着走"],"excerpt":"读完了「窄门
