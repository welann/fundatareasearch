么呢？假如我财富自由那倒还好，像养宠物图一乐也不是不行，但是我现在离这个还差得远"},{"kind":"note","text":"结婚和生子这件事情对我来说还是太远了"}],"paragraphs":["读完了「空心手帐」，没多长，大概讲的是主角假装自己怀孕了，然后工作生活的故事 是按照时间（怀孕多少月）为顺序写的，最近看的书有几本都是直接把时间当作章节名 主要想写的大概就是怀孕很艰辛，怀孕应该是一个家庭的事情而不是孕妇一个人的事情 （我觉得当前的社会制度就不支持怀孕，这个社会上大部分人都在隐性的拒绝生育）","书中具体的情节有点看不明白，一边说自己是假装怀孕，用东西填充肚子和衣服之间的空隙 但是又说医生在超声检查下看到了孩子的形状，医生的水平这么垃圾的嘛 日本作家好像风格就是这样，写出来的东西不管读者怎么理解，为了一碟醋包了顿饺子","生育能给我带来什么呢？ 一份持续十几年的，几乎无法推卸的责任，太恐怖了 如果两扇门，一边是孤独，另一边是这份责任的话，我觉得我会选择孤独的那一边 而且我能给孩子带来什么呢？假如我财富自由那倒还好，像养宠物图一乐也不是不行，但是我现在离这个还差得远","结婚和生子这件事情对我来说还是太远了"],"excerpt":"读完了「空心手帐」，没多长，大概讲的是主角假装自己怀孕了，然后工作生活的故事 是按照时间（怀孕多少月）为顺序写的，最近看的书有几本都是直接把时间当作章节名 主要想写的大概就是怀孕很艰辛，怀孕应该是一个家庭的事情而不是孕妇一个人的事情 （我觉得当前的社会制度就不支持怀孕，这个社会上大部分人都在隐性的拒绝生育）\n\n书中具体的情节有点看不明白，一边说自己是假装怀孕，用东西填充肚子和衣服之间的空隙 但是又说医生在超声检查下看到了孩子的形状，医生的水平这么垃圾的嘛 日本作家好像风格就是这样，写出来的东西不管读者怎么理解，为了一碟醋包了顿饺子\n\n生育能给我带来什么呢？ 一份持续十几年的，几乎无法推卸的责任，太恐怖了 如果两扇门，一边是孤独，另一边是这份责任的话，我觉得我会选择孤独的那一边 而且我能给孩子带来什么呢？假如我财富自由那倒还好，像养宠物图一乐也不是不行，但是我现在离这个还差得远\n\n结婚和生子这件事情对我来说还是太远了","message_url":"https://t.me/bookshelf_in_storageroom/11016","reference_links":[],"reference_url":""},{"id":11057,"title":"首尔破笑组","medium":"电视剧","status":"弃看","max_paragraphs":2,"date":"2026-02-24","year":2026,"date_label":"2026.02.24","blocks":[{"kind":"note","text":"不打算继续看「首尔破笑组」了，感觉一般般没啥意思"}],"paragraphs":["不打算继续看「首尔破笑组」了，感觉一般般没啥意思"],"excerpt":"不打算继续看「首尔破笑组」了，感觉一般般没啥意思","message_url":"https://t.me/bookshelf_in_storageroom/11057","reference_links":[],"reference_url":""},{"id":11075,"title":"胡若望的疑问","medium":"书","status":"读完","max_paragraphs":5,"date":"2026-02-26","year":2026,"date_label":"2026.02.26","blocks":[{"kind":"note","text":"看完了「胡若望的疑问」 大概讲了一个观念不同，性格固执的封建读书人（只能算是识字写字的程度），和一个想当然的西洋教会人员的游历经历 不过他大部分时间都被拘禁在一小块地方，因为他不遵守当地的规则，并且给人带来了麻烦"},{"kind":"note","text":"读完之后感觉语言非常重要，没有理解为什么两个人在出发前没有约定国外语言的学习 另外还有观念上的，在不熟悉的地方，见人说人话，见鬼说鬼话才能更快融入当地"}],"paragraphs":["看完了「胡若望的疑问」 大概讲了一个观念不同，性格固执的封建读书人（只能算是识字写字的程度），和一个想当然的西洋教会人员的游历经历 不过他大部分时间都被拘禁在一小块地方，因为他不遵守当地的规则，并且给人带来了麻烦","读完之后感觉语言非常重要，没有理解为什么两个人在出发前没有约定国外语言的学习 另外还有观念上的，在不熟悉的地方，见人说人话，见鬼说鬼话才能 里，重要的是你期望对方达成的功能，至于具体的肉体是谁不重要（rust的trait？）","现在不管刷视频还是看图文，几乎都在反复灌输同一种「正确生活」：自律、健身、控糖控碳、穿得体面、把自己收拾得很精致，但是这些都是消费，而不是创造 消费提供的是一套现成模板，你只要有钱/时间/执行力，谁都可以用上，这些都是量产的身份皮肤，没有不可替代性","另外一个人一旦开始出现明显的失控，或者反复碰到那种怎么靠自己的能力都处理不了的问题，应该需要想一想是不是环境本身就有问题，需要跳出这个环境才能变正常"],"excerpt":"看完了「美国精神病人」\n\n符合刻板的华尔街金融白男（或者香港金融男）的形象\n\n主角整个人是活在一套符号系统里的，身份、职业、消费、外表、品味，这些东西是他存在的标识，离开这些符号，他就无法确定自己是谁 同样的，他对别人也是根据这些符号的组合来认识的，所以剧中有些人反复认错名字，但大家依然能若无其事继续聊下去，因为在这个系统里，重要的是你期望对方达成的功能，至于具体的肉体是谁不重要（rust的trait？）\n\n现在不管刷视频还是看图文，几乎都在反复灌输同一种「正确生活」：自律、健身、控糖控碳、穿得体面、把自己收拾得很精致，但是这些都是消费，而不是创造 消费提供的是一套现成模板，你只要有钱/时间/执行力，谁都可以用上，这些都是量产的身份皮肤，没有不可替代性\n\n另外一个人一旦开始出现明显的失控，或者反复碰到那种怎么靠自己的能力都处理不了的问题，应该需要想一想是不是环境本身就有问题，需要跳出这个环境才能变正常","message_url":"https://t.me/bookshelf_in_storageroom/12086","reference_links":[{"label":"https://neodb.social/movie/776l5OdvvA4c8uVF1nKCDr","url":"https://neodb.social/movie/776l5OdvvA4c8uVF1nKCDr"}],"reference_url":"https://neodb.social/movie/776l5OdvvA4c8uVF1nKCDr"},{"id":12173,"title":"规训与惩罚","medium":"书","status":"在读","date":"2026-05-17","year":2026,"date_label":"2026.05.17","blocks":[{"kind":"note","text":"在看「规训与惩罚」 看的迷迷糊糊，我能感受到这些文字似乎在用一个固定的风格进行”论证“？ 就像读证明一样，不过我看不懂这种格式"}],"paragraphs":["在看「规训与惩罚」 看的迷迷糊糊，我能感受到这些文字似乎在用一个固定的风格进行”论证“？ 就像读证明一样，不过我看不懂这种格式"],"excerpt":"在看「规训与惩罚」 看的迷迷糊糊，我能感受到这些文字似乎在用一个固定的风格进行”论证“？ 就像读证明一样，不过我看不懂这种格式","message_url":"https://t.me/bookshelf_in_storageroom/12173","reference_links":[],"reference_url":""},{"id":12563,"title":"在轮下","medium":"书","status":"在读","date":"2026-06-19","year":2026,"date_label":"2026.06.19","blocks":[{"kind":"note","text":"在看「在轮下」 不同年代，可能是自从有了全职学生这个身份以来，作为学生的体验好像总是相似的"}],"paragraphs":["在看「在轮下」 不同年代，可能是自从有了全职学生这个身份以来，作为学生的体验好像总是相似的"],"excerpt":"在看「在轮下」 不同年代，可能是自从有了全职学生这个身份以来，作为学生的体验好像总是相似的","message_url":"https://t.me/bookshelf_in_storageroom/12563","reference_links":[],"reference_url":""},{"id":12660,"title":"在轮下","medium":"书","status":"读完","featured":true,"max_paragraphs":5,"date":"2026-07-01","year":2026,"date_label":"2026.07.01","blocks":[{"kind":"note","text":"今天在高铁上差不多看完了「在轮下」 又是一个把故事中的人名，以及富有时代气息的名称换成现代对应的词汇后，能无缝兼容的故事 故事感觉有部分分叉结束的很仓促，比如赫尔曼离开学校那里，我读到后面还在想真的就没有来信了么？或许汉斯也是这么想的，书中的那些形象都很经典，比如"},{"kind":"quote","text":"在晚上，当同学们都在从事各式各样的消遣，做游戏、看小说时，却可以看到他在安安静静地坐着用功。别人的喧闹声对他一点妨碍也没有，他有时甚至还投去毫无怨言、心满意足的一瞥。因为假如别人也都在用功，那他的努力岂不是白费劲了？"},{"kind":"note","text":"抱有这种想法的人好贱，只能看到pvp的规则，而无法看到pve的可能性 还有那些老师和家长对于汉斯的爱好和学习之间的区别态度，明明是休息时间，但是要”弯道超车“，所以不能玩耍，看到这里拳头都握紧了"},{"kind":"note","text":"以这本书作为学生生涯结尾的话感觉还不错，我对学校这套体系的厌恶大于喜爱（如果有的话）"},{"kind":"note","text":"剩下的是一些摘抄和想法："},{"kind":"quote","text":"“你一定得听我说，”他说，“我当时太懦弱把你撂下不管。可是你是知道我的为人的：我原先坚定不移的志向是要在神学校里保持前面的名次，尽可能成为第一名。你把这称作向上爬，也许你说得对；可是它曾经是我的一种理想方式；我并不知道有什么更好的。”"},{"kind":"note","text":"学校把这套优绩主义体系灌输到学生大脑中，这对于学校和老师是最优解，至于学生出了社会会怎么样不关他们的事"},{"kind":"quote","text":"“那我就不能理解了，亲爱的年轻朋友。总是有哪里出了毛病呀。你愿不愿意答应我好好努力？”\n汉斯把手交给用严肃的宽容神情望着他的这位权威人士伸出来的右手。\n“那就好了，那就对了，老弟。千万别松劲呀！要不然会掉到车轮下面去的。”"},{"kind":"quote","text":"所有这些热心尽职的青年引路人，从校长一直到汉斯的父亲、教授和辅导教师，都认为汉斯是实现他们期望的一个障碍，是一种顽固的、怠惰的力量，必须用强力迫使他回到正路上来。也许除了那位有同情心的辅导教师外，没有一个人能看出，在这个少年瘦削的脸上那茫然的微笑后面，有一个正在沉沦的灵魂在受苦，在行将淹没时充满恐惧和绝望地向四周张望。没有一个人想到：学校，以及父亲和一些教师的野蛮的虚荣心已经把这个脆弱的生命摧残到这种地步。为什么要他在那最敏感、最容易受损伤的少年时期每天都学习到深夜？为什么夺走他的兔子？在上拉丁文学校时，为什么有意要他和同学疏远？为什么禁止他钓鱼、散步？为什么拼命向他灌输那种可怜的、耗费精力、追求虚名、空虚无聊的理想？为什么在邦试之后，他完全应得的假期也不让他享受？\n现在那匹被驱使过度的良驹已瘫在路旁，不中用了。"},{"kind":"note","text":"学校树立了一个永恒的追赶学生的车轮，以此胁迫学生向前奔跑，由恐惧激发的力量注定是不能长远的，之前刷到过有些人即便三四十岁了也会梦回高考紧张的要死，就是这种恐惧的具现化"},{"kind":"quote","text":"自从第一次的混乱印象缓和下来以及他自己也不再相信自杀这点以来，汉斯从激动和多变的恐惧状态陷进了有规律的悲伤之中，他缓慢地、无法抗拒地陷了进去，就像陷进一块软绵绵的烂泥地一样\n\n他希望自己一道消失、安眠、死亡，然而他那年轻的生命力违反这种愿望，并坚韧地默默地活着，他感到痛苦万分"},{"kind":"note","text":"自杀的痛苦有两部分，一个是自杀前的心理压力，一个是无法自杀后的心理压力，前者可能对外也可能对内，但是后者几乎注定是对内的，对自身的否定"},{"kind":"quote","text":"一切都变了，变得又美又动人。那些靠苹果葡萄渣喂肥的麻雀叽叽喳喳掠过天空，天空还从来没有这样高，这样美丽，这样蔚蓝。河流从来没有这样清澈，像面碧绿的明镜，起沫的堰堤从未有过这么耀眼洁白。一切好像是才画成的、放在明净的玻璃镜框里的装饰画，似乎在期待着盛大节日的到来。他感到心中有种奇怪大胆的感情和明显的希望，那是受约束的强烈不安而又甜蜜的波涛与胆怯恐惧的结合。那只不过是无法实现的梦想。这种矛盾的感觉愈来愈变成一种黑洞洞的汹涌的泉源，好像有股十分强劲的力量在他身上迸发、释放出来——这也许是啜泣，也许是歌唱，喊叫或大声欢笑。汉斯这种激动的心情到家后才有些缓和。自然在家里一切照旧。\n———\n他比往常醒来得晚，起先只是模模糊糊地感到不幸和惆怅。后来他才想起了爱玛。她已走了，连招呼都没打，就不辞而别了。他上一天晚上在她那儿时，她肯定已经知道。他回忆起她的笑声、她的接吻和她冷静地委身的情况。她并没有认真看待他。\n怀着对此十分气愤的痛苦，他那已被点燃而又没能得到发泄的激情在胸中翻腾，汇合成忧伤苦闷，它驱赶他离开屋子，来到花园，走上街头，进入树林，又再回到家里。\n他就是这样了解到部分恋爱的秘密，也许过早了一些。对他来说，这里面是甜少苦多。白天里尽是些没有结果的哀诉、如饥似渴的回忆、毫无希望的苦思冥想。多少个夜晚，他心悸和忧伤得无法入睡或者只做着一个又一个噩梦。在梦中，他的血液由令人难以理解的沸腾，变成庞大的、可怕的寓言故事图像，变成缠人致死的手臂，变成眼睛冒火的怪兽，变成令人头晕目眩的深渊和熊熊燃烧的大眼睛。惊醒过来，发觉自己孤独一人，周围一片凉飕飕的秋夜的寂静，他苦苦思念他的姑娘，呻吟着把脸埋在泪水浸湿的枕头里。"},{"kind":"note","text":"可怜的汉斯被人玩弄感情了，第一次恋爱还没开始就已经结束 那种美好破裂后，看记忆中的一切都好像带了层假面具的感觉我也懂🤕"},{"kind":"quote","text":"树被砍掉了主干之后，会在根旁萌发新芽，同样，在患了病和被摧残之后，人的心灵往往会回到春天般的萌芽时期和充满遐想的童年，好像它能在那里发现新的希望，把被扯断的生命线重新连接起来似的。这些根部萌发的枝条虽然茂盛多汁，生长迅速，但这种生命只是表象，它永远也不会再长成为一棵真正的树。"},{"kind":"note","text":"少年心不复存在后，即便是同个场景也不会有那种感觉了 “那时候人小小的，烦恼也小小的”"}],"paragraphs":["今天在高铁上差不多看完了「在轮下」 又是一个把故事中的人名，以及富有时代气息的名称换成现代对应的词汇后，能无缝兼容的故事 故事感觉有部分分叉结束的很仓促，比如赫尔曼离开学校那里，我读到后面还在想真的就没有来信了么？或许汉斯也是这么想的，书中的那些形象都很经典，比如","抱有这种想法的人好贱，只能看到pvp的规则，而无法看到pve的可能性 还有那些老师和家长对于汉斯的爱好和学习之间的区别态度，明明是休息时间，但是要”弯道超车“，所以不能玩耍，看到这里拳头都握紧了","以这本书作为学生生涯结尾的话感觉还不错，我对学校这套体系的厌恶大于喜爱（如果有的话）","剩下的是一些摘抄和想法：","学校把这套优绩主义体系灌输到学生大脑中，这对于学校和老师是最优解，至于学生出了社会会怎么样不关他们的事","学校树立了一个永恒的追赶学生的车轮，以此胁迫学生向前奔跑，由恐惧激发的力量注定是不能长远的，之前刷到过有些人即便三四十岁了也会梦回高考紧张的要死，就是这种恐惧的具现化","自杀的痛苦有两部分，一个是自杀前的心理压力，一个是无法自杀后的心理压力，前者可能对外也可能对内，但是后者几乎注定是对内的，对自身的否定","可怜的汉斯被人玩弄感情了，第一次恋爱还没开始就已经结束 那种美好破裂后，看记忆中的一切都好像带了层假面具的感觉我也懂🤕","少年心不复存在后，即便是同个场景也不会有那种感觉了 “那时候人小小的，烦恼也小小的”"],"excerpt":"今天在高铁上差不多看完了「在轮下」 又是一个把故事中的人名，以及富有时代气息的名称换成现代对应的词汇后，能无缝兼容的故事 故事感觉有部分分叉结束的很仓促，比如赫尔曼离开学校那里，我读到后面还在想真的就没有来信了么？或许汉斯也是这么想的，书中的那些形象都很经典，比如\n\n在晚上，当同学们都在从事各式各样的消遣，做游戏、看小说时，却可以看到他在安安静静地坐着用功。别人的喧闹声对他一点妨碍也没有，他有时甚至还投去毫无怨言、心满意足的一瞥。因为假如别人也都在用功，那他的努力岂不是白费劲了？\n\n抱有这种想法的人好贱，只能看到pvp的规则，而无法看到pve的可能性 还有那些老师和家长对于汉斯的爱好和学习之间的区别态度，明明是休息时间，但是要”弯道超车“，所以不能玩耍，看到这里拳头都握紧了\n\n以这本书作为学生生涯结尾的话感觉还不错，我对学校这套体系的厌恶大于喜爱（如果有的话）\n\n剩下的是一些摘抄和想法：\n\n“你一定得听我说，”他说，“我当时太懦弱把你撂下不管。可是你是知道我的为人的：我原先坚定不移的志向是要在神学校里保持前面的名次，尽可能成为第一名。你把这称作向上爬，也许你说得对；可是它曾经是我的一种理想方式；我并不知道有什么更好的。”\n\n学校把这套优绩主义体系灌输到学生大脑中，这对于学校和老师是最优解，至于学生出了社会会怎么样不关他们的事\n\n“那我就不能理解了，亲爱的年轻朋友。总是有哪里出了毛病呀。你愿不愿意答应我好好努力？”\n汉斯把手交给用严肃的宽容神情望着他的这位权威人士伸出来的右手。\n“那就好了，那就对了，老弟。千万别松劲呀！要不然会掉到车轮下面去的。”\n\n所有这些热心尽职的青年引路人，从校长一直到汉斯的父亲、教授和辅导教师，都认为汉斯是实现他们期望的一个障碍，是一种顽固的、怠惰的力量，必须用强力迫使他回到正路上来。也许除了那位有同情心的辅导教师外，没有一个人能看出，在这个少年瘦削的脸上那茫然的微笑后面，有一个正在沉沦的灵魂在受苦，在行将淹没时充满恐惧和绝望地向四周张望。没有一个人想到：学校，以及父亲和一些教师的野蛮的虚荣心已经把这个脆弱的生命摧残到这种地步。为什么要他在那最敏感、最容易受损伤的少年时期每天都学习到深夜？为什么夺走他的兔子？在上拉丁文学校时，为什么有意要他和同学疏远？为什么禁止他钓鱼、散步？为什么拼命向他灌输那种可怜的、耗费精力、追求虚名、空虚无聊的理想？为什么在邦试之后，他完全应得的假期也不让他享受？\n现在那匹被驱使过度的良驹已瘫在路旁，不中用了。\n\n学校树立了一个永恒的追赶学生的车轮，以此胁迫学生向前奔跑，由恐惧激发的力量注定是不能长远的，之前刷到过有些人即便三四十岁了也会梦回高考紧张的要死，就是这种恐惧的具现化\n\n自从第一次的混乱印象缓和下来以及他自己也不再相信自杀这点以来，汉斯从激动和多变的恐惧状态陷进了有规律的悲伤之中，他缓慢地、无法抗拒地陷了进去，就像陷进一块软绵绵的烂泥地一样\n\n他希望自己一道消失、安眠、死亡，然而他那年轻的生命力违反这种愿望，并坚韧地默默地活着，他感到痛苦万分\n\n自杀的痛苦有两部分，一个是自杀前的心理压力，一个是无法自杀后的心理压力，前者可能对外也可能对内，但是后者几乎注定是对内的，对自身的否定\n\n一切都变了，变得又美又动人。那些靠苹果葡萄渣喂肥的麻雀叽叽喳喳掠过天空，天空还从来没有这样高，这样美丽，这样蔚蓝。河流从来没有这样清澈，像面碧绿的明镜，起沫的堰堤从未有过这么耀眼洁白。一切好像是才画成的、放在明净的玻璃镜框里的装饰画，似乎在期待着盛大节日的到来。他感到心中有种奇怪大胆的感情和明显的希望，那是受约束的强烈不安而又甜蜜的波涛与胆怯恐惧的结合。那只不过是无法实现的梦想。这种矛盾的感觉愈来愈变成一种黑洞洞的汹涌的泉源，好像有股十分强劲的力量在他身上迸发、释放出来——这也许是啜泣，也许是歌唱，喊叫或大声欢笑。汉斯这种激动的心情到家后才有些缓和。自然在家里一切照旧。\n———\n他比往常醒来得晚，起先只是模模糊糊地感到不幸和惆怅。后来他才想起了爱玛。她已走了，连招呼都没打，就不辞而别了。他上一天晚上在她那儿时，她肯定已经知道。他回忆起她的笑声、她的接吻和她冷静地委身的情况。她并没有认真看待他。\n怀着对此十分气愤的痛苦，他那已被点燃而又没能得到发泄的激情在胸中翻腾，汇合成忧伤苦闷，它驱赶他离开屋子，来到花园，走上街头，进入树林，又再回到家里。\n他就是这样了解到部分恋爱的秘密，也许过早了一些。对他来说，这里面是甜少苦多。白天里尽是些没有结果的哀诉、如饥似渴的回忆、毫无希望的苦思冥想。多少个夜晚，他心悸和忧伤得无法入睡或者只做着一个又一个噩梦。在梦中，他的血液由令人难以理解的沸腾，变成庞大的、可怕的寓言故事图像，变成缠人致死的手臂，变成眼睛冒火的怪兽，变成令人头晕目眩的深渊和熊熊燃烧的大眼睛。惊醒过来，发觉自己孤独一人，周围一片凉飕飕的秋夜的寂静，他苦苦思念他的姑娘，呻吟着把脸埋在泪水浸湿的枕头里。\n\n可怜的汉斯被人玩弄感情了，第一次恋爱还没开始就已经结束 那种美好破裂后，看记忆中的一切都好像带了层假面具的感觉我也懂🤕\n\n树被砍掉了主干之后，会在根旁萌发新芽，同样，在患了病和被摧残之后，人的心灵往往会回到春天般的萌芽时期和充满遐想的童年，好像它能在那里发现新的希望，把被扯断的生命线重新连接起来似的。这些根部萌发的枝条虽然茂盛多汁，生长迅速，但这种生命只是表象，它永远也不会再长成为一棵真正的树。\n\n少年心不复存在后，即便是同个场景也不会有那种感觉了 “那时候人小小的，烦恼也小小的”","message_url":"https://t.me/bookshelf_in_storageroom/12660","reference_links":[],"reference_url":""},{"id":12868,"title":"悉达多","medium":"书","status":"读完","max_paragraphs":3,"date":"2026-07-18","year":2026,"date_label":"2026.07.18","blocks":[{"kind":"note","text":"火车路上看完了「悉达多」 感觉挺棒的，推荐读读 悉达多所想的问题，或者说作者遇到的问题，我也碰到过，但是我还没有开悟，或许对我来说只有死亡能终结这个问题"},{"kind":"note","text":"一些摘抄和想法："},{"kind":"note","text":"如果死亡是什么都没有的话，那可太好了"},{"kind":"quote","text":"悉达多唯一的目标是堕入空无。无渴慕，无愿望，无梦想。无喜无悲。“我”被去除，不复存在。让空洞的心灵觅得安宁，在无“我”的深思中听便奇迹。"},{"kind":"quote","text":"悉达多轻声道，仿佛自言自语：“禅定是什么？什么是脱离肉体？斋戒是什么？什么是屏息敛气？那不过是逃避‘我’，是暂时从‘我’的折磨中逃出来，是对生命的虚无和痛苦的暂时麻醉。这种逃避、麻醉，即便是驱牛者也能在客栈中找到。他只消喝上几杯米酒或发酵的椰子奶就能忘掉自己。他将感受不到生活的痛苦，他被暂时麻醉，在米酒的杯盏间昏沉入睡。他同样能获得悉达多和乔文达通过长久修习才获得的弃绝肉体与停留在无‘我’中的感受。就是这样，乔文达。”"},{"kind":"quote","text":"这位漫步者被这种思绪捕获。他驻足，旋即又从这种思绪跃至另一种新的思绪中：“我对自己一无所知。一直以来，悉达多于我极为陌生。只因我害怕自己，逃避自己！我寻找阿特曼，寻找大梵，我曾渴望的是‘我’被肢解、蜕变，以便在陌生的内在发现万物核心，发现阿特曼，发现生命，发现神性的终极之物。可在这条路上，我却迷失了自己。”"},{"kind":"note","text":"想要解决某个问题，那就得亲自接触它，需要动手，需要实践，这是我近一两年才懂得的道理"},{"kind":"quote","text":"“我曾多么麻木和迟钝！”这位疾步之人心想，“如果一个人要在一本书中探寻意义，他便会逐字逐句去阅读它，研习它，爱它；他不会忽视每一个词、每一个字，把它们看作表象，看作偶然和毫无价值的皮毛。可我哪，我这个有意研读世界之书、自我存在之书的人，却预先爱上一个臆想的意义。我忽视了书中的语词。我把现象世界看作虚妄。我视眼目所见、唇齿所尝的仅为没有价值而表面的偶然之物。不，这些都已过去。我已苏生。我切实已苏生。今天即是我的生日。"},{"kind":"note","text":"孤独感有段时间侵占了我的大脑，我不知道该去哪里发泄，最终创建了这个频道"},{"kind":"quote","text":"悉达多纹丝未动，彻骨的冰冷瞬间袭击他的心脏。他感到这颗心脏像一只小动物，一只鸟或一只兔子般在胸中颤抖。他如此孤独。多年来，他并未像现在这样意识到自己无家可归。从前，即便在最深的禅定中，他仍是父亲的儿子，高贵的婆罗门，一个修行之人。如今，他只是苏醒的悉达多，再不是别的什么人。他深吸口气，打了个寒颤。没人像他这般孤独。贵族属于贵族，手艺人属于手艺人，他们说同样的话，容身一处，分享生活。婆罗门要同婆罗门在一起。苦行者要在沙门中立足。即便归隐山林的隐士也不是独自一人，他们也有同道人，有归属。乔文达已皈依佛门，万千僧人是他的弟兄，他们着同样的僧服，信共同的信仰，说相同的话。可是他，悉达多，他属于哪里？和谁分享生活？说谁的话？"},{"kind":"note","text":"比较好奇作者在这方面的经历（"},{"kind":"quote","text":"在欢爱的路上，悉达多仍蹒跚学步。他时常冒失，求索无厌地跌入情欲深渊。而迦摩罗则教会他，不付出情欲就难收获情欲这一《爱经》的根本。每种姿势，每个动作，每次抚摸，每次对视，身体的每个角落都隐藏秘密。这些秘密，为懂得唤醒它的人预备了幸福。她教导他，爱侣在交欢后不得倏忽分离。彼此仍要相互赞叹、抚慰。这样，双方才不会因过度性满足，而产生厌倦、落寞，产生辱弄或被辱弄的不快感受"},{"kind":"note","text":"我也想啊，我希望能够正常生活，能有正常的情绪反应，能爱上别人也能被别人爱 但是我的情绪是那么少，我可能学不会什么是爱"},{"kind":"quote","text":"而他的心，他存在的源泉却不在。那眼泉十分遥远，渐渐消失在视线之外，与他的生活无关。几次，他为他意识到的这一切感到惊恐。他希望自己也能满腔热情，全心全意地参与到孩子气的日常行为中。真正地去生活、去劳作、去享乐，而不只是一位旁观者"},{"kind":"quote","text":"你是我见过的，”她思索着，“最好的情人。你比别人更强壮，更柔韧，更欲望强烈。你出色地学会我的艺术，悉达多。日后，待我年纪大些，我要有一个你的孩子。然而，亲爱的，你依然是个沙门。你并不爱我，也不爱任何人。难道不是吗？”\n“或许是。”悉达多疲惫地说，“我就像你。你也谁都不爱——否则你怎会将爱当作艺术经营？像你我这类人大概都不会爱。如孩童般的世人才会爱。这是他们的秘密。"},{"kind":"quote","text":"多年来，他一直在浑然不觉中试图且盼望成为世人。可他的生活却因为他怀着别样的目标和忧虑，远比那些孩童般的世人更加不幸和贫穷。由迦摩施瓦弥一类人构成的世界于他不过是一场游戏，一支供人观赏的舞蹈，一部闹剧。他唯一珍惜的是迦摩罗。他珍惜她——但依然珍惜吗？他还需要她，或她还需要他吗？难道他们不是在无尽的游戏中游戏？为这游戏而活可有必要？不，没有必要！这游戏叫做轮回，一种孩童游戏，一种或许可爱的游戏。一次，两次，十次——难道要不停地游戏下去？"}],"paragraphs":["火车路上看完了「悉达多」 感觉挺棒的，推荐读读 悉达多所想的问题，或者说作者遇到的问题，我也碰到过，但是我还没有开悟，或许对我来说只有死亡能终结这个问题","一些摘抄和想法：","如果死亡是什么都没有的话，那可太好了","想要解决某个问题，那就得亲自接触它，需要动手，需要实践，这是我近一两年才懂得的道理","孤独感有段时间侵占了我的大脑，我不知道该去哪里发泄，最终创建了这个频道","比较好奇作者在这方面的经历（","我也想啊，我希望能够正常生活，能有正常的情绪反应，能爱上别人也能被别人爱 但是我的情绪是那么少，我可能学不会什么是爱"],"excerpt":"火车路上看完了「悉达多」 感觉挺棒的，推荐读读 悉达多所想的问题，或者说作者遇到的问题，我也碰到过，但是我还没有开悟，或许对我来说只有死亡能终结这个问题\n\n一些摘抄和想法：\n\n如果死亡是什么都没有的话，那可太好了\n\n悉达多唯一的目标是堕入空无。无渴慕，无愿望，无梦想。无喜无悲。“我”被去除，不复存在。让空洞的心灵觅得安宁，在无“我”的深思中听便奇迹。\n\n悉达多轻声道，仿佛自言自语：“禅定是什么？什么是脱离肉体？斋戒是什么？什么是屏息敛气？那不过是逃避‘我’，是暂时从‘我’的折磨中逃出来，是对生命的虚无和痛苦的暂时麻醉。这种逃避、麻醉，即便是驱牛者也能在客栈中找到。他只消喝上几杯米酒或发酵的椰子奶就能忘掉自己。他将感受不到生活的痛苦，他被暂时麻醉，在米酒的杯盏间昏沉入睡。他同样能获得悉达多和乔文达通过长久修习才获得的弃绝肉体与停留在无‘我’中的感受。就是这样，乔文达。”\n\n这位漫步者被这种思绪捕获。他驻足，旋即又从这种思绪跃至另一种新的思绪中：“我对自己一无所知。一直以来，悉达多于我极为陌生。只因我害怕自己，逃避自己！我寻找阿特曼，寻找大梵，我曾渴望的是‘我’被肢解、蜕变，以便在陌生的内在发现万物核心，发现阿特曼，发现生命，发现神性的终极之物。可在这条路上，我却迷失了自己。”\n\n想要解决某个问题，那就得亲自接触它，需要动手，需要实践，这是我近一两年才懂得的道理\n\n“我曾多么麻木和迟钝！”这位疾步之人心想，“如果一个人要在一本书中探寻意义，他便会逐字逐句去阅读它，研习它，爱它；他不会忽视每一个词、每一个字，把它们看作表象，看作偶然和毫无价值的皮毛。可我哪，我这个有意研读世界之书、自我存在之书的人，却预先爱上一个臆想的意义。我忽视了书中的语词。我把现象世界看作虚妄。我视眼目所见、唇齿所尝的仅为没有价值而表面的偶然之物。不，这些都已过去。我已苏生。我切实已苏生。今天即是我的生日。\n\n孤独感有段时间侵占了我的大脑，我不知道该去哪里发泄，最终创建了这个频道\n\n悉达多纹丝未动，彻骨的冰冷瞬间袭击他的心脏。他感到这颗心脏像一只小动物，一只鸟或一只兔子般在胸中颤抖。他如此孤独。多年来，他并未像现在这样意识到自己无家可归。从前，即便在最深的禅定中，他仍是父亲的儿子，高贵的婆罗门，一个修行之人。如今，他只是苏醒的悉达多，再不是别的什么人。他深吸口气，打了个寒颤。没人像他这般孤独。贵族属于贵族，手艺人属于手艺人，他们说同样的话，容身一处，分享生活。婆罗门要同婆罗门在一起。苦行者要在沙门中立足。即便归隐山林的隐士也不是独自一人，他们也有同道人，有归属。乔文达已皈依佛门，万千僧人是他的弟兄，他们着同样的僧服，信共同的信仰，说相同的话。可是他，悉达多，他属于哪里？和谁分享生活？说谁的话？\n\n比较好奇作者在这方面的经历（\n\n在欢爱的路上，悉达多仍蹒跚学步。他时常冒失，求索无厌地跌入情欲深渊。而迦摩罗则教会他，不付出情欲就难收获情欲这一《爱经》的根本。每种姿势，每个动作，每次抚摸，每次对视，身体的每个角落都隐藏秘密。这些秘密，为懂得唤醒它的人预备了幸福。她教导他，爱侣在交欢后不得倏忽分离。彼此仍要相互赞叹、抚慰。这样，双方才不会因过度性满足，而产生厌倦、落寞，产生辱弄或被辱弄的不快感受\n\n我也想啊，我希望能够正常生活，能有正常的情绪反应，能爱上别人也能被别人爱 但是我的情绪是那么少，我可能学不会什么是爱\n\n而他的心，他存在的源泉却不在。那眼泉十分遥远，渐渐消失在视线之外，与他的生活无关。几次，他为他意识到的这一切感到惊恐。他希望自己也能满腔热情，全心全意地参与到孩子气的日常行为中。真正地去生活、去劳作、去享乐，而不只是一位旁观者\n\n你是我见过的，”她思索着，“最好的情人。你比别人更强壮，更柔韧，更欲望强烈。你出色地学会我的艺术，悉达多。日后，待我年纪大些，我要有一个你的孩子。然而，亲爱的，你依然是个沙门。你并不爱我，也不爱任何人。难道不是吗？”\n“或许是。”悉达多疲惫地说，“我就像你。你也谁都不爱——否则你怎会将爱当作艺术经营？像你我这类人大概都不会爱。如孩童般的世人才会爱。这是他们的秘密。\n\n多年来，他一直在浑然不觉中试图且盼望成为世人。可他的生活却因为他怀着别样的目标和忧虑，远比那些孩童般的世人更加不幸和贫穷。由迦摩施瓦弥一类人构成的世界于他不过是一场游戏，一支供人观赏的舞蹈，一部闹剧。他唯一珍惜的是迦摩罗。他珍惜她——但依然珍惜吗？他还需要她，或她还需要他吗？难道他们不是在无尽的游戏中游戏？为这游戏而活可有必要？不，没有必要！这游戏叫做轮回，一种孩童游戏，一种或许可爱的游戏。一次，两次，十次——难道要不停地游戏下去？","message_url":"https://t.me/bookshelf_in_storageroom/12868","reference_links":[],"reference_url":""},{"id":12971,"title":"长日将尽","medium":"书","status":"在读","max_paragraphs":2,"date":"2026-07-27","year":2026,"date_label":"2026.07.27","blocks":[{"kind":"note","text":"读「长日将尽」的时候，感叹作者和翻译的文学水平都太高了，好多形容词"}],"paragraphs":["读「长日将尽」的时候，感叹作者和翻译的文学水平都太高了，好多形容词"],"excerpt":"读「长日将尽」的时候，感叹作者和翻译的文学水平都太高了，好多形容词","message_url":"https://t.me/bookshelf_in_storageroom/12971","reference_links":[],"reference_url":""},{"id":13122,"title":"长日将尽","medium":"书","status":"随记","max_paragraphs":5,"date":"2026-08-12","year":2026,"date_label":"2026.08.12","blocks":[{"kind":"note","text":"虽然我也自认为社交活动上面有障碍 但是我一般不会直接说很难听的话，或是这种直接的拒绝，而是直接减少交流/接触的机会 我觉得，没有特别大的冲突的话，还是至少保留一个沟通的方式比较好 史蒂文斯的交流方式让我感觉有点虚伪（非人），可以说他确实做到了一直以来追求的管家的身份该做的事情，但是其他方面并不合格"}],"paragraphs":["虽然我也自认为社交活动上面有障碍 但是我一般不会直接说很难听的话，或是这种直接的拒绝，而是直接减少交流/接触的机会 我觉得，没有特别大的冲突的话，还是至少保留一个沟通的方式比较好 史蒂文斯的交流方式让我感觉有点虚伪（非人），可以说他确实做到了一直以来追求的管家的身份该做的事情，但是其他方面并不合格"],"excerpt":"虽然我也自认为社交活动上面有障碍 但是我一般不会直接说很难听的话，或是这种直接的拒绝，而是直接减少交流/接触的机会 我觉得，没有特别大的冲突的话，还是至少保留一个沟通的方式比较好 史蒂文斯的交流方式让我感觉有点虚伪（非人），可以说他确实做到了一直以来追求的管家的身份该做的事情，但是其他方面并不合格","message_url":"https://t.me/bookshelf_in_storageroom/13122","reference_links":[],"reference_url":""}]}</script>
  <script>
    const report = JSON.parse(document.getElementById('report-data').textContent);
    const state = { medium: '全部', query: '', newestFirst: true };
    const mediumOrder = ['书', '电影', '番剧', '电视剧', '纪录片', '漫画', '阅读随记'];
    const collator = new Intl.Collator('zh-CN');

    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };

    function shortQuote(entry, limit = 116) {
      const text = entry.paragraphs.find(p => p.length > 28) || entry.excerpt;
      return text.length > limit ? `${text.slice(0, limit).trim()}……` : text;
    }

    function renderHeader() {
      document.getElementById('entry-count').textContent = report.meta.selected_entries;
      document.getElementById('date-range').textContent = `${report.meta.date_from} — ${report.meta.date_to}`;
      document.getElementById('method-copy').textContent = report.meta.method;

      const facts = [
        ['记录范围', `${report.meta.date_from.slice(0, 4)}—${report.meta.date_to.slice(0, 4)}`],
        ['标签原档', `${report.meta.source_tagged_messages} 条`],
        ['进入正文', `${report.meta.selected_entries} 条`],
        ['涉及作品', `${report.meta.works} 部`],
        ['随文书摘', `${report.meta.quote_blocks} 段`],
        ['媒介', mediumOrder.filter(m => report.counts.medium[m]).join(' / ')]
      ];
      const factsNode = document.getElementById('facts');
      facts.forEach(([label, value]) => {
        const row = el('div', 'fact');
        row.append(el('dt', '', label), el('dd', '', value));
        factsNode.append(row);
      });

      const reel = document.getElementById('reel');
      report.entries.filter(entry => entry.featured).slice(0, 9).forEach((entry, index) => {
        const frame = el('article', 'frame');
        frame.style.setProperty('--order', index);
        const quote = el('blockquote', '', shortQuote(entry));
        const footer = el('footer');
        footer.append(el('span', '', `${entry.medium} · ${entry.title}`), el('time', '', entry.date_label));
        frame.append(quote, footer);
        reel.append(frame);
      });
    }

    function filteredEntries() {
      const query = state.query.trim().toLocaleLowerCase('zh-CN');
      return report.entries
        .filter(entry => state.medium === '全部' || entry.medium === state.medium)
        .filter(entry => !query || `${entry.title}\n${entry.excerpt}\n${entry.status}`.toLocaleLowerCase('zh-CN').includes(query))
        .sort((a, b) => {
          const dateCompare = a.date.localeCompare(b.date) || a.id - b.id;
          return state.newestFirst ? -dateCompare : dateCompare;
        });
    }

    function noteNode(entry, order) {
      const note = el('article', 'note');
      note.dataset.medium = entry.medium;
      note.style.setProperty('--order', Math.min(order, 12));

      const head = el('header', 'note-head');
      const titleBox = el('div');
      titleBox.append(el('h3', 'note-title', entry.title));
      const meta = el('div', 'note-meta');
      meta.append(
        el('time', '', entry.date_label),
        el('span', 'medium-label', entry.medium),
        el('span', 'status-label', entry.status)
      );
      titleBox.append(meta);
      const link = el('a', 'message-link', '原消息 ↗');
      link.href = entry.message_url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      head.append(titleBox, link);

      const reflectionWrap = el('div', 'reflection-wrap');
      const reflection = el('div', 'reflection');
      entry.blocks.forEach(block => {
        const tag = block.kind === 'quote' ? 'blockquote' : 'p';
        const className = `reflection-block reflection-${block.kind}`;
        reflection.append(el(tag, className, block.text));
      });
      reflectionWrap.append(reflection);
      if (entry.excerpt.length > 430 || entry.blocks.length > 4) {
        reflection.classList.add('is-collapsed');
        const button = el('button', 'expand-button', '展开完整记录');
        button.type = 'button';
        button.addEventListener('click', () => {
          const collapsed = reflection.classList.toggle('is-collapsed');
          button.textContent = collapsed ? '展开完整记录' : '收起';
        });
        reflectionWrap.append(button);
      }

      if (entry.reference_links.length) {
        const references = el('nav', 'reference-links');
        references.setAttribute('aria-label', '消息中的相关链接');
        entry.reference_links.forEach((reference, index) => {
          const referenceLink = el('a', '', `相关链接 ${index + 1} ↗`);
          referenceLink.href = reference.url;
          referenceLink.target = '_blank';
          referenceLink.rel = 'noopener noreferrer';
          references.append(referenceLink);
        });
        reflectionWrap.append(references);
      }

      note.append(head, reflectionWrap);
      return note;
    }

    function renderTimeline() {
      const entries = filteredEntries();
      const timeline = document.getElementById('timeline');
      timeline.replaceChildren();
      document.getElementById('visible-count').textContent = entries.length;
      document.getElementById('empty').classList.toggle('is-visible', entries.length === 0);

      const byYear = new Map();
      entries.forEach(entry => {
        if (!byYear.has(entry.year)) byYear.set(entry.year, []);
        byYear.get(entry.year).push(entry);
      });

      [...byYear.entries()].forEach(([year, items]) => {
        const group = el('section', 'year-group');
        group.setAttribute('aria-labelledby', `year-${year}`);
        const mark = el('h3', 'year-mark', String(year));
        mark.id = `year-${year}`;
        const notes = el('div', 'notes');
        items.forEach((entry, index) => notes.append(noteNode(entry, index)));
        group.append(mark, notes);
        timeline.append(group);
      });
    }

    document.getElementById('controls').addEventListener('click', event => {
      const button = event.target.closest('[data-medium]');
      if (!button) return;
      state.medium = button.dataset.medium;
      document.querySelectorAll('[data-medium]').forEach(item => {
        item.setAttribute('aria-pressed', String(item === button));
      });
      renderTimeline();
    });

    document.getElementById('search').addEventListener('input', event => {
      state.query = event.target.value;
      renderTimeline();
    });

    document.getElementById('sort-button').addEventListener('click', event => {
      state.newestFirst = !state.newestFirst;
      event.currentTarget.textContent = state.newestFirst ? '切到从早到晚' : '切到最新优先';
      renderTimeline();
    });

    renderHeader();
    renderTimeline();
  </script>
</body>
</html>
