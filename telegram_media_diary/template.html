<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>读过，也看过｜私人阅览档案</title>
  <meta name="description" content="从 Telegram 原始记录中提取的书、电影、番剧、电视剧与纪录片感悟。">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --ink: #172033;
      --blue: #243fbd;
      --blue-dark: #152776;
      --paper: #f7f8fc;
      --white: #ffffff;
      --mist: #dce4f5;
      --muted: #68708a;
      --red: #ed5448;
      --yellow: #f3c948;
      --cyan: #3cb7c2;
      --violet: #7b64d5;
      --green: #4a9b72;
      --line: #b8c3dc;
      --display: "STKaiti", "Kaiti SC", "KaiTi", serif;
      --body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      --utility: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--body);
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; }
    button, input { font: inherit; }
    button { color: inherit; }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 20;
      padding: 10px 14px;
      background: var(--yellow);
      transform: translateY(-160%);
    }
    .skip-link:focus { transform: translateY(0); }

    .masthead {
      color: var(--white);
      background: var(--blue);
      border-bottom: 8px solid var(--yellow);
      overflow: hidden;
    }

    .topbar {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid rgba(255,255,255,.28);
      font-family: var(--utility);
      font-size: 12px;
      letter-spacing: .07em;
    }

    .topbar a {
      text-decoration: none;
      padding: 8px 0;
    }
    .topbar a:hover { text-decoration: underline; text-underline-offset: 4px; }

    .hero {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 68px 0 50px;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(250px, .55fr);
      gap: clamp(32px, 7vw, 90px);
      align-items: end;
    }

    .kicker {
      margin: 0 0 18px;
      color: var(--yellow);
      font: 600 12px/1 var(--utility);
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font: 400 clamp(64px, 10vw, 136px)/.86 var(--display);
      letter-spacing: -.08em;
    }

    .hero-deck {
      margin: 28px 0 0;
      max-width: 690px;
      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.8;
      color: #e7ebff;
    }

    .archive-stamp {
      border: 2px solid rgba(255,255,255,.82);
      padding: 20px;
      transform: rotate(2deg);
      box-shadow: 8px 8px 0 var(--blue-dark);
    }

    .archive-stamp strong,
    .archive-stamp span { display: block; }
    .archive-stamp strong {
      font: 700 50px/1 var(--utility);
      color: var(--yellow);
    }
    .archive-stamp span {
      margin-top: 8px;
      font: 12px/1.65 var(--utility);
      letter-spacing: .08em;
    }

    .reel-wrap {
      padding: 0 0 58px;
    }
    .reel-label {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto 14px;
      font: 600 12px/1 var(--utility);
      letter-spacing: .12em;
      color: #e7ebff;
    }
    .reel {
      position: relative;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(340px, 43vw);
      gap: 14px;
      overflow-x: auto;
      padding: 34px max(20px, calc((100vw - 1180px) / 2)) 36px;
      background: #0d173f;
      scrollbar-color: var(--yellow) #0d173f;
      scroll-snap-type: x proximity;
    }
    .reel::before,
    .reel::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 13px;
      background: repeating-linear-gradient(90deg, transparent 0 17px, var(--paper) 17px 29px, transparent 29px 42px);
      opacity: .85;
      pointer-events: none;
    }
    .reel::before { top: 7px; }
    .reel::after { bottom: 7px; }

    .frame {
      min-height: 250px;
      padding: 26px 28px 24px;
      color: var(--ink);
      background: var(--white);
      border-top: 8px solid var(--red);
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .frame:nth-child(3n+2) { border-top-color: var(--yellow); }
    .frame:nth-child(3n) { border-top-color: var(--cyan); }
    .frame blockquote {
      margin: 0;
      font: 400 clamp(19px, 2.2vw, 25px)/1.7 var(--display);
    }
    .frame footer {
      margin-top: 22px;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      color: var(--muted);
      font: 11px/1.5 var(--utility);
    }

    main {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 62px 0 90px;
    }

    .ledger {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 42px;
      align-items: start;
      padding-bottom: 62px;
      border-bottom: 1px solid var(--line);
    }
    .ledger h2,
    .archive-heading h2 {
      margin: 0;
      font: 400 clamp(38px, 6vw, 68px)/1 var(--display);
      letter-spacing: -.05em;
    }
    .ledger-copy {
      margin: 20px 0 0;
      max-width: 670px;
      color: #3f4961;
      font-size: 16px;
      line-height: 1.9;
    }

    .facts {
      margin: 0;
      border-top: 2px solid var(--ink);
    }
    .fact {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 16px;
      align-items: baseline;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }
    .fact dt {
      color: var(--muted);
      font: 11px/1.4 var(--utility);
      letter-spacing: .07em;
    }
    .fact dd {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
    }

    .archive-section { padding-top: 62px; }
    .archive-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 30px;
      margin-bottom: 28px;
    }
    .archive-heading p {
      margin: 0;
      color: var(--muted);
      font: 12px/1.6 var(--utility);
      text-align: right;
    }

    .controls {
      position: sticky;
      top: 0;
      z-index: 8;
      margin: 0 0 42px;
      padding: 13px 14px;
      color: var(--white);
      background: rgba(23,32,51,.96);
      border-bottom: 4px solid var(--yellow);
      backdrop-filter: blur(10px);
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0;
    }
    .filter-button,
    .sort-button {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 8px 12px;
      color: #dfe5f3;
      background: transparent;
      border: 1px solid #68738e;
      border-radius: 0;
      cursor: pointer;
      font: 12px/1 var(--utility);
    }
    .filter-button:hover,
    .sort-button:hover { border-color: var(--white); }
    .filter-button[aria-pressed="true"] {
      color: var(--ink);
      background: var(--yellow);
      border-color: var(--yellow);
    }
    .control-spacer { flex: 1; min-width: 10px; }
    .search-wrap {
      flex: 0 0 min(270px, 38vw);
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      min-height: 38px;
      padding: 8px 12px;
      color: var(--white);
      background: #0f1728;
      border: 1px solid #68738e;
      border-radius: 0;
      outline: none;
    }
    .search-wrap input::placeholder { color: #9ca6bc; }
    .search-wrap input:focus { border-color: var(--yellow); }

    .year-group {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 34px;
      margin-bottom: 68px;
    }
    .year-mark {
      position: sticky;
      top: 82px;
      align-self: start;
      padding-top: 10px;
      font: 700 32px/1 var(--utility);
      color: var(--blue);
    }
    .year-mark::after {
      content: "";
      display: block;
      width: 40px;
      height: 7px;
      margin-top: 14px;
      background: var(--red);
    }

    .notes {
      position: relative;
      display: grid;
      gap: 22px;
    }
    .notes::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 14px;
      width: 1px;
      background: var(--line);
    }

    .note {
      --accent: var(--blue);
      position: relative;
      margin-left: 42px;
      padding: 0 0 24px 22px;
      background: var(--white);
      border-left: 7px solid var(--accent);
      box-shadow: 0 1px 0 rgba(23,32,51,.08);
    }
    .note[data-medium="电影"] { --accent: var(--red); }
    .note[data-medium="番剧"] { --accent: var(--violet); }
    .note[data-medium="电视剧"] { --accent: var(--green); }
    .note[data-medium="纪录片"] { --accent: var(--cyan); }
    .note[data-medium="漫画"] { --accent: var(--red); }
    .note[data-medium="阅读随记"] { --accent: var(--yellow); }
    .note::before {
      content: "";
      position: absolute;
      left: -55px;
      top: 26px;
      width: 13px;
      height: 13px;
      background: var(--accent);
      border: 4px solid var(--paper);
      outline: 1px solid var(--line);
    }

    .note-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      padding: 21px 22px 16px 0;
      border-bottom: 1px solid #dfe4ef;
    }
    .note-title {
      margin: 0;
      font-size: clamp(20px, 2.7vw, 29px);
      line-height: 1.25;
      letter-spacing: -.025em;
    }
    .note-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px 12px;
      margin-top: 10px;
      color: var(--muted);
      font: 11px/1.4 var(--utility);
    }
    .medium-label { color: var(--accent); font-weight: 700; }
    .status-label::before { content: "["; }
    .status-label::after { content: "]"; }
    .message-link {
      align-self: start;
      padding: 8px 0;
      color: var(--blue);
      font: 11px/1.4 var(--utility);
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }
    .message-link:hover { color: var(--red); }

    .reflection-wrap {
      position: relative;
      padding: 22px 28px 0 0;
    }
    .reflection {
      margin: 0;
      display: grid;
      gap: 16px;
      font: 400 clamp(18px, 2vw, 22px)/1.85 var(--display);
    }
    .reflection-block {
      margin: 0;
      white-space: pre-line;
    }
    .reflection-quote {
      padding: 16px 18px;
      color: #414a60;
      background: #f0f2f8;
      border-left: 3px solid var(--accent);
      font-size: .86em;
      line-height: 1.78;
    }
    .reflection-quote::before {
      content: "原文摘录";
      display: block;
      margin-bottom: 8px;
      color: var(--accent);
      font: 700 10px/1.4 var(--utility);
      letter-spacing: .1em;
    }
    .reflection.is-collapsed {
      max-height: 12.95em;
      overflow: hidden;
    }
    .reflection.is-collapsed::after {
      content: "";
      position: absolute;
      left: 0;
      right: 28px;
      bottom: 0;
      height: 4em;
      background: linear-gradient(transparent, var(--white));
      pointer-events: none;
    }
    .expand-button {
      margin-top: 17px;
      padding: 7px 0;
      color: var(--blue);
      background: transparent;
      border: 0;
      border-bottom: 1px solid currentColor;
      cursor: pointer;
      font: 11px/1 var(--utility);
    }
    .reference-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 18px;
      font: 11px/1.5 var(--utility);
    }
    .reference-links a {
      color: var(--blue);
      text-underline-offset: 4px;
    }

    .empty {
      display: none;
      padding: 46px;
      text-align: center;
      border: 1px solid var(--line);
      background: var(--white);
    }
    .empty.is-visible { display: block; }

    .page-footer {
      padding: 40px 20px;
      color: #cbd3e8;
      background: var(--ink);
      text-align: center;
      font: 11px/1.8 var(--utility);
    }
    .page-footer a { color: var(--yellow); text-underline-offset: 4px; }

    :focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 3px;
    }

    @media (max-width: 800px) {
      .hero { grid-template-columns: 1fr; padding-top: 48px; }
      .archive-stamp { max-width: 270px; }
      .ledger { grid-template-columns: 1fr; }
      .archive-heading { align-items: start; flex-direction: column; }
      .archive-heading p { text-align: left; }
      .control-row { align-items: stretch; }
      .search-wrap { flex-basis: 190px; }
      .year-group { grid-template-columns: 1fr; gap: 18px; }
      .year-mark { position: static; }
      .year-mark::after { width: 100%; height: 1px; margin-top: 10px; background: var(--line); }
      .reel { grid-auto-columns: minmax(300px, 82vw); }
    }

    @media (max-width: 520px) {
      .topbar { width: min(100% - 28px, 1180px); }
      .topbar span { display: none; }
      .hero, main, .reel-label { width: min(100% - 28px, 1180px); }
      h1 { font-size: 64px; }
      .notes::before { left: 6px; }
      .note { margin-left: 26px; padding-left: 16px; }
      .note::before { left: -35px; }
      .note-head { grid-template-columns: 1fr; gap: 4px; }
      .message-link { justify-self: start; }
      .reflection-wrap { padding-right: 18px; }
      .reflection.is-collapsed::after { right: 18px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .frame, .note { animation: arrive .45s both; animation-delay: calc(var(--order, 0) * 35ms); }
      @keyframes arrive {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }

    @media print {
      .masthead { color: var(--ink); background: var(--white); border-bottom-color: var(--ink); }
      .topbar, .reel-wrap, .controls, .expand-button { display: none !important; }
      .hero { display: block; padding: 30px 0; }
      h1 { font-size: 64px; }
      .hero-deck { color: var(--ink); }
      .archive-stamp { margin-top: 24px; box-shadow: none; border-color: var(--ink); }
      .archive-stamp strong { color: var(--ink); }
      .year-mark { position: static; }
      .note { break-inside: avoid; box-shadow: none; }
      .reflection.is-collapsed { max-height: none; }
      .reflection.is-collapsed::after { display: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#archive">跳到阅览记录</a>

  <header class="masthead">
    <div class="topbar">
      <a href="../index.html">← FUN DATA RESEARCH</a>
      <span id="date-range"></span>
    </div>
    <div class="hero">
      <div>
        <p class="kicker">Reading & viewing diary</p>
        <h1>读过，<br>也看过</h1>
        <p class="hero-deck">不是评分表，也不是推荐榜。这里只保留作品碰到生活时，你当时写下来的那部分。</p>
      </div>
      <div class="archive-stamp" aria-label="档案摘录数量">
        <strong id="entry-count">—</strong>
        <span>条阅览记录<br>纯收藏不计入</span>
      </div>
    </div>
    <div class="reel-wrap">
      <p class="reel-label">SELECTED FRAMES / 横向滑动</p>
      <div class="reel" id="reel" aria-label="精选感悟"></div>
    </div>
  </header>

  <main>
    <section class="ledger" aria-labelledby="method-title">
      <div>
        <h2 id="method-title">先辨认原话，<br>再谈作品。</h2>
        <p class="ledger-copy" id="method-copy"></p>
      </div>
      <dl class="facts" id="facts"></dl>
    </section>

    <section class="archive-section" id="archive" aria-labelledby="archive-title">
      <div class="archive-heading">
        <h2 id="archive-title">阅览切片</h2>
        <p><span id="visible-count">—</span> 条记录<br>默认最新优先</p>
      </div>

      <div class="controls" aria-label="筛选阅览记录">
        <div class="control-row" id="controls">
          <button class="filter-button" type="button" data-medium="全部" aria-pressed="true">全部</button>
          <button class="filter-button" type="button" data-medium="书" aria-pressed="false">书</button>
          <button class="filter-button" type="button" data-medium="电影" aria-pressed="false">电影</button>
          <button class="filter-button" type="button" data-medium="番剧" aria-pressed="false">番剧</button>
          <button class="filter-button" type="button" data-medium="电视剧" aria-pressed="false">电视剧</button>
          <button class="filter-button" type="button" data-medium="纪录片" aria-pressed="false">纪录片</button>
          <button class="filter-button" type="button" data-medium="漫画" aria-pressed="false">漫画</button>
          <button class="filter-button" type="button" data-medium="阅读随记" aria-pressed="false">阅读随记</button>
          <span class="control-spacer"></span>
          <button class="sort-button" id="sort-button" type="button">切到从早到晚</button>
          <label class="search-wrap">
            <span hidden>搜索作品或原话</span>
            <input id="search" type="search" placeholder="搜索作品或原话">
          </label>
        </div>
      </div>

      <div id="timeline" aria-live="polite"></div>
      <div class="empty" id="empty">没有符合当前条件的记录。换一个媒介，或清空搜索词。</div>
    </section>
  </main>

  <footer class="page-footer">
    <p>内容来自 Telegram 导出；页面只做摘录与编排，不替原话补充结论。</p>
    <p><a href="../index.html">返回统一入口</a></p>
  </footer>

  <script id="report-data" type="application/json">__REPORT_DATA__</script>
  <script>
    const report = JSON.parse(document.getElementById('report-data').textContent);
    const state = { medium: '全部', query: '', newestFirst: true };
    const mediumOrder = ['书', '电影', '番剧', '电视剧', '纪录片', '漫画', '阅读随记'];
    const collator = new Intl.Collator('zh-CN');

    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };

    function shortQuote(entry, limit = 116) {
      const text = entry.paragraphs.find(p => p.length > 28) || entry.excerpt;
      return text.length > limit ? `${text.slice(0, limit).trim()}……` : text;
    }

    function renderHeader() {
      document.getElementById('entry-count').textContent = report.meta.selected_entries;
      document.getElementById('date-range').textContent = `${report.meta.date_from} — ${report.meta.date_to}`;
      document.getElementById('method-copy').textContent = report.meta.method;

      const facts = [
        ['记录范围', `${report.meta.date_from.slice(0, 4)}—${report.meta.date_to.slice(0, 4)}`],
        ['标签原档', `${report.meta.source_tagged_messages} 条`],
        ['进入正文', `${report.meta.selected_entries} 条`],
        ['涉及作品', `${report.meta.works} 部`],
        ['随文书摘', `${report.meta.quote_blocks} 段`],
        ['媒介', mediumOrder.filter(m => report.counts.medium[m]).join(' / ')]
      ];
      const factsNode = document.getElementById('facts');
      facts.forEach(([label, value]) => {
        const row = el('div', 'fact');
        row.append(el('dt', '', label), el('dd', '', value));
        factsNode.append(row);
      });

      const reel = document.getElementById('reel');
      report.entries.filter(entry => entry.featured).slice(0, 9).forEach((entry, index) => {
        const frame = el('article', 'frame');
        frame.style.setProperty('--order', index);
        const quote = el('blockquote', '', shortQuote(entry));
        const footer = el('footer');
        footer.append(el('span', '', `${entry.medium} · ${entry.title}`), el('time', '', entry.date_label));
        frame.append(quote, footer);
        reel.append(frame);
      });
    }

    function filteredEntries() {
      const query = state.query.trim().toLocaleLowerCase('zh-CN');
      return report.entries
        .filter(entry => state.medium === '全部' || entry.medium === state.medium)
        .filter(entry => !query || `${entry.title}\n${entry.excerpt}\n${entry.status}`.toLocaleLowerCase('zh-CN').includes(query))
        .sort((a, b) => {
          const dateCompare = a.date.localeCompare(b.date) || a.id - b.id;
          return state.newestFirst ? -dateCompare : dateCompare;
        });
    }

    function noteNode(entry, order) {
      const note = el('article', 'note');
      note.dataset.medium = entry.medium;
      note.style.setProperty('--order', Math.min(order, 12));

      const head = el('header', 'note-head');
      const titleBox = el('div');
      titleBox.append(el('h3', 'note-title', entry.title));
      const meta = el('div', 'note-meta');
      meta.append(
        el('time', '', entry.date_label),
        el('span', 'medium-label', entry.medium),
        el('span', 'status-label', entry.status)
      );
      titleBox.append(meta);
      const link = el('a', 'message-link', '原消息 ↗');
      link.href = entry.message_url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      head.append(titleBox, link);

      const reflectionWrap = el('div', 'reflection-wrap');
      const reflection = el('div', 'reflection');
      entry.blocks.forEach(block => {
        const tag = block.kind === 'quote' ? 'blockquote' : 'p';
        const className = `reflection-block reflection-${block.kind}`;
        reflection.append(el(tag, className, block.text));
      });
      reflectionWrap.append(reflection);
      if (entry.excerpt.length > 430 || entry.blocks.length > 4) {
        reflection.classList.add('is-collapsed');
        const button = el('button', 'expand-button', '展开完整记录');
        button.type = 'button';
        button.addEventListener('click', () => {
          const collapsed = reflection.classList.toggle('is-collapsed');
          button.textContent = collapsed ? '展开完整记录' : '收起';
        });
        reflectionWrap.append(button);
      }

      if (entry.reference_links.length) {
        const references = el('nav', 'reference-links');
        references.setAttribute('aria-label', '消息中的相关链接');
        entry.reference_links.forEach((reference, index) => {
          const referenceLink = el('a', '', `相关链接 ${index + 1} ↗`);
          referenceLink.href = reference.url;
          referenceLink.target = '_blank';
          referenceLink.rel = 'noopener noreferrer';
          references.append(referenceLink);
        });
        reflectionWrap.append(references);
      }

      note.append(head, reflectionWrap);
      return note;
    }

    function renderTimeline() {
      const entries = filteredEntries();
      const timeline = document.getElementById('timeline');
      timeline.replaceChildren();
      document.getElementById('visible-count').textContent = entries.length;
      document.getElementById('empty').classList.toggle('is-visible', entries.length === 0);

      const byYear = new Map();
      entries.forEach(entry => {
        if (!byYear.has(entry.year)) byYear.set(entry.year, []);
        byYear.get(entry.year).push(entry);
      });

      [...byYear.entries()].forEach(([year, items]) => {
        const group = el('section', 'year-group');
        group.setAttribute('aria-labelledby', `year-${year}`);
        const mark = el('h3', 'year-mark', String(year));
        mark.id = `year-${year}`;
        const notes = el('div', 'notes');
        items.forEach((entry, index) => notes.append(noteNode(entry, index)));
        group.append(mark, notes);
        timeline.append(group);
      });
    }

    document.getElementById('controls').addEventListener('click', event => {
      const button = event.target.closest('[data-medium]');
      if (!button) return;
      state.medium = button.dataset.medium;
      document.querySelectorAll('[data-medium]').forEach(item => {
        item.setAttribute('aria-pressed', String(item === button));
      });
      renderTimeline();
    });

    document.getElementById('search').addEventListener('input', event => {
      state.query = event.target.value;
      renderTimeline();
    });

    document.getElementById('sort-button').addEventListener('click', event => {
      state.newestFirst = !state.newestFirst;
      event.currentTarget.textContent = state.newestFirst ? '切到从早到晚' : '切到最新优先';
      renderTimeline();
    });

    renderHeader();
    renderTimeline();
  </script>
</body>
</html>
